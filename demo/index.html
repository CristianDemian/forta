</head><body><style>/* Forța v2. Layout: o coloană de telefon cu antet subțire, o bandă video pe toată lățimea,
   carduri compacte și meniu plutitor; antrenamentul se deschide peste tot ecranul. */
:root {
  --bg: #0b0a0b;
  --surface: #151214;
  --surface-2: #1e191c;
  --surface-3: #282125;
  --line: rgba(255, 255, 255, .07);
  --line-2: rgba(255, 255, 255, .12);
  --fg: #f6f2f1;
  --muted: #9d9396;
  --faint: #6c6366;
  --accent: #e5232f;
  --red-hi: #ff5560;
  --red-deep: #a10f1b;
  --accent-ink: #ffffff;
  --blue: #ffffff;
  --good: #34c77b;
  --bad: #ff5a5f;
  --water: #3aa0ff;
  --sys: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, system-ui, sans-serif;
  --display: 'Saira Condensed', 'SF Pro Display', -apple-system, 'Arial Narrow', sans-serif;
  --body: var(--sys);
  --r: 16px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); min-height: 100%; overflow-x: clip; overscroll-behavior-x: none; -webkit-text-size-adjust: 100%; }
body { min-height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 400 15px/1.45 var(--sys); letter-spacing: -.01em;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; overflow-x: clip; touch-action: pan-y;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input, textarea { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
svg { flex: none; }

.app { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; min-height: 100%; padding-bottom: calc(104px + env(safe-area-inset-bottom, 0px)); }
.ambient { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.ambient i { position: absolute; border-radius: 50%; filter: blur(70px); }
.ambient i:nth-child(1) { width: 80vmax; height: 80vmax; top: -55vmax; right: -40vmax; background: var(--accent); opacity: .10; }
.ambient i:nth-child(2), .ambient i:nth-child(3) { display: none; }

/* ---------- Antet ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 11px;
  display: grid; grid-template-columns: minmax(0, 1fr); }
.top::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: repeating-linear-gradient(90deg, var(--accent) 0 18px, rgba(255,255,255,.85) 18px 36px); opacity: .9; }
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; white-space: nowrap; font: 700 19px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; }
.brand .b1 { color: var(--accent); }
.brand .b2 { margin-left: auto; color: var(--fg); }
.hbadge { height: 1.45em; width: auto; }
.today { display: none; }

main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 20px; display: grid; gap: 24px; }

/* ---------- Titluri de secțiune ---------- */
h2 { margin: 0; font: 600 13px/1.2 var(--sys); letter-spacing: .02em; color: var(--muted); text-transform: none; }
.sec { display: grid; gap: 10px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sec-head .count { font: 600 13px var(--sys); color: var(--fg); }
.eyebrow { font: 600 12px/1 var(--sys); letter-spacing: .06em; text-transform: uppercase; color: var(--red-hi); }
.daymeta { color: var(--muted); font-size: 13px; }

/* ---------- Banda video ---------- */
.buddy { display: block; position: relative; }
.buddy.full { width: 100vw; margin-left: calc(50% - 50vw); height: min(300px, 40vh); margin-bottom: -40px; overflow: hidden;
  background: radial-gradient(60% 80% at 50% 45%, #2a272b 0%, #161415 55%, var(--bg) 100%); }
.buddy.full::after { content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, var(--bg) 0%, transparent 14%, transparent 70%, var(--bg) 100%), linear-gradient(90deg, var(--bg) 0%, transparent 22%, transparent 78%, var(--bg) 100%); }
.buddy .b-vid, .buddy .b-poster { position: absolute; top: 0; left: 50%; transform: translateX(-50%); height: 100%; width: auto; aspect-ratio: 9 / 16; object-fit: cover; }
.buddy[data-vid] .b-vid { opacity: 0; transition: opacity .3s; }
.buddy[data-vid].playing .b-vid { opacity: 1; }
.buddy[data-vid].playing .b-poster { opacity: 0; transition: opacity .3s .1s; }
.b-vid::-webkit-media-controls, .b-vid::-webkit-media-controls-start-playback-button, .b-vid::-webkit-media-controls-overlay-play-button { display: none !important; -webkit-appearance: none; opacity: 0; }

/* ---------- Cardul zilei ---------- */
.next, .rest-day { position: relative; z-index: 1; overflow: hidden; border-radius: 22px; padding: 18px; display: grid; gap: 14px;
  background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.015)), var(--surface); border: 1px solid var(--line);
  box-shadow: 0 20px 40px -24px rgba(0,0,0,.8); }
.next::before, .rest-day::before { content: ''; position: absolute; left: 18px; right: 18px; top: 0; height: 2px; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); }
.next > *:not(.wm), .rest-day > *:not(.wm) { position: relative; z-index: 1; }
.dayname, .rest-title { margin: 6px 0 0; font: 700 26px/1.1 var(--sys); letter-spacing: -.02em; color: var(--fg); text-wrap: balance; }
.rest-day { justify-items: start; text-align: left; }
.rest-msg { margin: -6px 0 0; color: var(--muted); font-size: 14px; }
.next-up { width: 100%; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); }
.next-up small { grid-column: 1 / -1; font: 600 11px var(--sys); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.next-up b { font: 600 16px var(--sys); }
.next-up span { color: var(--red-hi); font-size: 13px; font-weight: 600; }
.wm { position: absolute; right: -24px; bottom: -24px; width: 150px; height: 150px; background: var(--badge, none) center / contain no-repeat; opacity: .06; pointer-events: none; z-index: 0; transform: rotate(-12deg); }
.rigs-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rigs-row .rig { width: 100%; height: 76px; background: var(--surface-2); border-radius: 12px; border: 1px solid var(--line); }

/* ---------- Butoane ---------- */
.btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 14px;
  font: 600 16px/1 var(--sys); letter-spacing: -.01em; text-transform: none; transition: transform .15s, filter .15s; }
.btn:active { transform: scale(.97); }
.btn-main { width: 100%; color: #fff; background: linear-gradient(180deg, var(--red-hi), var(--accent) 60%, #c81a26); box-shadow: 0 10px 24px -12px var(--accent), inset 0 1px 0 rgba(255,255,255,.25); }
.btn-ghost { min-height: 40px; font-size: 14px; padding: 0 14px; background: rgba(255,255,255,.06); border: 1px solid var(--line); color: var(--fg); }
.skip-btn { width: 100%; min-height: 44px; } .skip-btn svg { width: 18px; height: 18px; color: var(--muted); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 32px; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid var(--line); font: 500 13px var(--sys); color: var(--fg); }
.chip[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 18%, transparent); border-color: color-mix(in srgb, var(--accent) 60%, transparent); color: #fff; }
.link { color: var(--red-hi); font-weight: 600; font-size: 14px; padding: 6px 2px; }
.link.muted, .link.danger { color: var(--muted); }
.del { color: var(--muted); font-size: 13px; padding: 6px 8px; border-radius: 8px; }
.del.armed { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
.ripple { position: absolute; border-radius: 50%; background: currentColor; opacity: .16; transform: scale(0); animation: ripple .55s ease-out forwards; pointer-events: none; }
@keyframes ripple { to { transform: scale(1); opacity: 0; } }

/* ---------- Săptămâna ---------- */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 10px 6px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.wd { display: grid; justify-items: center; gap: 5px; padding: 2px 0; border-radius: 10px; }
.wd small { color: var(--faint); font-size: 11px; font-weight: 600; text-transform: uppercase; }
.wd span { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 600 13px var(--sys); color: var(--muted); border: 1.5px solid transparent; }
.wd.plan span { border-color: color-mix(in srgb, var(--accent) 70%, transparent); color: var(--fg); }
.wd.done span { background: var(--accent); color: #fff; }
.wd.done span svg { width: 14px; height: 14px; }
.wd.is-today small { color: var(--fg); }
.wd.is-today span { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--fg); }
.wd em { font-style: normal; font-size: 10px; color: var(--faint); }
.wd.plan em, .wd.done em { color: var(--red-hi); }

/* ---------- Statistici ---------- */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 2px; min-width: 0; }
.stat b { font: 700 22px/1.1 var(--sys); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); font-size: 12px; line-height: 1.3; }

/* ---------- Citatul zilei ---------- */
.quote { perspective: 1000px; }
.q-inner { position: relative; display: grid; width: 100%; text-align: left; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.3, 1.2, .4, 1); overflow: visible !important; }
.quote.open .q-inner { transform: rotateY(180deg); }
.q-face { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: var(--r); padding: 14px 16px; }
.q-front { display: grid; grid-template-columns: 40px 1fr; grid-template-rows: auto auto; gap: 1px 12px; align-items: center; color: #fff;
  background: linear-gradient(120deg, var(--accent), var(--red-deep)); box-shadow: 0 12px 26px -16px var(--accent); }
.q-front b { font: 600 16px var(--sys); align-self: end; }
.q-front small { grid-column: 2; font-size: 13px; opacity: .85; align-self: start; }
.q-gift { grid-row: 1 / span 2; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; background: rgba(255,255,255,.18); }
.q-gift svg { width: 22px; height: 22px; }
.q-back { transform: rotateY(180deg); background: var(--surface); border: 1px solid var(--line); display: grid; gap: 8px; }
.q-mark { font: 700 34px/0.5 Georgia, serif; color: var(--accent); height: 14px; }
.q-back p { margin: 0; font: 500 16px/1.45 var(--sys); color: var(--fg); text-wrap: pretty; }
.q-who { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.q-who b { font: 600 13px var(--sys); color: var(--red-hi); }
.q-who small { color: var(--muted); font-size: 12px; }

/* ---------- Suplimente și apă ---------- */
.checklist { display: grid; gap: 1px; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); background: var(--line); }
.check { display: grid; grid-template-columns: 48px 1fr 26px; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 11px 14px; background: var(--surface); }
.check time { font: 600 14px var(--sys); color: var(--muted); font-variant-numeric: tabular-nums; }
.check strong { display: block; font-weight: 500; font-size: 15px; }
.check em { font-style: normal; color: var(--muted); font-size: 12.5px; }
.tick { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; transition: background .2s, border-color .2s; }
.tick svg { width: 14px; height: 14px; opacity: 0; color: #fff; }
.check.taken .tick { background: var(--good); border-color: var(--good); }
.check.taken .tick svg { opacity: 1; }
.check.taken strong { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(255,255,255,.3); }
.water { display: grid; gap: 10px; padding: 14px; margin-bottom: 8px; border-radius: var(--r); background: linear-gradient(135deg, color-mix(in srgb, var(--water) 14%, var(--surface)), var(--surface)); border: 1px solid color-mix(in srgb, var(--water) 22%, transparent); }
.water-top { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: center; }
.water-top .drop { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; background: linear-gradient(160deg, #8fd0ff, var(--water)); color: #fff; }
.water-top .drop svg { width: 18px; height: 18px; }
.water-top strong { display: block; font-weight: 600; font-size: 15px; }
.water-top em { font-style: normal; color: var(--muted); font-size: 12.5px; }
.water-dots { display: grid; grid-template-columns: repeat(auto-fill, minmax(14px, 1fr)); gap: 4px; }
.water-dots i { height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); }
.water-dots i.on { background: var(--water); box-shadow: 0 0 8px -2px var(--water); }
.water-btns { display: grid; grid-template-columns: 44px 1fr; gap: 8px; }
.water-btns .btn { min-height: 40px; font-size: 14px; }
.water-btns .btn-main { background: linear-gradient(180deg, #5fb4ff, var(--water) 60%, #2384e8); box-shadow: 0 10px 22px -12px var(--water); }
.water-btns .btn-ghost { font-size: 20px; padding: 0; }
.supp { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 10px; }
.supp.off { opacity: .55; }
.supp-top { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
.supp-top strong { font-weight: 600; display: block; font-size: 15px; }
.supp-top small { color: var(--muted); font-size: 12.5px; }
.supp-tip { font-size: 12.5px; color: var(--muted); }
.supp-ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.supp-ctl input[type="time"] { min-height: 36px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); padding: 0 10px; font: 600 15px var(--sys); }
.ic-row { display: inline-flex !important; align-items: center; gap: 8px; } .ic-row svg { width: 16px; height: 16px; color: var(--water); }
.switch { position: relative; width: 46px; height: 28px; border-radius: 999px; background: var(--surface-3); flex: none; transition: background .2s; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.4); transition: transform .25s cubic-bezier(.3, 1.3, .4, 1); }
.switch[aria-checked="true"] { background: var(--good); }
.switch[aria-checked="true"]::after { transform: translateX(18px); }
.add-form { display: grid; gap: 8px; background: var(--surface); border: 1px solid var(--line); padding: 14px; border-radius: var(--r); }
.add-form .two { display: grid; grid-template-columns: 1fr 120px; gap: 8px; }
.notice { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; }
.notice p { margin: 0; color: var(--muted); font-size: 13.5px; }
.notice strong { font-weight: 600; }
.state-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); margin-right: 6px; vertical-align: 1px; }
.state-dot.on { background: var(--good); box-shadow: 0 0 8px var(--good); }
.field { width: 100%; min-height: 44px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); padding: 0 12px; font-size: 15px; }
.field:focus { border-color: color-mix(in srgb, var(--accent) 60%, transparent); outline: none; }
textarea.field { padding: 10px 12px; min-height: 90px; resize: vertical; font-size: 12px; }
.row-input { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.empty { color: var(--muted); font-size: 13.5px; padding: 18px 12px; text-align: center; border: 1px dashed var(--line-2); border-radius: var(--r); margin: 0; }
.badge-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.badge-prev { width: 48px; height: 48px; object-fit: contain; border-radius: 12px; background: var(--surface-2); padding: 6px; }

/* ---------- Program ---------- */
.day-block { display: grid; gap: 8px; }
.day-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.day-title h3 { margin: 0; font: 700 19px/1.15 var(--sys); letter-spacing: -.02em; }
.day-title h3 span { display: block; font: 600 12px var(--sys); letter-spacing: .06em; text-transform: uppercase; color: var(--red-hi); margin-bottom: 2px; }
.ex-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.ex-row { display: grid; grid-template-columns: 48px 1fr 18px; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 8px 12px 8px 8px; }
.ex-row .rig { width: 48px; height: 48px; background: var(--surface-2); border-radius: 10px; }
.ex-row strong { display: block; font-weight: 500; font-size: 15px; line-height: 1.25; }
.ex-row small { color: var(--muted); font-size: 12.5px; }
.chev { width: 18px; height: 18px; color: var(--faint); transition: transform .2s; }
.ex-item.open .chev { transform: rotate(180deg); }
.ex-detail { padding: 2px 14px 14px; display: grid; gap: 10px; animation: rise .3s ease-out; }
.ex-detail .rig.big { width: 100%; max-width: 220px; aspect-ratio: 1; justify-self: center; background: var(--surface-2); border-radius: 16px; }
.target { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.06); font-size: 12px; color: var(--fg); }
.pill.up { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); font-weight: 600; }
.cues { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; counter-reset: c; font-size: 14px; }
.cues li { display: block; position: relative; padding-left: 26px; counter-increment: c; }
.cues li::before { content: counter(c); position: absolute; left: 0; top: 1px; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font: 600 11px var(--sys); background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--red-hi); }
.mistake { background: color-mix(in srgb, var(--bad) 10%, transparent); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; }
.mistake b { color: var(--bad); font-weight: 600; }
.rest-info { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }

/* ---------- Grafice ---------- */
.chart-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; }
.chart-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.chart-head b { font: 700 24px/1 var(--sys); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.chart-head small { color: var(--muted); font-size: 12.5px; }
.delta-up { color: var(--good); font-weight: 600; font-size: 12.5px; }
.delta-down { color: var(--bad); font-weight: 600; font-size: 12.5px; }
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--faint); font: 11px var(--sys); }
.chart .lineA { fill: none; stroke: var(--accent); stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1s ease-out forwards; }
.chart .areaA { fill: var(--accent); opacity: .12; }
.chart .dot { fill: var(--accent); }
.chart .dot-ring { fill: var(--bg); stroke: var(--accent); stroke-width: 2.25; }
.chart .endlbl { fill: var(--fg); font: 600 12px var(--sys); }
@keyframes draw { to { stroke-dashoffset: 0; } }
.ex-pick { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; touch-action: pan-x pan-y; }
.ex-pick::-webkit-scrollbar { display: none; }
.ex-pick .chip { flex: none; }
.last { font-size: 12.5px; color: var(--muted); }
.last b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------- Istoric ---------- */
.hist { display: grid; gap: 1px; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); background: var(--line); }
.hist-row { display: grid; grid-template-columns: 34px 1fr 18px; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 10px 12px; background: var(--surface); }
.hist-row:active { background: var(--surface-2); }
.hist-row .badge { width: 34px; height: 34px; border-radius: 10px; background: color-mix(in srgb, var(--accent) 16%, transparent); display: grid; place-items: center; font: 700 12px var(--sys); color: var(--red-hi); text-transform: uppercase; }
.hist-row strong { font-weight: 500; }
.hist-row small { color: var(--muted); display: block; font-size: 12px; }
.sbars { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; align-items: end; height: 120px; }
.sbar { display: grid; grid-template-rows: 1fr auto auto; justify-items: center; height: 100%; gap: 2px; min-width: 0; }
.sbar i { align-self: end; width: 100%; max-width: 48px; height: var(--h); border-radius: 8px 8px 3px 3px; background: linear-gradient(180deg, var(--red-hi), var(--accent) 60%, var(--red-deep)); transform-origin: bottom; animation: growup .55s var(--d) cubic-bezier(.2, .8, .2, 1) both; }
@keyframes growup { from { transform: scaleY(0); } }
.sbar b { font: 700 15px/1 var(--sys); } .sbar b small { font-size: 10px; color: var(--muted); margin-left: 1px; font-weight: 500; }
.sbar span { font-size: 12px; color: var(--muted); }
.hx-chart { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 6px; }
.hx-h { font: 600 12px var(--sys); color: var(--muted); }
.hx-h small { font-weight: 400; margin-left: 4px; }
.hx .wex-top { grid-template-columns: 52px 1fr; }
.hx .wex-top .rig { width: 52px; height: 52px; }

/* ---------- Meniul plutitor ---------- */
.nav { position: fixed; z-index: 10; left: max(14px, env(safe-area-inset-left, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  border-radius: 24px; border: 1px solid rgba(255,255,255,.08); background: rgba(28,23,26,.72); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6);
  box-shadow: 0 16px 36px -14px rgba(0,0,0,.8); }
.nav-in { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); padding: 5px; max-width: 560px; margin: 0 auto; }
.nav-pill { position: absolute; top: 5px; bottom: 5px; left: 5px; width: calc((100% - 10px) / 4); border-radius: 19px; background: rgba(255,255,255,.09);
  transform: translateX(calc(var(--i, 0) * 100%)); transition: transform .4s cubic-bezier(.3, 1.25, .4, 1); }
.nav button { position: relative; z-index: 1; display: grid; justify-items: center; gap: 3px; padding: 8px 0 7px; color: var(--faint); font: 500 10.5px var(--sys); letter-spacing: 0; transition: color .2s; }
.nav button[aria-current="page"] { color: var(--fg); }
.nav button[aria-current="page"] svg { color: var(--accent); }
.nav svg { width: 22px; height: 22px; }

/* ---------- Antrenament ---------- */
.workout { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
.sheet { z-index: 25; }
.w-head { position: sticky; top: 0; z-index: 3; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.w-head-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; }
.w-title { font: 700 18px/1.15 var(--sys); letter-spacing: -.02em; min-width: 0; }
.w-title span { display: block; font: 600 11px var(--sys); letter-spacing: .06em; text-transform: uppercase; color: var(--red-hi); margin-bottom: 2px; }
.w-sub { color: var(--muted); font-size: 12.5px; grid-column: 1; }
.w-finish { grid-row: 1 / span 2; grid-column: 2; min-height: 36px; }
.w-finish.armed { background: var(--good); color: #062014; border-color: transparent; }
.progressbar { grid-column: 1 / -1; height: 3px; background: rgba(255,255,255,.08); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.progressbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--red-hi)); transition: width .3s; }
.w-body { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 20px; display: grid; gap: 12px; }
.wex { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px; display: grid; gap: 10px; transition: box-shadow .3s, border-color .3s; }
.wex.complete { border-color: color-mix(in srgb, var(--good) 45%, transparent); }
.wex-top { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; }
.wex-top .rig { width: 56px; height: 56px; background: var(--surface-2); border-radius: 12px; }
.wex-top h3 { margin: 0 0 2px; font: 600 16px/1.25 var(--sys); letter-spacing: -.01em; text-transform: none; }
.wex-top small { color: var(--muted); font-size: 12.5px; display: block; }
.sets { display: grid; gap: 6px; }
.set-h, .set { display: grid; grid-template-columns: 26px 1fr 1fr 44px; gap: 8px; align-items: center; }
.set-h { color: var(--faint); font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.set-h span { text-align: center; }
.set .n { font: 600 14px var(--sys); color: var(--faint); text-align: center; }
.set input { width: 100%; min-width: 0; height: 42px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); text-align: center; font: 600 17px var(--sys); font-variant-numeric: tabular-nums; }
.set input:focus { border-color: color-mix(in srgb, var(--accent) 60%, transparent); outline: none; }
.set input::placeholder { color: var(--faint); font-weight: 500; }
.set .ok { position: relative; overflow: hidden; height: 42px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; color: var(--faint); }
.set .ok svg { width: 18px; height: 18px; }
.set.done .ok { background: var(--good); border-color: var(--good); color: #fff; }
.set.done input { color: var(--muted); }
.wex-actions { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; align-items: center; }
.set-ctl { display: inline-flex; gap: 14px; flex-wrap: wrap; }
.w-foot { display: grid; gap: 8px; padding-top: 6px; }

/* ---------- Cronometrul de pauză ---------- */
.rest { position: fixed; left: 0; right: 0; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 30; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.rest-in { pointer-events: auto; max-width: 540px; margin: 0 auto; border-radius: 20px; padding: 10px 12px; display: grid; grid-template-columns: 50px 1fr auto; gap: 12px; align-items: center;
  background: rgba(32,26,29,.86); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border: 1px solid var(--line-2); box-shadow: 0 16px 36px -12px rgba(0,0,0,.8); animation: slidein .3s cubic-bezier(.2, .8, .2, 1) 1; }
.ring { width: 50px; height: 50px; }
.ring circle { fill: none; stroke-width: 5; }
.ring .bgc { stroke: rgba(255,255,255,.1); }
.ring .fgc { stroke: var(--accent); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .25s linear; }
.rest-txt { min-width: 0; }
.rest-t { font: 700 26px/1 var(--sys); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.rest-txt small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.rest-btns { display: flex; gap: 6px; }
.rest-btns button { min-width: 40px; height: 36px; border-radius: 10px; background: rgba(255,255,255,.08); font: 600 13px var(--sys); padding: 0 8px; }
@keyframes slidein { from { transform: translateY(30px); opacity: 0; } }

/* ---------- Treci la treabă ---------- */
.go { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; text-align: center; overflow: hidden; color: #fff;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: radial-gradient(circle at 50% 42%, var(--red-hi) 0%, var(--accent) 38%, var(--red-deep) 80%, #2a0407 100%); }
.go-in { position: relative; display: grid; gap: 14px; justify-items: center; }
.go-ring { position: absolute; top: 50%; left: 50%; width: 110vmin; height: 110vmin; margin: -55vmin 0 0 -55vmin; border-radius: 50%; border: 3px solid rgba(255,255,255,.45); animation: ping 1.3s ease-out infinite; }
@keyframes ping { from { transform: scale(.2); opacity: 1; } to { transform: scale(1.05); opacity: 0; } }
.go-small { font: 600 13px var(--sys); letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
.go-big { font: 800 clamp(48px, 15vw, 84px)/.95 var(--display); text-transform: uppercase; letter-spacing: .01em; }
.go-next { font: 500 14px var(--sys); display: grid; gap: 2px; background: rgba(0,0,0,.2); padding: 10px 16px; border-radius: 14px; max-width: 32ch; }
.go-next b { font: 700 17px/1.2 var(--sys); }
.go-tap { font-size: 12px; opacity: .7; }
.go.show .go-big { animation: slam .6s cubic-bezier(.2, 1.5, .4, 1) both; }
.go.show .go-small, .go.show .go-next, .go.show .go-tap { animation: rise .45s .3s both; }
@keyframes slam { from { transform: scale(2.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* ---------- Ecran de pornire ---------- */
.splash { position: fixed; inset: 0; z-index: 100; overflow: hidden; display: grid; place-items: center; align-content: center; gap: 18px;
  background: radial-gradient(circle at 50% 40%, #2a1115 0%, var(--bg) 70%); transition: opacity .5s ease, transform .5s ease; }
.splash.out { opacity: 0; transform: scale(1.04); pointer-events: none; }
.sp-rays { display: none; }
.sp-fig { position: relative; width: 150px; aspect-ratio: 1; border-radius: 50%; overflow: hidden; border: 2px solid rgba(255,255,255,.12);
  box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 25%, transparent), 0 24px 50px -16px var(--accent); animation: spfig .7s cubic-bezier(.2, 1.3, .4, 1) both; }
.sp-fig img, .sp-fig video { position: absolute; left: 50%; top: -6%; transform: translateX(-50%); height: 160%; width: auto; aspect-ratio: 9 / 16; object-fit: cover; }
.sp-fig video { opacity: 0; transition: opacity .3s; }
.splash.vid .sp-fig video { opacity: 1; }
@keyframes spfig { from { transform: scale(.6); opacity: 0; } }
.sp-title { display: grid; justify-items: center; gap: 6px; text-transform: uppercase; }
.sp-a { font: 700 40px/1 var(--display); letter-spacing: .2em; color: var(--accent); animation: rise .5s .2s both; margin-right: -.2em; }
.sp-b { font: 600 14px/1 var(--sys); letter-spacing: .3em; color: var(--fg); animation: rise .5s .35s both; margin-right: -.3em; }
.sp-stripe { width: 120px; height: 3px; border-radius: 2px; background: repeating-linear-gradient(90deg, var(--accent) 0 12px, #fff 12px 24px); animation: growx .5s .5s ease-out both; }
@keyframes growx { from { transform: scaleX(0); } }

/* ---------- Animații de bază ---------- */
#view.enter > * { animation: rise .45s cubic-bezier(.2, .8, .2, 1) both; }
#view.enter > *:nth-child(2) { animation-delay: .05s; }
#view.enter > *:nth-child(3) { animation-delay: .1s; }
#view.enter > *:nth-child(4) { animation-delay: .15s; }
#view.enter > *:nth-child(n+5) { animation-delay: .2s; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
.workout.slide-in { animation: slidein .35s cubic-bezier(.2, .8, .2, 1); }
.pop { animation: pop .38s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { transform: scale(.75); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
.set.done .ok svg path, .check.taken .tick svg path { stroke-dasharray: 24; stroke-dashoffset: 24; animation: tickdraw .3s .05s ease-out forwards; }
@keyframes tickdraw { to { stroke-dashoffset: 0; } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: rgba(246,242,241,.96); color: #141012; padding: 10px 16px; border-radius: 14px; font: 500 14px var(--sys); max-width: calc(100% - 32px); box-shadow: 0 10px 30px rgba(0,0,0,.45); animation: toastin .3s cubic-bezier(.2, .8, .2, 1); }
@keyframes toastin { from { transform: translate(-50%, 16px); opacity: 0; } }
.fx-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 70; pointer-events: none; }

/* ---------- Figurile animate ---------- */
.rig .limb, .rig .ground, .rig .prop, .rig .eq, .rig .cable { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.rig .limb { stroke: var(--fg); }
.rig .w14 { stroke-width: 14; } .rig .w9 { stroke-width: 9; } .rig .w8 { stroke-width: 8; } .rig .w6 { stroke-width: 6; } .rig .w5 { stroke-width: 5; } .rig .w4 { stroke-width: 4; }
.rig .head, .rig .torso { fill: var(--fg); }
.rig .prop { stroke: var(--surface-3); }
.rig .ground { stroke: var(--surface-3); stroke-width: 2; }
.rig .eq { stroke: var(--accent); }
.rig .eq-fill { fill: var(--accent); }
.rig .hub { fill: var(--surface-2); }
.rig .cable { stroke: var(--faint); stroke-width: 1.5; }
.rig .pulley { fill: var(--faint); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .chart .lineA { stroke-dashoffset: 0; }
}
.buddy .b-vid, .buddy .b-poster { -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 22%, #000 78%, transparent 100%), linear-gradient(180deg, transparent 0, #000 10%, #000 80%, transparent 100%); -webkit-mask-composite: source-in;
  mask-image: linear-gradient(90deg, transparent 0, #000 22%, #000 78%, transparent 100%), linear-gradient(180deg, transparent 0, #000 10%, #000 80%, transparent 100%); mask-composite: intersect; }
.buddy.full { background: radial-gradient(42% 70% at 50% 48%, #24222a 0%, #141214 60%, var(--bg) 100%); }

/* clipurile au fundalul scos și înlocuit cu culoarea aplicației, deci banda nu mai are chenar */
.buddy.full { background: var(--bg); }
.buddy.full::after { background: linear-gradient(180deg, var(--bg) 0%, transparent 12%, transparent 72%, var(--bg) 100%); }
.buddy .b-vid, .buddy .b-poster { -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 10%, #000 90%, transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 10%, #000 90%, transparent 100%); -webkit-mask-composite: source-over; mask-composite: add; }

/* ---------- Meniu cu 5 file ---------- */
.nav-in { grid-template-columns: repeat(5, 1fr); }
.nav-pill { width: calc((100% - 10px) / 5); }
.nav button { font-size: 10px; }

/* ---------- Inele de activitate ---------- */
.rings { display: grid; grid-template-columns: 116px 1fr; gap: 16px; align-items: center; padding: 16px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); }
.ring3 { width: 116px; height: 116px; transform: rotate(-90deg); }
.rg-bg { fill: none; stroke-width: 10; opacity: .16; }
.rg-fg { fill: none; stroke-width: 10; stroke-linecap: round; animation: rgfill 1.2s cubic-bezier(.3, .9, .3, 1) both; }
@keyframes rgfill { from { stroke-dashoffset: var(--c); } }
.rg-list { display: grid; gap: 10px; min-width: 0; }
.rg-item { display: grid; grid-template-columns: 8px 1fr; gap: 10px; align-items: start; }
.rg-item i { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; }
.rg-item span { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; align-items: baseline; }
.rg-item small { font-size: 12px; color: var(--muted); font-weight: 600; }
.rg-item b { font: 700 16px var(--sys); letter-spacing: -.02em; text-align: right; }
.rg-item em { grid-column: 1 / -1; font-style: normal; font-size: 11.5px; color: var(--faint); }
.streak { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: linear-gradient(90deg, color-mix(in srgb, #ff9f43 18%, transparent), transparent); border: 1px solid color-mix(in srgb, #ff9f43 25%, transparent); }
.streak svg { width: 20px; height: 20px; color: #ff9f43; }
.streak b { font: 700 18px var(--sys); color: #ffb76b; }
.streak span { font-size: 13px; color: var(--fg); }

/* ---------- Harta musculară ---------- */
.mmap { display: grid; gap: 14px; padding: 16px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); }
.mm-bodies { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mm-bodies figure { margin: 0; display: grid; justify-items: center; gap: 4px; }
.mm-bodies figcaption { font-size: 11px; color: var(--faint); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
.body { width: 100%; max-width: 130px; height: auto; }
.mm { transition: fill .6s; }
.mm-list { display: grid; gap: 7px; }
.mm-row { display: grid; grid-template-columns: 84px 1fr 26px; gap: 10px; align-items: center; font-size: 13px; }
.mm-row i { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.mm-row i b { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--red-deep), var(--accent), var(--red-hi)); animation: growx .8s ease-out both; transform-origin: left; }
.mm-row em { font-style: normal; text-align: right; color: var(--muted); font-weight: 600; }
.mm-note { color: var(--faint); font-size: 11.5px; line-height: 1.4; }

/* ---------- Recorduri ---------- */
.pr-b { background: color-mix(in srgb, #ffc94d 16%, transparent) !important; color: #ffc94d !important; }
.pr-b svg { width: 17px; height: 17px; }
.pr-row { grid-template-columns: 34px 1fr auto; }
.pr-g { font-style: normal; font-weight: 700; font-size: 13px; color: var(--good); }
.pr { position: fixed; inset: 0; z-index: 55; display: grid; place-items: center; padding: 20px; background: rgba(5,4,5,.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.pr-card { width: min(100%, 360px); display: grid; justify-items: center; gap: 10px; text-align: center; padding: 0 20px 20px; border-radius: 26px; overflow: hidden;
  background: radial-gradient(120% 60% at 50% 0%, color-mix(in srgb, #ffc94d 22%, var(--surface)), var(--surface) 60%); border: 1px solid color-mix(in srgb, #ffc94d 30%, transparent); box-shadow: 0 30px 60px -20px rgba(0,0,0,.8); }
.pr.show .pr-card { animation: prin .6s cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes prin { from { transform: scale(.7) translateY(30px); opacity: 0; } }
.buddy.pr-av { width: 100%; height: 220px; margin: 0 -20px; }
.buddy.pr-av .b-vid, .buddy.pr-av .b-poster { height: 100%; }
.pr-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: #ffc94d; color: #2a1d00; font: 700 12px var(--sys); text-transform: uppercase; letter-spacing: .06em; margin-top: -8px; }
.pr-badge svg { width: 15px; height: 15px; }
.pr-t { margin: 4px 0 0; font: 600 16px var(--sys); color: var(--fg); }
.pr-v { font: 800 36px/1 var(--sys); letter-spacing: -.03em; color: #ffd27a; }
.pr-card p { margin: 0 0 6px; color: var(--muted); font-size: 13.5px; }

/* ---------- Profil ---------- */
.prof { display: grid; justify-items: center; text-align: center; gap: 4px; padding-top: 8px; }
.prof h1 { margin: 6px 0 0; font: 700 22px var(--sys); letter-spacing: -.02em; }
.prof-av { width: 112px; height: 112px; border-radius: 50%; overflow: hidden; position: relative; background: var(--surface-2);
  box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent), 0 18px 40px -14px var(--accent); }
.buddy.avatar { position: absolute; inset: 0; }
.buddy.avatar .b-vid, .buddy.avatar .b-poster { height: 190%; top: -4%; -webkit-mask-image: none; mask-image: none; }
.pstats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.pstats .stat { text-align: center; padding: 12px 6px; }
.pstats .stat b { font-size: 19px; }
.ach-head { font-size: 13px; color: var(--muted); } .ach-head b { color: var(--fg); font-size: 15px; }
.ach { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ach-i { display: grid; justify-items: center; text-align: center; gap: 4px; padding: 14px 8px 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); opacity: .5; }

function quoteOfDay(date = new Date()) {
  const day = Math.round((Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) - Date.UTC(2026, 0, 1)) / 86400000);
  // ordine amestecată, dar aceeași pentru o zi dată: nu se repetă până nu trec toate
  const n = QUOTES.length, k = ((day % n) + n) % n, step = 17;
  return QUOTES[(k * step + 5) % n];
}

  const d = (a, l) => [Math.sin(a * R) * l, Math.cos(a * R) * l];
  const add = (p, q) => [p[0] + q[0], p[1] + q[1]];
  const sub = (p, q) => [p[0] - q[0], p[1] - q[1]];
  const f = n => n.toFixed(1);
  const ln = (p, q, c) => `<line class="${c}" x1="${f(p[0])}" y1="${f(p[1])}" x2="${f(q[0])}" y2="${f(q[1])}"/>`;
  const poly = (pts, c) => `<polyline class="${c}" points="${pts.map(p => f(p[0]) + ',' + f(p[1])).join(' ')}"/>`;

  function lerp(A, B, k) {
    const o = {};
    for (const key in A) {
      const a = A[key], b = B[key];
      o[key] = Array.isArray(a) ? [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k] : a + (b - a) * k;
    }
    return o;
  }

  function side(P, eq) {
    const td = [Math.sin(P.t * R), -Math.cos(P.t * R)];
    const tv = [td[0] * L.T, td[1] * L.T];
    let hip, sh, el, hand, knee, foot;
    if (P.foot) {
      foot = P.foot; knee = sub(foot, d(P.sh, L.SH)); hip = sub(knee, d(P.th, L.TH));
      sh = add(hip, tv); el = add(sh, d(P.ua, L.UA)); hand = add(el, d(P.fa, L.FA));
    } else if (P.hand) {
      hand = P.hand; el = sub(hand, d(P.fa, L.FA)); sh = sub(el, d(P.ua, L.UA)); hip = sub(sh, tv);
      knee = add(hip, d(P.th, L.TH)); foot = add(knee, d(P.sh, L.SH));
    } else {
      hip = P.hip; sh = add(hip, tv); el = add(sh, d(P.ua, L.UA)); hand = add(el, d(P.fa, L.FA));
      knee = add(hip, d(P.th, L.TH)); foot = add(knee, d(P.sh, L.SH));
    }
    const head = add(sh, [td[0] * 15, td[1] * 15]);
    const toe = add(foot, d(P.fd == null ? 90 : P.fd, 10));
    const pts = { hand, foot, sh };
    let back = '', front = '';
    for (const e of eq) {
      if (e.k === 'bench') {
        back += ln(e.a, e.b, 'prop w8');
        back += ln([e.a[0] + 8, e.a[1]], [e.a[0] + 8, 180], 'prop w4') + ln([e.b[0] - 8, e.b[1]], [e.b[0] - 8, 180], 'prop w4');
      } else if (e.k === 'pad') {
        back += ln(e.a, e.b, 'prop w8');
      } else if (e.k === 'bars') {
        back += ln([76, e.y], [132, e.y], 'prop w5') + ln([128, e.y], [128, 180], 'prop w4');
      } else if (e.k === 'plate') {
        const p = pts[e.at];
        front += `<circle class="eq-fill" cx="${f(p[0])}" cy="${f(p[1])}" r="12"/><circle class="hub" cx="${f(p[0])}" cy="${f(p[1])}" r="3"/>`;
      } else if (e.k === 'db') {
        const p = pts[e.at];
        front += `<rect class="eq-fill" x="${f(p[0] - 9)}" y="${f(p[1] - 4)}" width="18" height="8" rx="2"/>`;
      } else if (e.k === 'handle') {
        const p = pts[e.at];
        front += `<circle class="eq-fill" cx="${f(p[0])}" cy="${f(p[1])}" r="4.5"/>`;
      } else if (e.k === 'cable') {
        const p = pts[e.at];
        const to = e.to === 'up' ? [p[0], 12] : e.to === 'right' ? [190, p[1]] : e.to;
        back += ln(p, to, 'cable') + `<circle class="pulley" cx="${f(to[0])}" cy="${f(to[1])}" r="5"/>`;
      } else if (e.k === 'platform') {
        const p = pts[e.at], a = e.ang * R, n = [Math.cos(a), -Math.sin(a)];
        front += ln([p[0] + n[0] * 18 + Math.sin(a) * 4, p[1] + n[1] * 18 + Math.cos(a) * 4], [p[0] - n[0] * 18 + Math.sin(a) * 4, p[1] - n[1] * 18 + Math.cos(a) * 4], 'eq w6');
      }
    }
    return back +
      poly([hip, knee, foot, toe], 'limb w9') +
      ln(hip, sh, 'limb w14') +
      `<circle class="head" cx="${f(head[0])}" cy="${f(head[1])}" r="9.5"/>` +
      poly([sh, el, hand], 'limb w8') + front;
  }

  function frontView(P, eq) {
    const S = { r: [117, 68], l: [83, 68] };
    let out = '';
    const arm = (s, sign) => {
      const ul = P.ul == null ? 1 : P.ul, e = [s[0] + sign * Math.sin(P.ua * R) * 27 * ul, s[1] + Math.cos(P.ua * R) * 27];
      const h = [e[0] + sign * Math.sin(P.fa * R) * 25, e[1] + Math.cos(P.fa * R) * 25];
      return { e, h };
    };
    const ar = arm(S.r, 1), al = arm(S.l, -1);
    for (const x of eq) {
      if (x.k === 'cableF') {
        const tr = [200 - x.to[0], x.to[1]];
        out += ln(ar.h, tr, 'cable') + ln(al.h, x.to, 'cable') +
          `<circle class="pulley" cx="${tr[0]}" cy="${tr[1]}" r="5"/><circle class="pulley" cx="${x.to[0]}" cy="${x.to[1]}" r="5"/>`;
      }
    }
    out += poly([[93, 112], [91, 146], [90, 178]], 'limb w9') + poly([[107, 112], [109, 146], [110, 178]], 'limb w9');
    out += `<path class="torso" d="M84 66 L116 66 L110 112 L90 112 Z"/>`;
    out += `<circle class="head" cx="100" cy="50" r="10"/>`;
    out += poly([S.r, ar.e, ar.h], 'limb w8') + poly([S.l, al.e, al.h], 'limb w8');
    for (const x of eq) {
      if (x.k === 'dbF') {
        for (const h of [ar.h, al.h]) out += `<rect class="eq-fill" x="${f(h[0] - 4)}" y="${f(h[1] - 9)}" width="8" height="18" rx="2"/>`;
      } else if (x.k === 'padsF') {
        for (const h of [ar.h, al.h]) out += `<rect class="eq-fill" x="${f(h[0] - 5)}" y="${f(h[1] - 4)}" width="10" height="26" rx="4"/>`;
      } else if (x.k === 'cableF') {
        for (const h of [ar.h, al.h]) out += `<circle class="eq-fill" cx="${f(h[0])}" cy="${f(h[1])}" r="4.5"/>`;
      }
    }
    return out;
  }

  function frame(rig, k) {
    const P = lerp(rig.A, rig.B, k);
    return `<line class="ground" x1="14" y1="181" x2="186" y2="181"/>` + (rig.front ? frontView(P, rig.eq) : side(P, rig.eq));
  }

  /* 0 → A, 1 → B, cu pauze la capete */
  function phase(t) {
    const c = (t % 3200) / 3200;
    const e = x => 0.5 - 0.5 * Math.cos(Math.PI * x);
    if (c < 0.14) return 0;
    if (c < 0.5) return e((c - 0.14) / 0.36);
    if (c < 0.64) return 1;
    return 1 - e((c - 0.64) / 0.36);
  }

  function svg(id, cls) {
    return `<svg class="rig ${cls || ''}" data-rig="${id}" viewBox="0 0 200 200" role="img" aria-label="Animație ${EX[id].name}"><g>${frame(EX[id].rig, 0.5)}</g></svg>`;
  }

  const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function loop(ts) {
    document.querySelectorAll('svg[data-rig]').forEach(el => {
      const r = el.getBoundingClientRect();
      if (r.bottom < 0 || r.top > innerHeight) return;
      el.firstChild.innerHTML = frame(EX[el.dataset.rig].rig, phase(ts + (el.dataset.off | 0)));
    });
    requestAnimationFrame(loop);
  }
  if (!still) requestAnimationFrame(loop);
  return { svg, frame };
})();

/* ---------- Efecte: confetti, val la atingere, numere care urcă ---------- */
const FX = (() => {
  const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let cv, ctx, parts = [], raf = 0;
  const COLORS = ['#e4202e', '#ffffff', '#ff4b57', '#9e0f1a', '#ffd9dc'];
  function canvas() {
    if (cv) return;
    cv = document.createElement('canvas'); cv.className = 'fx-canvas'; document.body.appendChild(cv);
    ctx = cv.getContext('2d');
    const fit = () => { const d = devicePixelRatio || 1; cv.width = innerWidth * d; cv.height = innerHeight * d; ctx.setTransform(d, 0, 0, d, 0, 0); };
    fit(); addEventListener('resize', fit);
  }
  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.life > 0);
    for (const p of parts) {
      p.vy += p.g; p.vx *= 0.985; p.vy *= 0.985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= 1;
      ctx.save(); ctx.globalAlpha = Math.min(1, p.life / 30); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.s / 2, 0, 7); ctx.fill(); } else ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      ctx.restore();
    }
    raf = parts.length ? requestAnimationFrame(tick) : 0;
  }
  function spawn(x, y, n, spread, power, g) {
    if (still) return; canvas();
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * spread, v = power * (0.5 + Math.random() * 0.7);
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, s: 5 + Math.random() * 6, c: COLORS[i % COLORS.length], life: 60 + Math.random() * 40, round: Math.random() < 0.3 });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function burst(el, n = 18) { if (!el) return; const r = el.getBoundingClientRect(); spawn(r.left + r.width / 2, r.top + r.height / 2, n, Math.PI * 2, 6, 0.18); }
  function celebrate() {
    spawn(innerWidth * 0.2, innerHeight * 0.9, 70, 1.1, 17, 0.32);
    setTimeout(() => spawn(innerWidth * 0.8, innerHeight * 0.9, 70, 1.1, 17, 0.32), 180);
    setTimeout(() => spawn(innerWidth * 0.5, innerHeight * 0.85, 60, 1.4, 19, 0.32), 380);
  }
  function countUp(root) {
    if (still) return;
    root.querySelectorAll('[data-count]').forEach(el => {
      const txt = el.textContent, m = txt.match(/[\d.]+(,\d+)?/); if (!m) return;
      const target = parseFloat(m[0].replace(/\./g, '').replace(',', '.')), dec = m[1] ? m[1].length - 1 : 0, t0 = performance.now();
      const step = t => {
        const k = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - k, 3);
        el.textContent = txt.replace(m[0], (target * e).toLocaleString('ro-RO', { minimumFractionDigits: dec, maximumFractionDigits: dec }));
        if (k < 1) requestAnimationFrame(step); else el.textContent = txt;
      };
      requestAnimationFrame(step);
    });
  }
  /* val la atingere */
  document.addEventListener('pointerdown', e => {
    if (still) return;
    const b = e.target.closest('.btn, .chip, .check, .set .ok, .ex-row, .nav button, .switch');
    if (!b) return;
    const r = b.getBoundingClientRect(), s = Math.max(r.width, r.height) * 2.2, w = document.createElement('span');
    w.className = 'ripple'; w.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - r.left - s / 2}px;top:${e.clientY - r.top - s / 2}px`;
    b.appendChild(w); setTimeout(() => w.remove(), 650);
  }, { passive: true });
  function pop(el) { if (!el || still) return; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
  return { burst, celebrate, countUp, pop };
})();

/* ---------- Mini-Cristian: clipurile video, care rulează mereu în buclă ---------- */
const Buddy = (() => {
  const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cache = {};
  /* un singur element video per clip, refolosit la fiecare redesenare, ca să nu se oprească niciodată */
  function el(name, label) {
    if (cache[name]) return cache[name];
    const v = document.createElement('video');
    const A = window.ASSET || ''; v.className = 'b-vid'; v.src = A + name + '.mp4'; v.poster = A + name + '.jpg';
    v.muted = true; v.defaultMuted = true; v.loop = true; v.autoplay = true; v.playsInline = true; v.preload = 'auto';
    v.setAttribute('muted', ''); v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', ''); v.setAttribute('aria-label', label);
    v.disablePictureInPicture = true; v.controls = false;
    const kick = () => { if (!still && v.isConnected && v.paused) { const p = v.play(); if (p && p.catch) p.catch(() => { }); } };
    v.addEventListener('pause', () => setTimeout(kick, 50));
    v.addEventListener('ended', () => { v.currentTime = 0; kick(); });
    v.addEventListener('stalled', () => setTimeout(kick, 500));
    v.addEventListener('canplay', kick);
    const mark = on => { if (v.parentNode) v.parentNode.classList.toggle('playing', on); };
    v.addEventListener('playing', () => mark(true));
    v.addEventListener('pause', () => mark(false));
    cache[name] = v; return v;
  }
  const slot = (name, label, cls = '') => `<div class="buddy ${cls}" data-vid="${name}" data-label="${label}"><img class="b-poster" src="${window.ASSET || ''}${name}.jpg" alt=""></div>`;
  const svg = slot('mini-cristian', 'Mini-Cristian dansează, face flotări și o tumbă');
  const flex = slot('mini-cristian-flex', 'Mini-Cristian își arată bicepșii și ridică degetul mare', 'flex');
  function playAll() {
    if (still) return;
    for (const k in cache) { const v = cache[k]; if (v.isConnected && v.paused) { const p = v.play(); if (p && p.catch) p.catch(() => { }); } }
  }
  function start() {
    document.querySelectorAll('.buddy[data-vid]').forEach(s => { const v = el(s.dataset.vid, s.dataset.label); if (v.parentNode !== s) s.appendChild(v); s.classList.toggle('playing', !v.paused); });
    playAll();
  }
  /* orice atingere repornește clipul (necesar când iPhone-ul e în modul Economisire baterie) */
  ['touchstart', 'pointerdown', 'scroll'].forEach(e => document.addEventListener(e, playAll, { passive: true, capture: true }));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') playAll(); });
  addEventListener('pageshow', playAll); addEventListener('focus', playAll);
  setInterval(playAll, 2000);
  const cele = slot('mini-cristian-cele', 'Mini-Cristian se întoarce și își arată numele și numărul 27 de pe tricou', 'cele');
  return { svg, flex, cele, start };
})();

/* scoate fundalul: pornește din margini și face transparent tot ce seamănă cu culoarea fundalului */
function cutBackground(img, size = 256) {
  const k = Math.min(size / img.width, size / img.height), w = Math.max(1, Math.round(img.width * k)), h = Math.max(1, Math.round(img.height * k));

  const corners = [[0, 0], [w - 1, 0], [0, h - 1], [w - 1, h - 1]].map(([x, y]) => { const i = (y * w + x) * 4; return [d[i], d[i + 1], d[i + 2], d[i + 3]]; });
  const near = i => { if (d[i + 3] < 20) return true; for (const c0 of corners) { if (c0[3] < 20) continue; const dr = d[i] - c0[0], dg = d[i + 1] - c0[1], db = d[i + 2] - c0[2]; if (dr * dr + dg * dg + db * db < 2400) return true; } return false; };

    const x = p % w, y = (p / w) | 0; if (x > 0) st.push(p - 1); if (x < w - 1) st.push(p + 1); if (y > 0) st.push(p - w); if (y < h - 1) st.push(p + w); }
  /* margini mai fine: pixelii lipiți de fundalul scos devin semitransparenți */
  for (let p = 0; p < w * h; p++) { const i = p * 4; if (d[i + 3] === 0) continue; const x = p % w, y = (p / w) | 0; let n = 0;
    if (x > 0 && d[i - 1] === 0) n++; if (x < w - 1 && d[i + 7] === 0) n++; if (y > 0 && d[i - w * 4 + 3] === 0) n++; if (y < h - 1 && d[i + w * 4 + 3] === 0) n++; if (n) d[i + 3] = Math.round(d[i + 3] * (1 - n * 0.2)); }

function chart(points, unit) {
  if (points.length < 2) return `<p class="empty">${points.length ? 'Încă un antrenament și apare graficul.' : 'Graficul apare după primele două înregistrări.'}</p>`;
  const W = 340, H = 170, L = 38, Rr = 40, T = 12, B = 24;
  const xs = points.map(p => p.t), ys = points.map(p => p.v);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  const span = Math.max(hi - lo, hi * 0.04, 1); lo = Math.floor((lo - span * 0.2)); hi = Math.ceil(hi + span * 0.2);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);

  const Y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const ticks = [lo, (lo + hi) / 2, hi];
  const d = points.map((p, i) => `${i ? 'L' : 'M'}${X(p.t).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' ');
  const last = points[points.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafic progres">
    ${ticks.map(v => `<line class="grid" x1="${L}" x2="${W - Rr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${fmt(v, 0)}</text>`).join('')}

    <path class="lineA" pathLength="1" d="${d}"/>
    ${points.slice(0, -1).map(p => `<circle class="dot" cx="${X(p.t)}" cy="${Y(p.v)}" r="2.5"/>`).join('')}
    <circle class="dot-ring" cx="${X(last.t)}" cy="${Y(last.v)}" r="5"/>
    <text class="endlbl" x="${X(last.t) + 9}" y="${Y(last.v) + 4}">${fmt(last.v)}</text>
    <text class="ax" x="${L}" y="${H - 6}">${fmtDate(x0)}</text><text class="ax" x="${W - Rr}" y="${H - 6}" text-anchor="end">${fmtDate(x1)}</text>
  </svg>`;
}
function deltaTxt(points, unit) {
  if (points.length < 2) return '';
  const dlt = points[points.length - 1].v - points[0].v;
  return `<span class="${dlt >= 0 ? 'delta-up' : 'delta-down'}">${dlt >= 0 ? '+' : '−'}${fmt(Math.abs(dlt))} ${unit} de la început</span>`;
}

/* ---------- Statistici, recorduri, serie ---------- */
function weekStart(t = Date.now()) { const d = new Date(dayKey(new Date(t))); return d.getTime() - ((d.getDay() + 6) % 7) * DAYMS; }
function weekCount(ws) { return S.sessions.filter(s => s.date >= ws && s.date < ws + 7 * DAYMS).length; }
function plannedSoFar(ws) { let n = 0; for (let i = 0; i < 7; i++) { const d = new Date(ws + i * DAYMS); if (d.getTime() > Date.now()) break; if (planFor(d)) n++; } return n; }
function streakWeeks() {
  let ws = weekStart(), n = 0;
  if (weekCount(ws) >= Math.max(1, plannedSoFar(ws))) n++;
  ws -= 7 * DAYMS;
  while (weekCount(ws) >= DAYS.length) { n++; ws -= 7 * DAYMS; }
  return n;
}
function allPRs() {
  const best = {}, prs = [];
  for (const s of sessionsSorted()) for (const id in s.ex) {
    const top = s.ex[id].reduce((b, x) => (!b || e1rm(x.kg, x.reps) > e1rm(b.kg, b.reps)) ? x : b, null);
    const v = e1rm(top.kg, top.reps);
    if (best[id] != null && v > best[id] + 0.01) prs.push({ id, date: s.date, kg: top.kg, reps: top.reps, gain: v - best[id] });
    best[id] = Math.max(best[id] || 0, v);
  }
  return { prs, best };
}
function totals() {
  const vol = S.sessions.reduce((a, s) => a + volume(s), 0), mins = S.sessions.reduce((a, s) => a + (s.dur || 0), 0) / 60000;
  return { n: S.sessions.length, vol, hours: mins / 60, prs: allPRs().prs.length, sets: S.sessions.reduce((a, s) => a + Object.values(s.ex).reduce((b, x) => b + x.length, 0), 0) };
}

function ringsCard() {
  const ws = weekStart(), done = weekCount(ws), goal = DAYS.length;
  const volW = S.sessions.filter(s => s.date >= ws).reduce((a, s) => a + volume(s), 0);
  const past = [1, 2, 3, 4].map(k => S.sessions.filter(s => s.date >= ws - k * 7 * DAYMS && s.date < ws - (k - 1) * 7 * DAYMS).reduce((a, s) => a + volume(s), 0)).filter(v => v > 0);
  const volGoal = past.length ? past.reduce((a, b) => a + b, 0) / past.length : 8000;
  const wGoal = waterTimes().length || 8, wNow = (S.water && S.water.log[dayKey()]) || 0;
  const rings = [
    { k: done / goal, c: 'var(--accent)', r: 50, label: 'Antrenamente', val: `${done}/${goal}`, sub: 'săptămâna aceasta' },

    { k: wNow / wGoal, c: 'var(--water)', r: 26, label: 'Apă', val: `${wNow}/${wGoal}`, sub: 'pahare azi' }
  ];
  const C = r => 2 * Math.PI * r;
  const st = streakWeeks();
  return `<section class="rings">

    <div class="rg-list">${rings.map(g => `<div class="rg-item"><i style="background:${g.c}"></i><span><small>${g.label}</small><b class="num">${g.val}</b><em>${g.sub}</em></span></div>`).join('')}</div>

  </section>`;
}

/* ---------- Record personal în timpul antrenamentului ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-done]'); if (!t || !S.active) return;
  const row = t.closest('.set'); if (!row || !row.classList.contains('done')) return;
  const id = row.dataset.ex, x = S.active.sets[id][+row.dataset.i], kg = parseNum(x.kg) || 0, reps = parseInt(x.reps) || 0;
  if (!kg || !reps) return;
  const prev = allPRs().best[id]; if (prev == null) return;
  const v = e1rm(kg, reps); if (v <= prev + 0.01) return;
  const otherDone = S.active.sets[id].filter((s, j) => s.done && j !== +row.dataset.i).some(s => e1rm(parseNum(s.kg) || 0, parseInt(s.reps) || 0) >= v);
  if (otherDone) return;
  showPR(id, kg, reps, v - prev);
});

  g.innerHTML = `<div class="pr-card">${Buddy.flex.replace('class="buddy ', 'class="buddy pr-av ')}
    <div class="pr-badge">${LI.trophy}<span>Record personal</span></div>
    <h2 class="pr-t">${esc(EX[id].name)}</h2>
    <div class="pr-v num">${fmt(kg)} kg × ${reps}</div>
    <p>Cu ${fmt(gain)} kg peste maximul tău estimat de până acum.</p>
    <button class="btn btn-main" data-pr-close>Continuă</button></div>`;
  g.hidden = false; g.classList.remove('show'); void g.offsetWidth; g.classList.add('show');
  Buddy.start(); setTimeout(() => FX.celebrate(), 200);
  try { beep(); } catch (e) { }
}
document.addEventListener('click', e => { if (e.target.closest('[data-pr-close]') || e.target.id === 'pr') { const g = $('#pr'); g.hidden = true; g.innerHTML = ''; const w = $('#workout'), y = w ? w.scrollTop : 0; render(); if (w) w.scrollTop = y; } });

/* ---------- Celebrare la finalul antrenamentului ---------- */
const _finish = finishWorkout;
finishWorkout = function () {
  const a = S.active, n0 = S.sessions.length;
  _finish();
  if (S.sessions.length > n0) {
    const s = S.sessions[S.sessions.length - 1], sets = Object.values(s.ex).reduce((x, y) => x + y.length, 0);
    const g = $('#pr');
    g.innerHTML = `<div class="pr-card done-card">${Buddy.cele.replace('class="buddy ', 'class="buddy pr-av ')}
      <div class="pr-badge done-b">${ICON.check}<span>Antrenament terminat</span></div>
      <h2 class="pr-t">${esc(byId(s.day).name)}</h2>
      <div class="done-stats"><div><b class="num">${Math.round(s.dur / 60000)}</b><small>minute</small></div><div><b class="num">${sets}</b><small>serii</small></div><div><b class="num">${fmt(volume(s) / 1000, 1)}t</b><small>ridicate</small></div></div>
      <button class="btn btn-main" data-pr-close>Super!</button></div>`;
    g.hidden = false; g.classList.remove('show'); void g.offsetWidth; g.classList.add('show'); Buddy.start();
  }
};

/* ---------- Demo pentru investitori: date de exemplu + prezentarea de la prima pornire ---------- */
(function () {
  if (!window.FORTA_DEMO) return;
  /* 8 săptămâni de antrenamente realiste, cu progres treptat */
  function seed() {
    const st = { incline: 20, chestpress: 45, pecdeck: 40, rope: 20, vbar: 25, pulldown: 50, supine: 45, dbrow: 22, cablerow: 50, straightarm: 20, zwide: 25, znarrow: 22.5, hammer: 12, squat: 70, rdl: 60, legpress: 120, legcurl: 35, dbpress: 18, lateral: 8, facepull: 20 };
    const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const monday = today.getTime() - ((today.getDay() + 6) % 7) * DAYMS;
    const sess = [];
    for (let w = 8; w >= 0; w--) for (const d of DAYS) {
      const day = new Date(monday - w * 7 * DAYMS + (d.wd - 1) * DAYMS);
      if (day.getTime() >= today.getTime()) continue;
      if (w === 5 && d.id === 'C') continue;
      day.setHours(rnd(0, 3) ? 18 : 8, rnd(0, 50));
      const ex = {};
      for (const id of d.ex) {
        const prog = (8 - w) * (EX[id].step || 2.5) * 0.55, kg = Math.round((st[id] + prog) / (EX[id].step || 2.5)) * (EX[id].step || 2.5);
        ex[id] = [0, 1, 2].map(i => ({ kg, reps: Math.max(9, 12 - i - (rnd(0, 2) === 0 ? 1 : 0)) }));
      }
      sess.push({ id: 'd' + day.getTime(), day: d.id, date: day.getTime(), dur: rnd(48, 66) * 60000, ex });
    }
    const body = []; for (let i = 0; i < 9; i++) body.push({ t: monday - (8 - i) * 7 * DAYMS + 2 * DAYMS, kg: Math.round((79.4 + i * 0.36 + (Math.random() - .5) * .3) * 10) / 10 });
    const wlog = {}; for (let i = 1; i < 14; i++) wlog[dayKey(new Date(today.getTime() - i * DAYMS))] = rnd(9, 15);
    wlog[dayKey()] = 6;
    S = Object.assign(fresh(), { sessions: sess, body, mig: 2 });
    S.water.log = wlog;
    S.suppLog[dayKey()] = ['cr1', 'cr2', 's2'];
    save();
  }
  window.demoSeed = seed;

  const done = () => { try { return localStorage.getItem('forta-onb') === '1'; } catch (e) { return false; } };
  const ob = document.createElement('div'); ob.className = 'onb'; ob.id = 'onb';
  let step = 0, photo = '', goal = 'Masă musculară', days = 3;
  const GOALS = [['Masă musculară', 'Mai mult volum, 8-12 repetări'], ['Forță', 'Greutăți mari, 4-6 repetări'], ['Definire', 'Volum și cardio, deficit caloric'], ['Sănătate', '2-3 antrenamente ușoare pe săptămână']];
  function view() {
    if (step === 0) return `<div class="ob-in ob-0">
      <div class="ob-hero">${Buddy.cele.replace('class="buddy ', 'class="buddy ob-av ')}</div>
      <div class="ob-brand">Forța</div>
      <h1>Antrenorul tău are fața ta.</h1>
      <p>Transformă o poză într-un avatar 3D care se antrenează cu tine, îți arată progresul și te motivează în fiecare zi.</p>
      <button class="btn btn-main" data-ob="1">Începe</button>
      <small class="ob-legal">Durează mai puțin de un minut.</small></div>`;
    if (step === 1) return `<div class="ob-in">
      <div class="ob-steps"><i class="on"></i><i></i><i></i></div>
      <h2>Creează-ți avatarul</h2><p>Alege o poză clară cu fața ta, din față, cu lumină bună.</p>
      <label class="ob-drop" for="ob-file">${photo ? `<img src="${photo}" alt="Poza aleasă">` : `<span class="ob-cam">${LI.camera}</span><b>Alege o poză</b><small>sau fă un selfie acum</small>`}</label>
      <input type="file" id="ob-file" accept="image/*" hidden>
      <button class="btn btn-main" data-ob="2">${photo ? 'Generează avatarul 3D' : 'Folosește poza demo'}</button></div>`;
    if (step === 2) return `<div class="ob-in ob-gen">
      <div class="ob-steps"><i class="on"></i><i class="on"></i><i></i></div>
      <div class="gen"><svg viewBox="0 0 200 200" class="gen-ring"><circle cx="100" cy="100" r="90" class="g-bg"/><circle cx="100" cy="100" r="90" class="g-fg" id="g-fg"/></svg>
        <div class="gen-ph">${photo ? `<img src="${photo}" alt="">` : `<img src="${(window.ASSET || '') + 'mini-cristian-flex.jpg'}" alt="">`}</div><div class="gen-scan"></div></div>
      <div class="gen-pct num" id="g-pct">0%</div><div class="gen-txt" id="g-txt">Analizăm trăsăturile feței</div></div>`;
    if (step === 3) return `<div class="ob-in ob-reveal">
      <div class="ob-steps"><i class="on"></i><i class="on"></i><i></i></div>
      <div class="ob-badge">${LI.sparkles}<span>Avatarul tău e gata</span></div>
      <div class="ob-hero big">${Buddy.svg.replace('class="buddy ', 'class="buddy ob-av ')}</div>
      <p>Dansează în zilele de odihnă, face flotări cu tine și își arată bicepșii la fiecare record.</p>
      <button class="btn btn-main" data-ob="4">Continuă</button></div>`;
    if (step === 4) return `<div class="ob-in">
      <div class="ob-steps"><i class="on"></i><i class="on"></i><i class="on"></i></div>
      <h2>Care e obiectivul tău?</h2>
      <div class="ob-goals">${GOALS.map(([g, d]) => `<button class="ob-goal ${g === goal ? 'on' : ''}" data-goal="${g}"><b>${g}</b><small>${d}</small></button>`).join('')}</div>
      <h3>Câte zile pe săptămână?</h3>
      <div class="ob-days">${[2, 3, 4, 5].map(n => `<button class="ob-day ${n === days ? 'on' : ''}" data-days="${n}"><b class="num">${n}</b><small>zile</small></button>`).join('')}</div>
      <button class="btn btn-main" data-ob="5">Generează programul</button></div>`;
    return `<div class="ob-in ob-final"><div class="ob-check">${ICON.check}</div><h2>Programul tău e gata</h2>
      <p>${goal} · ${days} zile pe săptămână. Am pregătit și 8 săptămâni de istoric demo, ca să vezi cum arată progresul.</p>
      <button class="btn btn-main" data-ob="done">Intră în aplicație</button></div>`;
  }
  function draw() { ob.innerHTML = view(); ob.firstElementChild.classList.add('in'); Buddy.start(); if (step === 2) generate(); }
  function generate() {
    const msgs = ['Analizăm trăsăturile feței', 'Construim modelul 3D', 'Îi alegem echipamentul', 'Îl învățăm să facă flotări', 'Ultimele retușuri'];
    const C = 2 * Math.PI * 90, fg = $('#g-fg'); fg.style.strokeDasharray = C; let t0 = performance.now();
    const tick = t => {
      const k = Math.min(1, (t - t0) / 4600); fg.style.strokeDashoffset = C * (1 - k);
      const p = $('#g-pct'), m = $('#g-txt'); if (!p) return;
      p.textContent = Math.round(k * 100) + '%'; m.textContent = msgs[Math.min(msgs.length - 1, Math.floor(k * msgs.length))];
      if (k < 1) requestAnimationFrame(tick); else setTimeout(() => { step = 3; draw(); FX.celebrate(); }, 350);
    };
    requestAnimationFrame(tick);
  }
  ob.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.goal) { goal = b.dataset.goal; draw(); return; }
    if (b.dataset.days) { days = +b.dataset.days; draw(); return; }
    const n = b.dataset.ob; if (!n) return;
    if (n === 'done') { try { localStorage.setItem('forta-onb', '1'); } catch (er) { } ob.classList.add('out'); setTimeout(() => { ob.remove(); lastTab = null; tab = 'azi'; render(); }, 450); return; }
    if (n === '5') seed();
    step = +n; draw();
  });
  ob.addEventListener('change', e => {
    if (e.target.id !== 'ob-file' || !e.target.files[0]) return;
    const r = new FileReader(); r.onload = () => { photo = r.result; draw(); }; r.readAsDataURL(e.target.files[0]);
  });
  window.startOnboarding = () => { step = 0; photo = ''; document.body.appendChild(ob); ob.classList.remove('out'); draw(); };
  if (!done()) { if (!S.sessions.length) seed(); window.startOnboarding(); }
  else if (!S.sessions.length) seed();
  document.addEventListener('click', e => { if (e.target.closest('[data-onb-reset]')) { try { localStorage.removeItem('forta-onb'); } catch (er) { } window.startOnboarding(); } });
})();

render();
(function () {
  const sp = document.getElementById('splash'); if (!sp) return;
  const v = sp.querySelector('video'); v.muted = true;
  const p = v.play(); if (p && p.catch) p.catch(() => { });
  v.addEventListener('playing', () => sp.classList.add('vid'));
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const hide = () => { if (sp.classList.contains('out')) return; sp.classList.add('out'); setTimeout(() => { sp.remove(); }, 650); };
  setTimeout(hide, still ? 700 : 2600);
  sp.addEventListener('pointerdown', hide);
})();
</script>
