.rings::before { content: ''; position: absolute; z-index: -1; width: 260px; height: 260px; left: -70px; top: -80px; border-radius: 50%; background: radial-gradient(circle, rgba(216,16,28,.45), transparent 65%); filter: blur(10px); animation: spot 6s ease-in-out infinite; }
.rings::after { content: ''; position: absolute; z-index: -1; inset: 0; opacity: .5; pointer-events: none;
  background-image: radial-gradient(rgba(255,255,255,.08) 1px, transparent 1px); background-size: 14px 14px; -webkit-mask-image: linear-gradient(120deg, #000, transparent 70%); mask-image: linear-gradient(120deg, #000, transparent 70%); }
.ring3 { width: 132px; height: 132px; transform: none !important; filter: none !important; animation: none !important; }
.rg-bg { opacity: .18 !important; stroke-width: 11 !important; }
.rg-fg { stroke-width: 11 !important; filter: drop-shadow(0 0 4px currentColor); }
.rg-fg { color: inherit; }
.rg-item small { color: rgba(255,255,255,.62) !important; }
.rg-item b { font: 800 24px/1 var(--display) !important; color: #fff; }
.rg-item em { color: rgba(255,255,255,.4) !important; }
.rg-item i { box-shadow: 0 0 10px currentColor; }
.rings .streak { background: rgba(255,255,255,.07) !important; border: 1px solid rgba(255,255,255,.08) !important; color: rgba(255,255,255,.8); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.rings .streak b { color: #ff4a55 !important; }
.rings .streak svg { color: #ff4a55 !important; filter: drop-shadow(0 0 6px #ff2a36); }

/* bento: apa și următoarea doză, una lângă alta */
.bento { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.tile { position: relative; overflow: hidden; isolation: isolate; display: grid; align-content: start; gap: 6px; min-height: 186px; padding: 16px; border-radius: var(--r-md); background: var(--surface);
  box-shadow: inset 0 1px 0 var(--hl), 0 1px 1px rgba(40,18,22,.04), 0 6px 12px -6px rgba(40,18,22,.10), 0 26px 40px -26px rgba(60,20,26,.35); }
.tile > :not(.liquid) { position: relative; z-index: 1; }
.t-head { display: flex; align-items: center; gap: 8px; }
.t-head small { font: 600 13px var(--sys); color: var(--muted); }
.t-head .drop, .pill-ic { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; color: #fff; }
.t-head .drop { background: linear-gradient(160deg, #6cc0ff, var(--water)); box-shadow: 0 6px 12px -6px var(--water); }
.t-head svg { width: 16px; height: 16px; }
.pill-ic { background: linear-gradient(160deg, #ff4a55, var(--accent)); box-shadow: 0 6px 12px -6px var(--accent); }
.t-big { display: flex; align-items: baseline; gap: 2px; margin-top: 6px; }
.t-big b { font: 800 56px/.85 var(--display); color: var(--ink); letter-spacing: .005em; }
.t-big span { font: 800 26px/1 var(--display); color: var(--faint); }
.t-sub { font: 500 12.5px/1.35 var(--sys); color: var(--muted); }
.t-sub strong { color: var(--ink); font-weight: 600; }
.water.tile { padding: 16px !important; margin: 0 !important; background: linear-gradient(180deg, #fff, #f3f9ff) !important; border: 0 !important; }
.water.tile .t-big b { color: #0d4f8a; }
.water.tile .water-btns { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; margin-top: auto; padding-top: 6px; }
.wbtn { height: 40px; border-radius: 12px; font: 700 22px/1 var(--sys); color: #0d4f8a; background: rgba(255,255,255,.75); box-shadow: inset 0 1px 0 var(--hl), 0 2px 6px -2px rgba(13,79,138,.25); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.wbtn.plus { color: #fff; background: linear-gradient(180deg, #45a6f2, var(--water) 55%, #156fc0); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -2px 0 rgba(0,40,90,.3), 0 2px 0 #0f5a9e, 0 10px 18px -8px rgba(31,138,224,.85); }
.water.tile .liquid i { background: linear-gradient(180deg, rgba(31,138,224,.20), rgba(31,138,224,.34)); }
.water.tile .liquid .wv { fill: rgba(31,138,224,.22); }
.water.tile .liquid::after { content: ''; position: absolute; left: 18%; bottom: 12px; width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.7); box-shadow: 22px -14px 0 -1px rgba(255,255,255,.5), 52px -4px 0 -2px rgba(255,255,255,.6); animation: bubbles 3.4s ease-in infinite; }
@keyframes bubbles { from { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } to { transform: translateY(-70px); opacity: 0; } }
.next-s { background: radial-gradient(130% 100% at 100% 0%, #fff1f1, #fff 60%) !important; }
.next-s.due { background: radial-gradient(130% 100% at 100% 0%, #ffd9dc, #fff 70%) !important; }
.next-s.due .pill-ic { animation: ring 1.4s ease-in-out infinite; }
@keyframes ring { 0%, 60%, 100% { transform: rotate(0); } 10% { transform: rotate(-14deg); } 20% { transform: rotate(12deg); } 30% { transform: rotate(-8deg); } 40% { transform: rotate(5deg); } }
.next-s.done .t-big b { color: var(--accent); }
.t-act { margin-top: auto; height: 40px; border-radius: 12px; font: 650 14px var(--sys); color: #fff; background: var(--ink); box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 2px 0 #000, 0 10px 18px -8px rgba(0,0,0,.5); }

/* suplimentele: o linie a zilei, cu „acum” marcat */
.checklist.tl { position: relative; padding: 6px 0; }
.checklist.tl::before { content: ''; position: absolute; left: 44px; top: 18px; bottom: 18px; width: 2px; border-radius: 2px; background: linear-gradient(180deg, var(--line-2), var(--line)); }
.checklist.tl .check { grid-template-columns: 58px 1fr 28px; border: 0 !important; background: transparent !important; position: relative; }
.checklist.tl .check + .check { border-top: 0 !important; }
.checklist.tl .check time { font-size: 20px; text-align: left; padding-left: 0; }
.checklist.tl .check::before { content: ''; position: absolute; left: 40px; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: var(--surface); box-shadow: 0 0 0 2px var(--line-2); z-index: 1; }
.checklist.tl .check.taken::before { background: var(--ink); box-shadow: 0 0 0 2px var(--ink); }
.checklist.tl .check.late::before { background: var(--accent); box-shadow: 0 0 0 2px var(--accent), 0 0 0 6px rgba(216,16,28,.15); animation: latepulse 1.6s ease-in-out infinite; }
@keyframes latepulse { 50% { box-shadow: 0 0 0 2px var(--accent), 0 0 0 10px rgba(216,16,28,0); } }
.checklist.tl .check.late em { color: var(--accent); font-weight: 600; }
.checklist.tl .check time { position: relative; left: -2px; width: 34px; font-size: 17px; }
.checklist.tl .check { padding-left: 14px; grid-template-columns: 52px 1fr 28px; }
.checklist.tl .check > span:not(.tick) { padding-left: 4px; }
.tl-now { position: relative; height: 0; margin: 2px 0; }
.tl-now::before { content: ''; position: absolute; left: 14px; right: 14px; top: 0; height: 2px; background: linear-gradient(90deg, var(--accent), rgba(216,16,28,0)); }
.tl-now::after { content: ''; position: absolute; left: 39px; top: -5px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px rgba(216,16,28,.18); animation: latepulse 1.6s ease-in-out infinite; }
.tl-now span { position: absolute; right: 14px; top: -9px; padding: 2px 8px; border-radius: 999px; background: var(--accent); color: #fff; font: 700 11px/14px var(--sys); }

/* săptămâna: bare de volum care cresc */
.week { padding: 14px 8px 12px !important; align-items: end; }
.wd { position: relative; padding-top: 52px !important; }
.wbar { position: absolute; left: 50%; bottom: 58px; width: 14px; margin-left: -7px; height: calc(var(--h, 0) * 52px); border-radius: 7px 7px 3px 3px; background: linear-gradient(180deg, #ff4a55, var(--accent)); box-shadow: 0 6px 12px -4px rgba(216,16,28,.6), inset 0 1px 0 rgba(255,255,255,.4); transform-origin: 50% 100%; }
.wd:not(.done) .wbar { height: 6px; background: var(--line); box-shadow: none; }
.wd.plan:not(.done) .wbar { background: repeating-linear-gradient(45deg, rgba(216,16,28,.25) 0 3px, transparent 3px 6px); height: 26px; box-shadow: inset 0 0 0 1.5px rgba(216,16,28,.35); }
#view.intro .wbar, .rv-in .wbar { animation: barup 1s cubic-bezier(.2, 1.3, .4, 1) both; animation-delay: calc(.4s + var(--h) * .3s); }
@keyframes barup { from { transform: scaleY(0); } }

/* citatul: carte roșie, ca o carte de joc */
.q-front { background: radial-gradient(120% 120% at 100% 0%, #ff3a45, var(--accent) 45%, #8e0912) !important; color: #fff !important; min-height: 96px; }
.q-front small { color: rgba(255,255,255,.8) !important; }
.q-front b { font: 800 26px/1 var(--display) !important; }
.q-gift { background: rgba(255,255,255,.18) !important; color: #fff !important; animation: gift 2.4s ease-in-out infinite; }
@keyframes gift { 0%, 70%, 100% { transform: none; } 78% { transform: rotate(-12deg) scale(1.1); } 86% { transform: rotate(10deg) scale(1.1); } 94% { transform: rotate(-4deg); } }
.q-front::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.35) 45%, transparent 60%) -150% 0 / 250% 100% no-repeat; animation: foil 5s ease-in-out infinite; pointer-events: none; }
.q-front { position: relative; overflow: hidden; }
.q-back { background: var(--ink) !important; color: #fff; }
.q-back p { color: #fff !important; font: 800 24px/1.12 var(--display) !important; letter-spacing: .005em; }
.q-back .q-who small { color: rgba(255,255,255,.5) !important; }
.q-mark { color: var(--accent) !important; }
.checklist.tl { background: var(--surface) !important; }
.checklist.tl .check { padding-left: 16px !important; grid-template-columns: 46px 1fr 28px !important; gap: 26px !important; }
.checklist.tl .check time { left: 0 !important; width: auto !important; font-size: 19px !important; }
.checklist.tl .check > span:not(.tick) { padding-left: 0 !important; }
.checklist.tl::before { left: 74px !important; }
.checklist.tl .check::before { left: 70px !important; }
.tl-now::after { left: 69px !important; }
.tl-now::before { left: 74px !important; }
.rings .streak span { color: rgba(255,255,255,.78) !important; }
.wbar { bottom: auto !important; top: calc(50px - var(--h, 0) * 46px) !important; height: calc(var(--h, 0) * 46px) !important; }
.wd:not(.done) .wbar { top: 44px !important; height: 6px !important; }
.wd.plan:not(.done) .wbar { top: 26px !important; height: 24px !important; }
.wd { padding-top: 60px !important; }

/* ================= v8: toate paginile ================= */
/* placa neagră, reutilizabilă */
.phero, .mmap, .day-title, .q-back { --plate: radial-gradient(120% 90% at 0% 0%, #3a2328 0%, #1d1517 45%, #120d0f 100%); }

/* ---------- Apa: o sticlă care se umple ---------- */
.hyd { position: relative; display: grid; grid-template-columns: 92px 1fr; gap: 16px; align-items: center; padding: 16px 16px 16px 12px; margin-bottom: 12px; border-radius: var(--r-md); overflow: hidden; isolation: isolate;
  background: radial-gradient(120% 140% at 0% 100%, #dff0ff 0%, #f6fbff 45%, #fff 100%);
  box-shadow: inset 0 1px 0 var(--hl), 0 1px 1px rgba(13,79,138,.05), 0 6px 12px -6px rgba(13,79,138,.12), 0 26px 40px -26px rgba(13,79,138,.4); }
.hyd::before { content: ''; position: absolute; z-index: -1; width: 180px; height: 180px; left: -60px; bottom: -80px; border-radius: 50%; background: radial-gradient(circle, rgba(31,138,224,.28), transparent 65%); animation: spot 5s ease-in-out infinite; }
.bottle { width: 92px; height: 150px; display: grid; place-items: center; filter: drop-shadow(0 14px 14px rgba(13,79,138,.25)); }
.bottle svg { width: 80px; height: 150px; overflow: visible; }
.b-back { fill: rgba(255,255,255,.65); }
.b-glass { fill: none; stroke: rgba(13,79,138,.35); stroke-width: 1.6; }
.b-shine { stroke: rgba(255,255,255,.9); stroke-width: 3.5; stroke-linecap: round; fill: none; }
.b-cap { fill: #0d4f8a; }
.b-fill { transform: translateY(calc(14px + (1 - var(--lv, 0)) * 92px)); transition: transform 1.3s cubic-bezier(.2, 1.2, .3, 1); }
#view.intro .b-fill { animation: bfill 1.8s .5s cubic-bezier(.2, 1, .3, 1) both; }
@keyframes bfill { from { transform: translateY(110px); } }
.b-wave { fill: url(#bwat); }
.b-wave.w2 { fill: #8fd0ff; opacity: .7; animation: bwave 3.2s linear infinite reverse; }
.b-wave.w1 { animation: bwave 2.4s linear infinite; }
@keyframes bwave { to { transform: translateX(30px); } }
.bub { fill: rgba(255,255,255,.85); animation: bub 3s ease-in infinite; }
.bub.b2 { animation-delay: 1s; } .bub.b3 { animation-delay: 2s; }
@keyframes bub { from { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } to { transform: translateY(-70px); opacity: 0; } }
.hyd-body { display: grid; gap: 6px; min-width: 0; }
.hyd-l { font: 600 13px var(--sys); color: #2a6aa3; }
.hyd-n { display: flex; align-items: baseline; gap: 8px; }
.hyd-n b { font: 800 60px/.82 var(--display); color: #0d4f8a; }
.hyd-n span { font: 600 14px var(--sys); color: #4f7ea8; }
.hyd-bar { height: 6px; border-radius: 3px; background: rgba(31,138,224,.14); overflow: hidden; }
.hyd-bar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #5cb8ff, var(--water)); box-shadow: 0 0 10px rgba(31,138,224,.6); transition: width 1s cubic-bezier(.2, 1, .3, 1); }
#view.intro .hyd-bar i { animation: growx 1.4s .6s cubic-bezier(.2, 1, .3, 1) both; transform-origin: 0 50%; }
.hyd-s { font: 500 12.5px/1.35 var(--sys); color: #4f7ea8; }
.hyd-btns { display: grid; grid-template-columns: 44px 1fr; gap: 8px; margin-top: 4px; }
.hyd .wbtn { height: 44px; }
.hyd .wbtn.plus { display: flex; align-items: center; justify-content: center; gap: 8px; font: 650 14.5px var(--sys); }
.hyd .wbtn.plus svg { width: 16px; height: 16px; }

/* ---------- Următoarea doză: rândul ei iese în față ---------- */
.checklist.tl .check.next { margin: 6px 10px; padding: 14px 12px 14px 6px !important; border-radius: 16px; background: linear-gradient(120deg, #fff1f2, #fff) !important;
  box-shadow: inset 0 0 0 1.5px rgba(216,16,28,.22), 0 12px 22px -14px rgba(216,16,28,.55) !important; grid-template-columns: 46px 1fr 28px !important; }
.checklist.tl .check.next time { color: var(--accent) !important; font-size: 22px !important; }
.checklist.tl .check.next::before { background: var(--accent) !important; box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--accent) !important; left: 60px !important; }
.check .when { display: block; margin-top: 4px; font: 600 12px var(--sys); color: var(--accent); }
.check.next .tick { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(216,16,28,.1); animation: latepulse 1.8s ease-in-out infinite; }

/* ---------- Program: fiecare zi e o carte de antrenament ---------- */
.day-block { gap: 0 !important; border-radius: var(--r-lg); background: var(--surface); overflow: hidden;
  box-shadow: inset 0 1px 0 var(--hl), 0 1px 1px rgba(40,18,22,.04), 0 6px 12px -6px rgba(40,18,22,.10), 0 30px 44px -26px rgba(60,20,26,.4); }
.day-block + .day-block { margin-top: 18px !important; }
.day-title { position: relative; overflow: hidden; isolation: isolate; display: grid !important; grid-template-columns: 1fr auto; grid-template-rows: auto auto; gap: 6px 12px; align-items: end; padding: 20px 18px 18px; background: var(--plate); color: #fff; }
.day-title::before { content: ''; position: absolute; z-index: -1; width: 240px; height: 240px; right: -60px; top: -110px; border-radius: 50%; background: radial-gradient(circle, rgba(216,16,28,.5), transparent 65%); }
.dt-num { position: absolute; z-index: -1; right: 14px; bottom: -26px; font: 800 150px/1 var(--display) !important; color: transparent; -webkit-text-stroke: 1.5px rgba(255,255,255,.14); }
.day-title h3 { color: #fff !important; font-size: 38px !important; grid-column: 1; }
.day-title h3 span { color: #ff5560 !important; }
.dt-meta { grid-column: 1; font: 500 12.5px var(--sys); color: rgba(255,255,255,.55); }
.day-title .btn-ghost { grid-column: 2; grid-row: 1 / span 2; align-self: center; background: linear-gradient(180deg, #ef2532, var(--accent) 55%, #c00d18) !important; color: #fff !important;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 2px 0 #7a0710, 0 10px 20px -8px rgba(216,16,28,.9) !important; min-height: 42px !important; padding: 0 18px !important; }
.day-block .ex-list { border-radius: 0 !important; box-shadow: none !important; background: transparent; }
.ex-list .ex-row { padding-block: 12px; }
.ex-list .ex-row .rig { width: 58px !important; height: 58px !important; background: linear-gradient(180deg, #f7f4f3, #efebea) !important; box-shadow: inset 0 1px 0 var(--hl), inset 0 -1px 0 rgba(0,0,0,.04); }
.ex-list .ex-row strong { font-weight: 600; }

/* ---------- Progres ---------- */
.phero { position: relative; overflow: hidden; isolation: isolate; display: grid; gap: 10px; padding: 20px 18px 16px; border-radius: var(--r-lg); background: var(--plate); color: #fff;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 30px 50px -24px rgba(40,8,14,.7); }
.phero::before { content: ''; position: absolute; z-index: -1; width: 300px; height: 300px; left: -100px; top: -140px; border-radius: 50%; background: radial-gradient(circle, rgba(216,16,28,.5), transparent 65%); animation: spot 6s ease-in-out infinite; }
.ph-l { font: 600 13px var(--sys); color: rgba(255,255,255,.55); }
.ph-n { display: flex; align-items: baseline; gap: 10px; }
.ph-n b { font: 800 76px/.8 var(--display); color: #fff; text-shadow: 0 0 30px rgba(255,60,70,.35); }
.ph-n span { font: 600 15px var(--sys); color: rgba(255,255,255,.7); }
.ph-meta { display: flex; gap: 16px; flex-wrap: wrap; font: 500 13px var(--sys); color: rgba(255,255,255,.6); }
.ph-meta b { font: 800 18px var(--display); color: #fff; margin-right: 3px; }
.ph-meta .up b { color: #4be08a; } .ph-meta .down b { color: #ff6b74; }
.ph-bars { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; align-items: end; height: 110px; margin-top: 6px; }
.phb { display: grid; gap: 6px; justify-items: center; align-content: end; height: 100%; }
.phb i { width: 100%; max-width: 26px; height: calc(var(--h) * 84px + 4px); border-radius: 8px 8px 4px 4px; background: linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,.1)); transform-origin: 50% 100%; }
.phb.now i { background: linear-gradient(180deg, #ff4a55, var(--accent)); box-shadow: 0 0 18px rgba(255,40,50,.6), inset 0 1px 0 rgba(255,255,255,.4); }
.phb small { font: 600 10.5px var(--sys); color: rgba(255,255,255,.4); }
.phb.now small { color: #ff6b74; }
#view.intro .phb i, .rv-in .phb i { animation: barup 1s cubic-bezier(.2, 1.3, .4, 1) both; animation-delay: calc(.4s + var(--i) * .06s); }

.mmap { background: var(--plate) !important; color: #fff; --surface-3: #3b2f33; --surface-2: #2b2226; box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 30px 50px -24px rgba(40,8,14,.7) !important; border: 0 !important; border-radius: var(--r-lg) !important; }
.mmap .body { filter: drop-shadow(0 0 14px rgba(216,16,28,.35)); }
.mm-bodies figcaption { color: rgba(255,255,255,.45) !important; text-transform: none !important; letter-spacing: 0 !important; font-size: 12px !important; }
.mm-row { color: rgba(255,255,255,.85); }
.mm-row i { background: rgba(255,255,255,.08) !important; height: 8px !important; border-radius: 4px !important; }
.mm-row i b { box-shadow: 0 0 10px rgba(255,40,50,.6); border-radius: 4px !important; }
.mm-row em { color: #fff !important; font: 800 16px var(--display) !important; }
.mm-note { color: rgba(255,255,255,.4) !important; }

.pr-rail { display: grid; grid-auto-flow: column; grid-auto-columns: 62%; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 4px max(16px, env(safe-area-inset-left, 0px)) 18px; scrollbar-width: none; }
.pr-rail::-webkit-scrollbar { display: none; }
.pr-tile { scroll-snap-align: start; position: relative; overflow: hidden; isolation: isolate; display: grid; gap: 4px; padding: 16px; border-radius: var(--r-md); color: #fff;
  background: radial-gradient(130% 120% at 100% 0%, #ff4651, var(--accent) 45%, #7c0911); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 3px 0 #6d070e, 0 20px 30px -16px rgba(216,16,28,.8); }
.pr-tile::after { content: ''; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.35) 45%, transparent 60%) -150% 0 / 250% 100% no-repeat; animation: foil 5s calc(var(--i) * .5s) ease-in-out infinite; pointer-events: none; }
.pr-ic { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: rgba(255,255,255,.18); margin-bottom: 6px; }
.pr-ic svg { width: 18px; height: 18px; }
.pr-tile small { font: 600 11.5px var(--sys); color: rgba(255,255,255,.7); }
.pr-tile strong { font: 600 14px/1.25 var(--sys); min-height: 2.5em; }
.pr-kg { display: flex; align-items: baseline; gap: 6px; }
.pr-kg b { font: 800 44px/.85 var(--display); }
.pr-kg span { font: 600 13px var(--sys); color: rgba(255,255,255,.8); }
.pr-tile em { justify-self: start; font: 700 12px var(--sys); font-style: normal; padding: 4px 9px; border-radius: 999px; background: rgba(255,255,255,.2); margin-top: 4px; }

.ex-pick { gap: 8px; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 2px max(16px, env(safe-area-inset-left, 0px)) 6px; }
.ex-pick .chip { min-height: 38px; padding: 0 14px; border: 0 !important; background: var(--surface) !important; box-shadow: inset 0 1px 0 var(--hl), 0 4px 10px -6px rgba(40,18,22,.3); font-weight: 600; color: var(--muted); }
.ex-pick .chip[aria-pressed="true"] { background: var(--ink) !important; color: #fff !important; box-shadow: 0 8px 16px -8px rgba(0,0,0,.6); }
.chart-card { border: 0 !important; border-radius: var(--r-md) !important; padding: 18px !important; box-shadow: inset 0 1px 0 var(--hl), 0 6px 12px -6px rgba(40,18,22,.10), 0 26px 40px -26px rgba(60,20,26,.35) !important; }
.chart-head b { font: 800 44px/.85 var(--display) !important; color: var(--ink); }
.chart .lineA { stroke-width: 3 !important; filter: drop-shadow(0 4px 6px rgba(216,16,28,.45)); }
.chart .areaA { opacity: .18 !important; }
.chart .dot-ring { stroke-width: 3; filter: drop-shadow(0 0 6px rgba(216,16,28,.7)); }
.chart .endlbl { font: 800 15px var(--display) !important; }
.delta-up { font: 700 12px var(--sys); padding: 5px 10px; border-radius: 999px; background: #e6f8ee; color: #128a4a; }
.delta-down { font: 700 12px var(--sys); padding: 5px 10px; border-radius: 999px; background: #ffecec; color: var(--accent); }

.hist { border-radius: var(--r-md); background: var(--surface); overflow: hidden; box-shadow: inset 0 1px 0 var(--hl), 0 6px 12px -6px rgba(40,18,22,.10), 0 26px 40px -26px rgba(60,20,26,.35); }
.hist .hist-row { border-radius: 0 !important; border: 0 !important; background: transparent !important; grid-template-columns: 50px 1fr 18px !important; padding: 12px 14px !important; }
.hist .hist-row + .hist-row { border-top: 1px solid var(--line) !important; }
.badge.hd { width: 50px !important; height: 50px !important; border-radius: 14px !important; display: grid !important; place-content: center; gap: 1px; background: var(--soft) !important; color: var(--ink) !important; }
.badge.hd b { font: 800 22px/.9 var(--display); text-align: center; }
.badge.hd small { font: 600 10.5px var(--sys); color: var(--muted); text-align: center; }
.hist-row > span:nth-child(2) { display: grid; gap: 3px; }
.hvol { display: block; height: 4px; border-radius: 2px; background: #f1ecea; position: relative; overflow: hidden; }
.hvol::after { content: ''; position: absolute; inset: 0; width: calc(var(--v) * 100%); border-radius: 2px; background: linear-gradient(90deg, #ff4a55, var(--accent)); }
.field, .row-input input { border: 0 !important; background: var(--soft) !important; border-radius: 14px !important; min-height: 48px; }
.row-input .btn-ghost { background: var(--ink) !important; color: #fff !important; border: 0 !important; border-radius: 14px !important; }

/* ---------- Suplimente ---------- */
.supp { border: 0 !important; border-radius: var(--r-md) !important; padding: 14px 16px !important; box-shadow: inset 0 1px 0 var(--hl), 0 6px 12px -6px rgba(40,18,22,.10), 0 22px 34px -24px rgba(60,20,26,.35) !important; }
.supp-top { grid-template-columns: 44px 1fr auto !important; gap: 12px !important; }
.supp-top > span:first-child:not(.s-ic) { grid-column: 1 / 3; }
.s-ic { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; color: #fff;
  background: linear-gradient(160deg, hsl(var(--hue) 90% 62%), hsl(var(--hue) 80% 44%)); box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 8px 14px -8px hsl(var(--hue) 80% 40%); }
.s-ic svg { width: 20px; height: 20px; }
.supp-top strong { font: 800 21px/1 var(--display) !important; color: var(--ink); }
.supp.off { opacity: .55; }
.supp.off .s-ic { filter: grayscale(1); }
.switch { width: 52px !important; height: 32px !important; background: #e7e1df !important; box-shadow: inset 0 1px 3px rgba(0,0,0,.12); }
.switch::after { width: 26px !important; height: 26px !important; box-shadow: 0 3px 8px rgba(0,0,0,.22), 0 0 0 .5px rgba(0,0,0,.04) !important; transition: transform .35s cubic-bezier(.3, 1.5, .5, 1) !important; }
.switch[aria-checked="true"] { background: linear-gradient(180deg, #ef2532, var(--accent)) !important; box-shadow: inset 0 1px 2px rgba(90,0,8,.4), 0 6px 12px -6px rgba(216,16,28,.8); }
.switch[aria-checked="true"]::after { transform: translateX(20px) !important; }
.supp-ctl input[type="time"] { border: 0 !important; background: var(--soft) !important; border-radius: 12px !important; font: 800 20px var(--display) !important; padding: 6px 10px; color: var(--ink); }
.supp-ctl .del { color: var(--muted); font: 600 13px var(--sys); }
.notice { border: 0 !important; border-radius: var(--r-md) !important; background: var(--plate, #1d1517) !important; background: radial-gradient(120% 90% at 0% 0%, #3a2328 0%, #1d1517 45%, #120d0f 100%) !important; color: #fff; padding: 16px !important;
  box-shadow: 0 26px 40px -24px rgba(40,8,14,.7) !important; }
.notice p, .notice small { color: rgba(255,255,255,.7) !important; }
.notice strong { color: #fff; }
.notice .state-dot { background: #4be08a !important; box-shadow: 0 0 0 4px rgba(75,224,138,.2), 0 0 10px #4be08a; }
.notice .btn-ghost { background: rgba(255,255,255,.1) !important; color: #fff !important; border: 0 !important; }
.add-form { border: 0 !important; border-radius: var(--r-md) !important; padding: 16px !important; box-shadow: inset 0 1px 0 var(--hl), 0 6px 12px -6px rgba(40,18,22,.10), 0 26px 40px -26px rgba(60,20,26,.35) !important; }
.checklist.tl .check.next { width: calc(100% - 16px) !important; margin: 6px 8px !important; }
.ex-list .ex-row { grid-template-columns: 58px 1fr 18px !important; gap: 14px !important; padding-left: 14px !important; }
.rv { transform: translateY(44px) scale(.97) !important; }
.rv.rv-in { transform: none !important; }
@keyframes rise3 { from { opacity: 0; transform: perspective(2400px) translateY(34px) rotateX(5deg) scale(.97); } }
.badge.hd small { text-transform: none !important; letter-spacing: 0 !important; }

/* ================= v9: Forța+ ================= */
/* recuperare */
.recov { position: relative; overflow: hidden; isolation: isolate; display: grid; gap: 14px; padding: 18px; border-radius: var(--r-lg); color: #fff;
  background: radial-gradient(120% 90% at 100% 0%, #213a2c 0%, #151a17 45%, #0e110f 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 30px 50px -24px rgba(8,30,16,.6); }
.recov::before { content: ''; position: absolute; z-index: -1; width: 280px; height: 280px; right: -90px; top: -120px; border-radius: 50%; background: radial-gradient(circle, rgba(34,197,94,.35), transparent 65%); animation: spot 6s ease-in-out infinite; }
.rc-bodies { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.rc-bodies figure { margin: 0; display: grid; justify-items: center; gap: 4px; }
.rc-bodies figcaption { font: 600 12px var(--sys); color: rgba(255,255,255,.45); }
.anat { width: 100%; max-width: 140px; height: auto; overflow: visible; }
.an-sil { fill: #2a302c; stroke: rgba(255,255,255,.08); stroke-width: 1; }
.an-n { fill: #343b37; }
.an-line { stroke: rgba(0,0,0,.25); stroke-width: 1; fill: none; }
.an-m { stroke: rgba(0,0,0,.25); stroke-width: .8; filter: drop-shadow(0 0 3px currentColor); transition: fill .6s; }
#view.intro .an-m, .rv-in .an-m { animation: anin .9s cubic-bezier(.2, 1.2, .4, 1) both; }
@keyframes anin { from { opacity: 0; transform: scale(.85); transform-origin: 60px 120px; } }
.rc-tip { margin: 0; font: 500 13.5px/1.4 var(--sys); color: rgba(255,255,255,.75); padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.06); }
.rc-list { display: grid; gap: 8px; }
.rc-row { display: grid; grid-template-columns: 88px 1fr 44px; gap: 10px; align-items: center; font: 500 13px var(--sys); color: rgba(255,255,255,.85); }
.rc-row i { height: 8px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; }
.rc-row i b { display: block; height: 100%; border-radius: 4px; box-shadow: 0 0 10px currentColor; transform-origin: 0 50%; }
#view.intro .rc-row i b, .rv-in .rc-row i b { animation: growx 1.1s .3s cubic-bezier(.2, 1, .3, 1) both; }
.rc-row em { font: 800 17px var(--display) !important; font-style: normal; text-align: right; }
.rc-legend { display: flex; gap: 14px; font: 500 11.5px var(--sys); color: rgba(255,255,255,.5); }
.rc-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }

/* calculator de discuri */
.plates { position: fixed; inset: 0; z-index: 70; display: grid; align-items: end; background: rgba(12,8,9,0); transition: background .3s; }
.plates.open { background: rgba(12,8,9,.45); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
.pl-card { max-width: 560px; width: 100%; margin: 0 auto; display: grid; gap: 14px; padding: 10px 18px calc(22px + env(safe-area-inset-bottom, 0px)); border-radius: 30px 30px 0 0;
  background: rgba(255,255,255,.86); -webkit-backdrop-filter: blur(28px) saturate(1.6); backdrop-filter: blur(28px) saturate(1.6);
  box-shadow: inset 0 1px 0 var(--hl), 0 -20px 50px -20px rgba(0,0,0,.4); transform: translateY(100%); transition: transform .45s cubic-bezier(.2, 1.1, .3, 1); max-height: 88vh; overflow-y: auto; }
.plates.open .pl-card { transform: none; }
.pl-grab { width: 40px; height: 5px; border-radius: 3px; background: rgba(0,0,0,.15); justify-self: center; }
.pl-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.pl-head small { font: 600 12.5px var(--sys); color: var(--muted); }
.pl-head h3 { margin: 2px 0 0; font: 800 32px/1 var(--display); color: var(--ink); }
.pl-x { width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,.06); font: 400 24px/1 var(--sys); color: var(--muted); }
.pl-kg { display: grid; grid-template-columns: 60px 1fr 60px; align-items: center; gap: 10px; }
.pl-kg > div { display: flex; justify-content: center; align-items: baseline; gap: 6px; }
.pl-kg b { font: 800 84px/.85 var(--display); color: var(--ink); }
.pl-kg span { font: 600 18px var(--sys); color: var(--muted); }
.pl-kg button { height: 60px; border-radius: 18px; font: 600 28px var(--sys); color: var(--ink); background: #fff; box-shadow: inset 0 1px 0 var(--hl), 0 4px 12px -6px rgba(0,0,0,.25); }
.barbell { width: 100%; height: auto; filter: drop-shadow(0 12px 14px rgba(0,0,0,.18)); }
.bb-bar { fill: url(#none); fill: #9a9396; }
.bb-col { fill: #6e6669; }
.bb-t { font: 600 11px var(--sys); fill: var(--muted); }
.pl { stroke: rgba(0,0,0,.25); stroke-width: 1; animation: plin .5s cubic-bezier(.2, 1.4, .4, 1) both; animation-delay: calc(var(--i) * .07s); }
@keyframes plin { from { opacity: 0; transform: translateX(40px); } }
.pl-l { animation-name: plinl; } @keyframes plinl { from { opacity: 0; transform: translateX(-40px); } }
.pl-side { margin: 0; font: 500 14px/1.4 var(--sys); color: var(--muted); text-align: center; }
.pl-side b { color: var(--ink); }
.pl-bars { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.plates h4 { margin: 6px 0 0; font: 800 22px var(--display); color: var(--ink); }
.pl-wu { display: grid; grid-template-columns: repeat(auto-fit, minmax(70px, 1fr)); gap: 8px; }
.pl-wu > div { display: grid; gap: 2px; padding: 10px; border-radius: 14px; background: #fff; text-align: center; box-shadow: inset 0 1px 0 var(--hl), 0 4px 10px -6px rgba(0,0,0,.2); animation: rise3 .5s cubic-bezier(.2, .85, .25, 1) both; animation-delay: calc(.1s + var(--i, 4) * .06s); }
.pl-wu b { font: 800 28px/1 var(--display); color: var(--ink); }
.pl-wu small { font: 600 11.5px var(--sys); color: var(--muted); }
.pl-wu .pl-work { background: linear-gradient(180deg, #ef2532, var(--accent)); }
.pl-wu .pl-work b, .pl-wu .pl-work small { color: #fff; }
.share-prev img { width: 100%; border-radius: 18px; box-shadow: 0 20px 40px -20px rgba(0,0,0,.5); }
.plates-l { color: var(--accent) !important; }

/* distribuie */
.btn-share { width: 100%; min-height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 16px; color: #fff; font: 650 15.5px var(--sys);
  background: linear-gradient(100deg, #f58529, #dd2a7b 45%, #8134af 75%, #515bd4); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 12px 24px -12px rgba(221,42,123,.8); }
.btn-share svg, .w-share svg { width: 18px; height: 18px; transform: rotate(-45deg); }
.w-share { width: 42px; padding: 0 !important; display: grid !important; place-items: center; margin-right: 8px; }
.w-head-in { grid-template-columns: 1fr auto auto !important; }

/* grafice interactive */
svg.scrub { touch-action: pan-y; cursor: crosshair; }
.sc { opacity: 0; transition: opacity .25s; pointer-events: none; }
svg.scrubbing .sc { opacity: 1; }
.sc-l { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 3 3; opacity: .4; }
.sc-d { fill: #fff; stroke: var(--accent); stroke-width: 3; filter: drop-shadow(0 0 6px rgba(216,16,28,.7)); }
.sc-b rect { fill: var(--ink); }
.sc-v { fill: #fff; font: 800 15px var(--display); }
.sc-t { fill: rgba(255,255,255,.6); font: 600 9.5px var(--sys); }

/* Liquid Glass pe suprafețele care plutesc */
.toast { background: rgba(255,255,255,.72) !important; -webkit-backdrop-filter: blur(24px) saturate(1.8); backdrop-filter: blur(24px) saturate(1.8); box-shadow: inset 0 1px 0 var(--hl), 0 16px 34px -14px rgba(0,0,0,.35) !important; border: 1px solid rgba(255,255,255,.6); }
.w-head { background: rgba(243,241,240,.72) !important; -webkit-backdrop-filter: blur(24px) saturate(1.6) !important; backdrop-filter: blur(24px) saturate(1.6) !important; }
.chip { -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.rest-in { background: rgba(26,20,22,.82) !important; -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6); border: 1px solid rgba(255,255,255,.08) !important; }
.toast { color: var(--ink) !important; font-weight: 600 !important; }
/* cardul de final și cel de record: plăci negre, cifre mari */
.pr-card { background: radial-gradient(120% 90% at 50% 0%, #3a2328 0%, #1d1517 50%, #0e0a0b 100%) !important; color: #fff !important; border: 0 !important;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 40px 80px -30px rgba(0,0,0,.8) !important; border-radius: 32px !important; overflow: hidden; }
.pr-card .buddy.pr-av { background: radial-gradient(60% 60% at 50% 55%, #f3f1f0 55%, transparent 72%); }
.pr-card .pr-t { color: #fff !important; font: 800 40px/.95 var(--display) !important; letter-spacing: .005em; }
.pr-card p { color: rgba(255,255,255,.7) !important; }
.pr-badge { background: var(--accent) !important; color: #fff !important; text-transform: none !important; letter-spacing: 0 !important; box-shadow: 0 0 0 6px rgba(216,16,28,.15), 0 10px 20px -8px rgba(216,16,28,.8); }
.pr-badge.done-b { background: #16a34a !important; box-shadow: 0 0 0 6px rgba(34,197,94,.15), 0 10px 20px -8px rgba(34,197,94,.7); }
.done-stats > div { background: rgba(255,255,255,.06) !important; border: 1px solid rgba(255,255,255,.08) !important; }
.done-stats b { font: 800 40px/.9 var(--display) !important; color: #fff !important; }
.done-stats small { color: rgba(255,255,255,.55) !important; }
.pr-v { font: 800 64px/.9 var(--display) !important; color: #ff4a55 !important; text-shadow: 0 0 30px rgba(255,60,70,.5); }

/* ================= Mod întunecat, după setarea telefonului ================= */
:root { --soft: #f6f3f2; --hl: #fff; color-scheme: light dark; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e0b0c; --surface: #1a1517; --surface-2: #231c1f; --surface-3: #2f272a; --soft: #262023; --hl: rgba(255,255,255,.07);
    --fg: #f5efef; --ink: #f7f2f2; --muted: #a99ea2; --faint: #6f6569; --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.15);
    --lift: inset 0 1px 0 rgba(255,255,255,.06), 0 1px 2px rgba(0,0,0,.4), 0 18px 36px -20px rgba(0,0,0,.8); }
  html, body { background: var(--bg) !important; }
  .top { background: var(--bg) !important; }
  .brand .b2 { color: var(--muted) !important; }
  /* scena rămâne un afiș luminos, ca un panou sub reflector */
  .stage { --ink: #1a1416; --muted: #6e6367; background: #f3f1f0; border-radius: 0 0 38px 38px; box-shadow: 0 30px 60px -30px rgba(216,16,28,.45); }
  .stage .st-l2 i { color: #1a1416; }
  .st-card, .tile, .checklist, .checklist.tl, .week, .ex-list, .pstats, .ach-i.ok, .wex, .q-back, .chart-card, .hist, .supp, .add-form, .day-block, .ex-item, .stat {
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 1px 2px rgba(0,0,0,.4), 0 24px 40px -26px rgba(0,0,0,.9) !important; }
  .ach-i.ok::before { mix-blend-mode: soft-light; opacity: .35; }
  .ach-i:not(.ok) { box-shadow: inset 0 0 0 1.5px var(--line) !important; }
  .checklist.tl .check.next { background: linear-gradient(120deg, rgba(216,16,28,.22), rgba(216,16,28,.06)) !important; box-shadow: inset 0 0 0 1.5px rgba(255,80,90,.35), 0 12px 22px -14px rgba(216,16,28,.6) !important; }
  .checklist.tl .check::before { background: var(--surface); }
  .checklist.tl .check.taken::before { background: #f7f2f2; box-shadow: 0 0 0 2px #f7f2f2; }
  .check.taken .tick { background: #f7f2f2 !important; border-color: #f7f2f2 !important; }
  .check.taken .tick svg { color: #1a1416; }
  .set.done .ok { background: #f7f2f2 !important; color: #1a1416 !important; }
  .t-act, .day-title .btn-ghost + *, .row-input .btn-ghost, .ex-pick .chip[aria-pressed="true"] { background: #f7f2f2 !important; color: #1a1416 !important; }
  .day-title .btn-ghost { color: #fff !important; }
  .hyd { background: radial-gradient(120% 140% at 0% 100%, #0f2f4d 0%, #10202e 50%, #141a20 100%) !important; box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 24px 40px -26px rgba(0,0,0,.9) !important; }
  .hyd-n b { color: #e6f3ff; } .hyd-l, .hyd-n span, .hyd-s { color: #8fb6d8; }
  .b-back { fill: rgba(255,255,255,.08); } .b-glass { stroke: rgba(160,210,255,.45); } .b-cap { fill: #5cb8ff; }
  .wbtn { background: rgba(255,255,255,.08) !important; color: #e6f3ff !important; box-shadow: none !important; }
  .wbtn.plus { background: linear-gradient(180deg, #45a6f2, var(--water) 55%, #156fc0) !important; }
  .week, .wd span { color: var(--fg); }
  .wd:not(.done) .wbar { background: rgba(255,255,255,.08); }
  .q-back { background: #241c1f !important; }
  .nav { background: rgba(30,24,26,.72) !important; border-color: rgba(255,255,255,.08) !important; box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 18px 34px -14px rgba(0,0,0,.8) !important; }
  .nav-pill { background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.06)) !important; box-shadow: inset 0 1px 0 rgba(255,255,255,.12) !important; }
  .nav button { color: #8a7f83 !important; } .nav button[aria-current="page"] { color: #ff4a55 !important; }
  .toast { background: rgba(40,32,35,.78) !important; color: #fff !important; border-color: rgba(255,255,255,.08); }
  .w-head { background: rgba(14,11,12,.72) !important; }
  .pl-card { background: rgba(30,24,26,.88); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 -20px 50px -20px rgba(0,0,0,.8); }
  .pl-kg button, .pl-wu > div { background: rgba(255,255,255,.07); color: var(--ink); box-shadow: none; }
  .pl-x { background: rgba(255,255,255,.08); }
  .chip { background: var(--surface-2); border-color: var(--line); color: var(--fg); }
  .chip[aria-pressed="true"] { background: rgba(216,16,28,.22); color: #ff6b74; border-color: rgba(255,80,90,.4); }
  .ex-pick .chip { background: var(--surface) !important; box-shadow: none; }
  .delta-up { background: rgba(34,197,94,.14); color: #4be08a; } .delta-down { background: rgba(216,16,28,.18); color: #ff6b74; }
  .chart .dot-ring, .sc-d { fill: var(--bg); }
  .sc-b rect { fill: #f7f2f2; } .sc-v { fill: #1a1416; } .sc-t { fill: #6e6367; }
  .switch { background: #3a3134 !important; }
  .s-ic { box-shadow: 0 8px 14px -8px rgba(0,0,0,.8); }
  .field, .row-input input, .set input, .supp-ctl input[type="time"] { background: var(--soft) !important; color: var(--ink) !important; }
  .ex-list .ex-row .rig, .st-card .rigs-row .rig { background: linear-gradient(180deg, #f4f1f0, #e9e4e2) !important; }
  .badge.hd { background: var(--soft) !important; }
  .hvol { background: rgba(255,255,255,.07); }
  .liquid i { background: linear-gradient(180deg, rgba(31,138,224,.25), rgba(31,138,224,.4)); }

  const poly = (pts, c) => `<polyline class="${c}" points="${pts.map(p => f(p[0]) + ',' + f(p[1])).join(' ')}"/>`;

  function lerp(A, B, k) {
    const o = {};
    for (const key in A) {
      const a = A[key], b = B[key];
      o[key] = Array.isArray(a) ? [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k] : a + (b - a) * k;
    }
    return o;
  }

  function side(P, eq) {
    const td = [Math.sin(P.t * R), -Math.cos(P.t * R)];
    const tv = [td[0] * L.T, td[1] * L.T];
    let hip, sh, el, hand, knee, foot;
    if (P.foot) {
      foot = P.foot; knee = sub(foot, d(P.sh, L.SH)); hip = sub(knee, d(P.th, L.TH));
      sh = add(hip, tv); el = add(sh, d(P.ua, L.UA)); hand = add(el, d(P.fa, L.FA));
    } else if (P.hand) {
      hand = P.hand; el = sub(hand, d(P.fa, L.FA)); sh = sub(el, d(P.ua, L.UA)); hip = sub(sh, tv);
      knee = add(hip, d(P.th, L.TH)); foot = add(knee, d(P.sh, L.SH));
    } else {
      hip = P.hip; sh = add(hip, tv); el = add(sh, d(P.ua, L.UA)); hand = add(el, d(P.fa, L.FA));
      knee = add(hip, d(P.th, L.TH)); foot = add(knee, d(P.sh, L.SH));
    }
    const head = add(sh, [td[0] * 15, td[1] * 15]);
    const toe = add(foot, d(P.fd == null ? 90 : P.fd, 10));
    const pts = { hand, foot, sh };
    let back = '', front = '';
    for (const e of eq) {
      if (e.k === 'bench') {
        back += ln(e.a, e.b, 'prop w8');
        back += ln([e.a[0] + 8, e.a[1]], [e.a[0] + 8, 180], 'prop w4') + ln([e.b[0] - 8, e.b[1]], [e.b[0] - 8, 180], 'prop w4');
      } else if (e.k === 'pad') {
        back += ln(e.a, e.b, 'prop w8');
      } else if (e.k === 'bars') {
        back += ln([76, e.y], [132, e.y], 'prop w5') + ln([128, e.y], [128, 180], 'prop w4');
      } else if (e.k === 'plate') {
        const p = pts[e.at];
        front += `<circle class="eq-fill" cx="${f(p[0])}" cy="${f(p[1])}" r="12"/><circle class="hub" cx="${f(p[0])}" cy="${f(p[1])}" r="3"/>`;
      } else if (e.k === 'db') {
        const p = pts[e.at];
        front += `<rect class="eq-fill" x="${f(p[0] - 9)}" y="${f(p[1] - 4)}" width="18" height="8" rx="2"/>`;
      } else if (e.k === 'handle') {
        const p = pts[e.at];
        front += `<circle class="eq-fill" cx="${f(p[0])}" cy="${f(p[1])}" r="4.5"/>`;
      } else if (e.k === 'cable') {
        const p = pts[e.at];
        const to = e.to === 'up' ? [p[0], 12] : e.to === 'right' ? [190, p[1]] : e.to;
        back += ln(p, to, 'cable') + `<circle class="pulley" cx="${f(to[0])}" cy="${f(to[1])}" r="5"/>`;
      } else if (e.k === 'platform') {
        const p = pts[e.at], a = e.ang * R, n = [Math.cos(a), -Math.sin(a)];
        front += ln([p[0] + n[0] * 18 + Math.sin(a) * 4, p[1] + n[1] * 18 + Math.cos(a) * 4], [p[0] - n[0] * 18 + Math.sin(a) * 4, p[1] - n[1] * 18 + Math.cos(a) * 4], 'eq w6');
      }
    }
    return back +
      poly([hip, knee, foot, toe], 'limb w9') +
      ln(hip, sh, 'limb w14') +
      `<circle class="head" cx="${f(head[0])}" cy="${f(head[1])}" r="9.5"/>` +
      poly([sh, el, hand], 'limb w8') + front;
  }

  function frontView(P, eq) {
    const S = { r: [117, 68], l: [83, 68] };
    let out = '';
    const arm = (s, sign) => {
      const ul = P.ul == null ? 1 : P.ul, e = [s[0] + sign * Math.sin(P.ua * R) * 27 * ul, s[1] + Math.cos(P.ua * R) * 27];
      const h = [e[0] + sign * Math.sin(P.fa * R) * 25, e[1] + Math.cos(P.fa * R) * 25];
      return { e, h };
    };
    const ar = arm(S.r, 1), al = arm(S.l, -1);
    for (const x of eq) {
      if (x.k === 'cableF') {
        const tr = [200 - x.to[0], x.to[1]];
        out += ln(ar.h, tr, 'cable') + ln(al.h, x.to, 'cable') +
          `<circle class="pulley" cx="${tr[0]}" cy="${tr[1]}" r="5"/><circle class="pulley" cx="${x.to[0]}" cy="${x.to[1]}" r="5"/>`;
      }
    }
    out += poly([[93, 112], [91, 146], [90, 178]], 'limb w9') + poly([[107, 112], [109, 146], [110, 178]], 'limb w9');
    out += `<path class="torso" d="M84 66 L116 66 L110 112 L90 112 Z"/>`;
    out += `<circle class="head" cx="100" cy="50" r="10"/>`;
    out += poly([S.r, ar.e, ar.h], 'limb w8') + poly([S.l, al.e, al.h], 'limb w8');
    for (const x of eq) {
      if (x.k === 'dbF') {
        for (const h of [ar.h, al.h]) out += `<rect class="eq-fill" x="${f(h[0] - 4)}" y="${f(h[1] - 9)}" width="8" height="18" rx="2"/>`;
      } else if (x.k === 'padsF') {
        for (const h of [ar.h, al.h]) out += `<rect class="eq-fill" x="${f(h[0] - 5)}" y="${f(h[1] - 4)}" width="10" height="26" rx="4"/>`;
      } else if (x.k === 'cableF') {
        for (const h of [ar.h, al.h]) out += `<circle class="eq-fill" cx="${f(h[0])}" cy="${f(h[1])}" r="4.5"/>`;
      }
    }
    return out;
  }

  function frame(rig, k) {
    const P = lerp(rig.A, rig.B, k);
    return `<line class="ground" x1="14" y1="181" x2="186" y2="181"/>` + (rig.front ? frontView(P, rig.eq) : side(P, rig.eq));
  }

  /* 0 → A, 1 → B, cu pauze la capete */
  function phase(t) {
    const c = (t % 3200) / 3200;
    const e = x => 0.5 - 0.5 * Math.cos(Math.PI * x);
    if (c < 0.14) return 0;
    if (c < 0.5) return e((c - 0.14) / 0.36);
    if (c < 0.64) return 1;
    return 1 - e((c - 0.64) / 0.36);
  }

  function svg(id, cls) {
    return `<svg class="rig ${cls || ''}" data-rig="${id}" viewBox="0 0 200 200" role="img" aria-label="Animație ${EX[id].name}"><g>${frame(EX[id].rig, 0.5)}</g></svg>`;
  }

  const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function loop(ts) {
    document.querySelectorAll('svg[data-rig]').forEach(el => {
      const r = el.getBoundingClientRect();
      if (r.bottom < 0 || r.top > innerHeight) return;
      el.firstChild.innerHTML = frame(EX[el.dataset.rig].rig, phase(ts + (el.dataset.off | 0)));
    });
    requestAnimationFrame(loop);
  }
  if (!still) requestAnimationFrame(loop);
  return { svg, frame };
})();

/* ---------- Efecte: confetti, val la atingere, numere care urcă ---------- */
const FX = (() => {
  const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let cv, ctx, parts = [], raf = 0;
  const COLORS = ['#e4202e', '#ffffff', '#ff4b57', '#9e0f1a', '#ffd9dc'];
  function canvas() {
    if (cv) return;
    cv = document.createElement('canvas'); cv.className = 'fx-canvas'; document.body.appendChild(cv);
    ctx = cv.getContext('2d');
    const fit = () => { const d = devicePixelRatio || 1; cv.width = innerWidth * d; cv.height = innerHeight * d; ctx.setTransform(d, 0, 0, d, 0, 0); };
    fit(); addEventListener('resize', fit);
  }
  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.life > 0);
    for (const p of parts) {
      p.vy += p.g; p.vx *= 0.985; p.vy *= 0.985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= 1;
      ctx.save(); ctx.globalAlpha = Math.min(1, p.life / 30); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.s / 2, 0, 7); ctx.fill(); } else ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      ctx.restore();
    }
    raf = parts.length ? requestAnimationFrame(tick) : 0;
  }
  function spawn(x, y, n, spread, power, g) {
    if (still) return; canvas();
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * spread, v = power * (0.5 + Math.random() * 0.7);
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, s: 5 + Math.random() * 6, c: COLORS[i % COLORS.length], life: 60 + Math.random() * 40, round: Math.random() < 0.3 });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function burst(el, n = 18) { if (!el) return; const r = el.getBoundingClientRect(); spawn(r.left + r.width / 2, r.top + r.height / 2, n, Math.PI * 2, 6, 0.18); }
  function celebrate() {
    spawn(innerWidth * 0.2, innerHeight * 0.9, 70, 1.1, 17, 0.32);
    setTimeout(() => spawn(innerWidth * 0.8, innerHeight * 0.9, 70, 1.1, 17, 0.32), 180);
    setTimeout(() => spawn(innerWidth * 0.5, innerHeight * 0.85, 60, 1.4, 19, 0.32), 380);
  }
  function countUp(root) {
    if (still) return;
    root.querySelectorAll('[data-count]').forEach(el => {
      const txt = el.textContent, m = txt.match(/[\d.]+(,\d+)?/); if (!m) return;
      const target = parseFloat(m[0].replace(/\./g, '').replace(',', '.')), dec = m[1] ? m[1].length - 1 : 0, t0 = performance.now();
      const step = t => {
        const k = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - k, 3);
        el.textContent = txt.replace(m[0], (target * e).toLocaleString('ro-RO', { minimumFractionDigits: dec, maximumFractionDigits: dec }));
        if (k < 1) requestAnimationFrame(step); else el.textContent = txt;
      };
      requestAnimationFrame(step);
    });
  }
  /* val la atingere */
  document.addEventListener('pointerdown', e => {
    if (still) return;
    const b = e.target.closest('.btn, .chip, .check, .set .ok, .ex-row, .nav button, .switch');
    if (!b) return;
    const r = b.getBoundingClientRect(), s = Math.max(r.width, r.height) * 2.2, w = document.createElement('span');
    w.className = 'ripple'; w.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - r.left - s / 2}px;top:${e.clientY - r.top - s / 2}px`;
    b.appendChild(w); setTimeout(() => w.remove(), 650);
  }, { passive: true });
  function pop(el) { if (!el || still) return; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
  return { burst, celebrate, countUp, pop };
})();

/* ---------- Mini-Cristian: clipurile video, care rulează mereu în buclă ---------- */
const Buddy = (() => {
  const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cache = {};
  /* un singur element video per clip, refolosit la fiecare redesenare, ca să nu se oprească niciodată */
  function el(name, label) {
    if (cache[name]) return cache[name];
    const v = document.createElement('video');
    const A = window.ASSET || ''; v.className = 'b-vid'; v.src = A + name + '.mp4'; v.poster = A + name + '.jpg';
    v.muted = true; v.defaultMuted = true; v.loop = true; v.autoplay = true; v.playsInline = true; v.preload = 'auto';
    v.setAttribute('muted', ''); v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', ''); v.setAttribute('aria-label', label);
    v.disablePictureInPicture = true; v.controls = false;
    const kick = () => { if (!still && v.isConnected && v.paused) { const p = v.play(); if (p && p.catch) p.catch(() => { }); } };
    v.addEventListener('pause', () => setTimeout(kick, 50));
    v.addEventListener('ended', () => { v.currentTime = 0; kick(); });
    v.addEventListener('stalled', () => setTimeout(kick, 500));
    v.addEventListener('canplay', kick);
    const mark = on => { if (v.parentNode) v.parentNode.classList.toggle('playing', on); };
    v.addEventListener('playing', () => mark(true));
    v.addEventListener('pause', () => mark(false));
    cache[name] = v; return v;
  }
  const slot = (name, label, cls = '') => `<div class="buddy ${cls}" data-vid="${name}" data-label="${label}"><img class="b-poster" src="${window.ASSET || ''}${name}.jpg" alt=""></div>`;
  const svg = slot('mini-cristian', 'Mini-Cristian dansează, face flotări și o tumbă');
  const flex = slot('mini-cristian-flex', 'Mini-Cristian își arată bicepșii și ridică degetul mare', 'flex');
  function playAll() {
    if (still) return;
    for (const k in cache) { const v = cache[k]; if (v.isConnected && v.paused) { const p = v.play(); if (p && p.catch) p.catch(() => { }); } }
  }
  function start() {
    document.querySelectorAll('.buddy[data-vid]').forEach(s => { const v = el(s.dataset.vid, s.dataset.label); if (v.parentNode !== s) s.appendChild(v); s.classList.toggle('playing', !v.paused); });
    playAll();
  }
  /* orice atingere repornește clipul (necesar când iPhone-ul e în modul Economisire baterie) */
  ['touchstart', 'pointerdown', 'scroll'].forEach(e => document.addEventListener(e, playAll, { passive: true, capture: true }));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') playAll(); });
  addEventListener('pageshow', playAll); addEventListener('focus', playAll);
  setInterval(playAll, 2000);
  const cele = slot('mini-cristian-cele', 'Mini-Cristian se întoarce și își arată numele și numărul 27 de pe tricou', 'cele');
  return { svg, flex, cele, start };
})();

/* ---------- Ecran: Progres ---------- */
function chart(points, unit) {
  if (points.length < 2) return `<p class="empty">${points.length ? 'Încă un antrenament și apare graficul.' : 'Graficul apare după primele două înregistrări.'}</p>`;
  const W = 340, H = 170, L = 38, Rr = 40, T = 12, B = 24;
  const xs = points.map(p => p.t), ys = points.map(p => p.v);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  const span = Math.max(hi - lo, hi * 0.04, 1); lo = Math.floor((lo - span * 0.2)); hi = Math.ceil(hi + span * 0.2);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const X = t => L + (W - L - Rr) * (x1 === x0 ? 1 : (t - x0) / (x1 - x0));
  const Y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const ticks = [lo, (lo + hi) / 2, hi];
  const d = points.map((p, i) => `${i ? 'L' : 'M'}${X(p.t).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' ');
  const last = points[points.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafic progres">
    ${ticks.map(v => `<line class="grid" x1="${L}" x2="${W - Rr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${fmt(v, 0)}</text>`).join('')}
    <path class="areaA" d="${d} L${X(last.t)} ${H - B} L${X(x0)} ${H - B} Z"/>
    <path class="lineA" pathLength="1" d="${d}"/>
    ${points.slice(0, -1).map(p => `<circle class="dot" cx="${X(p.t)}" cy="${Y(p.v)}" r="2.5"/>`).join('')}
    <circle class="dot-ring" cx="${X(last.t)}" cy="${Y(last.v)}" r="5"/>
    <text class="endlbl" x="${X(last.t) + 9}" y="${Y(last.v) + 4}">${fmt(last.v)}</text>
    <text class="ax" x="${L}" y="${H - 6}">${fmtDate(x0)}</text><text class="ax" x="${W - Rr}" y="${H - 6}" text-anchor="end">${fmtDate(x1)}</text>
  </svg>`;
}
function deltaTxt(points, unit) {
  if (points.length < 2) return '';
  const dlt = points[points.length - 1].v - points[0].v;
  return `<span class="${dlt >= 0 ? 'delta-up' : 'delta-down'}">${dlt >= 0 ? '+' : '−'}${fmt(Math.abs(dlt))} ${unit} de la început</span>`;
}

/* ---------- Statistici, recorduri, serie ---------- */
function weekStart(t = Date.now()) { const d = new Date(dayKey(new Date(t))); return d.getTime() - ((d.getDay() + 6) % 7) * DAYMS; }
function weekCount(ws) { return S.sessions.filter(s => s.date >= ws && s.date < ws + 7 * DAYMS).length; }
function plannedSoFar(ws) { let n = 0; for (let i = 0; i < 7; i++) { const d = new Date(ws + i * DAYMS); if (d.getTime() > Date.now()) break; if (planFor(d)) n++; } return n; }
function streakWeeks() {
  let ws = weekStart(), n = 0;
  if (weekCount(ws) >= Math.max(1, plannedSoFar(ws))) n++;
  ws -= 7 * DAYMS;
  while (weekCount(ws) >= DAYS.length) { n++; ws -= 7 * DAYMS; }
  return n;
}
function allPRs() {
  const best = {}, prs = [];
  for (const s of sessionsSorted()) for (const id in s.ex) {
    const top = s.ex[id].reduce((b, x) => (!b || e1rm(x.kg, x.reps) > e1rm(b.kg, b.reps)) ? x : b, null);
    const v = e1rm(top.kg, top.reps);
    if (best[id] != null && v > best[id] + 0.01) prs.push({ id, date: s.date, kg: top.kg, reps: top.reps, gain: v - best[id] });
    best[id] = Math.max(best[id] || 0, v);
  }
  return { prs, best };
}
function totals() {
  const vol = S.sessions.reduce((a, s) => a + volume(s), 0), mins = S.sessions.reduce((a, s) => a + (s.dur || 0), 0) / 60000;
  return { n: S.sessions.length, vol, hours: mins / 60, prs: allPRs().prs.length, sets: S.sessions.reduce((a, s) => a + Object.values(s.ex).reduce((b, x) => b + x.length, 0), 0) };
}

const RECOVER_H = { piept: 60, spate: 60, cvadriceps: 72, femurali: 72, fesieri: 60, umeri: 48, biceps: 40, triceps: 40, antebrat: 36 };
function recovery() {
  const now = Date.now(), out = {};
  for (const m in GROUP_LABEL) out[m] = { pct: 100, last: null, sets: 0 };
  for (const s of S.sessions) {
    const h = (now - s.date) / 3600000; if (h > 24 * 6) continue;
    for (const id in s.ex) (MUSCLE[id] || []).forEach((m, i) => {
      if (!out[m]) return;
      const load = s.ex[id].length * (i === 0 ? 1 : .5);
      const need = (RECOVER_H[m] || 48) * Math.min(1.35, Math.max(.55, load / 6));
      const pct = Math.min(100, Math.round(h / need * 100));
      if (pct < out[m].pct) out[m].pct = pct;
      if (!out[m].last || s.date > out[m].last) out[m].last = s.date;
      out[m].sets += load;
    });
  }
  return out;
}

async function nearbyParks() {
  const pos = await new Promise((ok, no) => { if (!navigator.geolocation) return no(); navigator.geolocation.getCurrentPosition(p => ok(p.coords), no, { timeout: 8000, maximumAge: 600000 }); });
  const q = `[out:json][timeout:15];(way["leisure"="park"]["name"](around:3000,${pos.latitude},${pos.longitude});relation["leisure"="park"]["name"](around:3000,${pos.latitude},${pos.longitude}););out center 30;`;
  const r = await fetch('https://overpass-api.de/api/interpreter', { method: 'POST', body: 'data=' + encodeURIComponent(q) });
  const j = await r.json(), R = 6371, rad = x => x * Math.PI / 180;
  const d = (a, b) => { const dl = rad(b.lat - a.lat), dn = rad(b.lon - a.lon), h = Math.sin(dl / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dn / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };
  const me = { lat: pos.latitude, lon: pos.longitude }, seen = new Set();
  return j.elements.map(e => ({ name: e.tags.name, lat: (e.center || e).lat, lon: (e.center || e).lon })).filter(p => p.lat && !seen.has(p.name) && seen.add(p.name))

}

/* ================= Scorul de formă (0-100) ================= */
function formScore(at = Date.now()) {
  const D = DAYMS, from28 = at - 28 * D;
  let plan = 0; for (let t = from28 + D; t <= at; t += D) if (planFor(new Date(t))) plan++;
  const done = S.sessions.filter(s => s.date > from28 && s.date <= at).length;
  const cons = plan ? Math.min(1, done / plan) : 1;
  const ids = Object.keys(EX); let sum = 0, n = 0;
  for (const id of ids) {
    let recent = 0, before = 0;
    for (const s of S.sessions) for (const x of (s.ex[id] || [])) { const v = e1rm(x.kg, x.reps); if (s.date > at - 14 * D && s.date <= at) recent = Math.max(recent, v); else if (s.date > at - 42 * D && s.date <= at - 14 * D) before = Math.max(before, v); }
    if (recent && before) { sum += recent / before - 1; n++; }
  }
  const g = n ? sum / n : 0, prog = Math.max(0, Math.min(1, .6 + g * 8));
  const wGoal = waterTimes().length || 8; let w = 0, sp = 0; const act = S.supps.filter(s => s.on).map(s => s.id);
  for (let k = 0; k < 7; k++) { const key = dayKey(new Date(at - k * D)); w += Math.min(1, ((S.water && S.water.log[key]) || 0) / wGoal); const tk = (S.suppLog[key] || []).filter(id => act.includes(id)).length; sp += act.length ? tk / act.length : 1; }
  w /= 7; sp /= 7;
  const parts = [['Constanță', cons, 35, LI.target], ['Progres la greutăți', prog, 25, LI.zap], ['Apă', w, 20, LI.drop], ['Suplimente', sp, 20, LI.pill]];
  return { score: Math.round(parts.reduce((a, p) => a + p[1] * p[2], 0)), parts, gain: g };
}

      <div class="ob-goals">${GOALS.map(([g, d]) => `<button class="ob-goal ${g === goal ? 'on' : ''}" data-goal="${g}"><b>${g}</b><small>${d}</small></button>`).join('')}</div>
      <h3>Câte zile pe săptămână?</h3>
      <div class="ob-days">${[2, 3, 4, 5].map(n => `<button class="ob-day ${n === days ? 'on' : ''}" data-days="${n}"><b class="num">${n}</b><small>zile</small></button>`).join('')}</div>
      <button class="btn btn-main" data-ob="5">Generează programul</button></div>`;
    return `<div class="ob-in ob-final"><div class="ob-check">${ICON.check}</div><h2>Programul tău e gata</h2>
      <p>${goal} · ${days} zile pe săptămână. Am pregătit și 8 săptămâni de istoric demo, ca să vezi cum arată progresul.</p>
      <button class="btn btn-main" data-ob="done">Intră în aplicație</button></div>`;
  }
  function draw() { ob.innerHTML = view(); ob.firstElementChild.classList.add('in'); Buddy.start(); if (step === 2) generate(); }
  function generate() {
    const msgs = ['Analizăm trăsăturile feței', 'Construim modelul 3D', 'Îi alegem echipamentul', 'Îl învățăm să facă flotări', 'Ultimele retușuri'];
    const C = 2 * Math.PI * 90, fg = $('#g-fg'); fg.style.strokeDasharray = C; let t0 = performance.now();
    const tick = t => {
      const k = Math.min(1, (t - t0) / 4600); fg.style.strokeDashoffset = C * (1 - k);
      const p = $('#g-pct'), m = $('#g-txt'); if (!p) return;
      p.textContent = Math.round(k * 100) + '%'; m.textContent = msgs[Math.min(msgs.length - 1, Math.floor(k * msgs.length))];
      if (k < 1) requestAnimationFrame(tick); else setTimeout(() => { step = 3; draw(); FX.celebrate(); }, 350);
    };
    requestAnimationFrame(tick);
  }
  ob.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.goal) { goal = b.dataset.goal; draw(); return; }
    if (b.dataset.days) { days = +b.dataset.days; draw(); return; }
    const n = b.dataset.ob; if (!n) return;
    if (n === 'done') { try { localStorage.setItem('forta-onb', '1'); } catch (er) { } ob.classList.add('out'); setTimeout(() => { ob.remove(); lastTab = null; tab = 'azi'; render(); }, 450); return; }
    if (n === '5') seed();
    step = +n; draw();
  });
  ob.addEventListener('change', e => {
    if (e.target.id !== 'ob-file' || !e.target.files[0]) return;
    const r = new FileReader(); r.onload = () => { photo = r.result; draw(); }; r.readAsDataURL(e.target.files[0]);
  });
  window.startOnboarding = () => { step = 0; photo = ''; document.body.appendChild(ob); ob.classList.remove('out'); draw(); };
  if (!done()) { if (!S.sessions.length) seed(); window.startOnboarding(); }
  else if (!S.sessions.length) seed();
  document.addEventListener('click', e => { if (e.target.closest('[data-onb-reset]')) { try { localStorage.removeItem('forta-onb'); } catch (er) { } window.startOnboarding(); } });
})();

render();
(function () {
  const sp = document.getElementById('splash'); if (!sp) return;
  const v = sp.querySelector('video'); v.muted = true;
  const p = v.play(); if (p && p.catch) p.catch(() => { });
  v.addEventListener('playing', () => sp.classList.add('vid'));
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const hide = () => { if (sp.classList.contains('out')) return; sp.classList.add('out'); setTimeout(() => { sp.remove(); }, 650); };
  setTimeout(hide, still ? 700 : 2600);
  sp.addEventListener('pointerdown', hide);
})();
</script>
