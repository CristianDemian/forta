/* Forța v2. Layout: o coloană de telefon cu antet subțire, o bandă video pe toată lățimea,
   carduri compacte și meniu plutitor; antrenamentul se deschide peste tot ecranul. */
:root {
  --bg: #0b0a0b;
  --surface: #151214;
  --surface-2: #1e191c;
  --surface-3: #282125;
  --line: rgba(255, 255, 255, .07);
  --line-2: rgba(255, 255, 255, .12);
  --fg: #f6f2f1;
  --muted: #9d9396;
  --faint: #6c6366;
  --accent: #e5232f;
  --red-hi: #ff5560;
  --red-deep: #a10f1b;
  --accent-ink: #ffffff;
  --blue: #ffffff;
  --good: #34c77b;
  --bad: #ff5a5f;
  --water: #3aa0ff;
  --sys: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, system-ui, sans-serif;
  --display: 'Saira Condensed', 'SF Pro Display', -apple-system, 'Arial Narrow', sans-serif;
  --body: var(--sys);
  --r: 16px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); min-height: 100%; overflow-x: clip; overscroll-behavior-x: none; -webkit-text-size-adjust: 100%; }
body { min-height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 400 15px/1.45 var(--sys); letter-spacing: -.01em;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; overflow-x: clip; touch-action: pan-y;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input, textarea { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
svg { flex: none; }

.app { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; min-height: 100%; padding-bottom: calc(104px + env(safe-area-inset-bottom, 0px)); }
.ambient { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.ambient i { position: absolute; border-radius: 50%; filter: blur(70px); }
.ambient i:nth-child(1) { width: 80vmax; height: 80vmax; top: -55vmax; right: -40vmax; background: var(--accent); opacity: .10; }
.ambient i:nth-child(2), .ambient i:nth-child(3) { display: none; }

/* ---------- Antet ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 11px;
  display: grid; grid-template-columns: minmax(0, 1fr); }
.top::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: repeating-linear-gradient(90deg, var(--accent) 0 18px, rgba(255,255,255,.85) 18px 36px); opacity: .9; }
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; white-space: nowrap; font: 700 19px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; }
.brand .b1 { color: var(--accent); }
.brand .b2 { margin-left: auto; color: var(--fg); }
.hbadge { height: 1.45em; width: auto; }
.today { display: none; }

main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 20px; display: grid; gap: 24px; }

/* ---------- Titluri de secțiune ---------- */
h2 { margin: 0; font: 600 13px/1.2 var(--sys); letter-spacing: .02em; color: var(--muted); text-transform: none; }
.sec { display: grid; gap: 10px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sec-head .count { font: 600 13px var(--sys); color: var(--fg); }
.eyebrow { font: 600 12px/1 var(--sys); letter-spacing: .06em; text-transform: uppercase; color: var(--red-hi); }
.daymeta { color: var(--muted); font-size: 13px; }

/* ---------- Banda video ---------- */
.buddy { display: block; position: relative; }
.buddy.full { width: 100vw; margin-left: calc(50% - 50vw); height: min(300px, 40vh); margin-bottom: -40px; overflow: hidden;
  background: radial-gradient(60% 80% at 50% 45%, #2a272b 0%, #161415 55%, var(--bg) 100%); }
.buddy.full::after { content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, var(--bg) 0%, transparent 14%, transparent 70%, var(--bg) 100%), linear-gradient(90deg, var(--bg) 0%, transparent 22%, transparent 78%, var(--bg) 100%); }
.buddy .b-vid, .buddy .b-poster { position: absolute; top: 0; left: 50%; transform: translateX(-50%); height: 100%; width: auto; aspect-ratio: 9 / 16; object-fit: cover; }
.buddy[data-vid] .b-vid { opacity: 0; transition: opacity .3s; }
.buddy[data-vid].playing .b-vid { opacity: 1; }
.buddy[data-vid].playing .b-poster { opacity: 0; transition: opacity .3s .1s; }
.b-vid::-webkit-media-controls, .b-vid::-webkit-media-controls-start-playback-button, .b-vid::-webkit-media-controls-overlay-play-button { display: none !important; -webkit-appearance: none; opacity: 0; }

/* ---------- Cardul zilei ---------- */
.next, .rest-day { position: relative; z-index: 1; overflow: hidden; border-radius: 22px; padding: 18px; display: grid; gap: 14px;
  background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.015)), var(--surface); border: 1px solid var(--line);
  box-shadow: 0 20px 40px -24px rgba(0,0,0,.8); }
.next::before, .rest-day::before { content: ''; position: absolute; left: 18px; right: 18px; top: 0; height: 2px; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); }
.next > *:not(.wm), .rest-day > *:not(.wm) { position: relative; z-index: 1; }
.dayname, .rest-title { margin: 6px 0 0; font: 700 26px/1.1 var(--sys); letter-spacing: -.02em; color: var(--fg); text-wrap: balance; }
.rest-day { justify-items: start; text-align: left; }
.rest-msg { margin: -6px 0 0; color: var(--muted); font-size: 14px; }
.next-up { width: 100%; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); }
.next-up small { grid-column: 1 / -1; font: 600 11px var(--sys); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.next-up b { font: 600 16px var(--sys); }
.next-up span { color: var(--red-hi); font-size: 13px; font-weight: 600; }
.wm { position: absolute; right: -24px; bottom: -24px; width: 150px; height: 150px; background: var(--badge, none) center / contain no-repeat; opacity: .06; pointer-events: none; z-index: 0; transform: rotate(-12deg); }
.rigs-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rigs-row .rig { width: 100%; height: 76px; background: var(--surface-2); border-radius: 12px; border: 1px solid var(--line); }

/* ---------- Butoane ---------- */
.btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 14px;
  font: 600 16px/1 var(--sys); letter-spacing: -.01em; text-transform: none; transition: transform .15s, filter .15s; }
.btn:active { transform: scale(.97); }
.btn-main { width: 100%; color: #fff; background: linear-gradient(180deg, var(--red-hi), var(--accent) 60%, #c81a26); box-shadow: 0 10px 24px -12px var(--accent), inset 0 1px 0 rgba(255,255,255,.25); }
.btn-ghost { min-height: 40px; font-size: 14px; padding: 0 14px; background: rgba(255,255,255,.06); border: 1px solid var(--line); color: var(--fg); }
.skip-btn { width: 100%; min-height: 44px; } .skip-btn svg { width: 18px; height: 18px; color: var(--muted); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 32px; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid var(--line); font: 500 13px var(--sys); color: var(--fg); }
.chip[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 18%, transparent); border-color: color-mix(in srgb, var(--accent) 60%, transparent); color: #fff; }
.link { color: var(--red-hi); font-weight: 600; font-size: 14px; padding: 6px 2px; }
.link.muted, .link.danger { color: var(--muted); }
.del { color: var(--muted); font-size: 13px; padding: 6px 8px; border-radius: 8px; }
.del.armed { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
.ripple { position: absolute; border-radius: 50%; background: currentColor; opacity: .16; transform: scale(0); animation: ripple .55s ease-out forwards; pointer-events: none; }
@keyframes ripple { to { transform: scale(1); opacity: 0; } }

/* ---------- Săptămâna ---------- */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 10px 6px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.wd { display: grid; justify-items: center; gap: 5px; padding: 2px 0; border-radius: 10px; }
.wd small { color: var(--faint); font-size: 11px; font-weight: 600; text-transform: uppercase; }
.wd span { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 600 13px var(--sys); color: var(--muted); border: 1.5px solid transparent; }
.wd.plan span { border-color: color-mix(in srgb, var(--accent) 70%, transparent); color: var(--fg); }
.wd.done span { background: var(--accent); color: #fff; }
.wd.done span svg { width: 14px; height: 14px; }
.wd.is-today small { color: var(--fg); }
.wd.is-today span { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--fg); }
.wd em { font-style: normal; font-size: 10px; color: var(--faint); }
.wd.plan em, .wd.done em { color: var(--red-hi); }

/* ---------- Statistici ---------- */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 2px; min-width: 0; }
.stat b { font: 700 22px/1.1 var(--sys); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); font-size: 12px; line-height: 1.3; }

/* ---------- Citatul zilei ---------- */
.quote { perspective: 1000px; }
.q-inner { position: relative; display: grid; width: 100%; text-align: left; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.3, 1.2, .4, 1); overflow: visible !important; }
.quote.open .q-inner { transform: rotateY(180deg); }
.q-face { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: var(--r); padding: 14px 16px; }
.q-front { display: grid; grid-template-columns: 40px 1fr; grid-template-rows: auto auto; gap: 1px 12px; align-items: center; color: #fff;
  background: linear-gradient(120deg, var(--accent), var(--red-deep)); box-shadow: 0 12px 26px -16px var(--accent); }
.q-front b { font: 600 16px var(--sys); align-self: end; }
.q-front small { grid-column: 2; font-size: 13px; opacity: .85; align-self: start; }
.q-gift { grid-row: 1 / span 2; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; background: rgba(255,255,255,.18); }
.q-gift svg { width: 22px; height: 22px; }
.q-back { transform: rotateY(180deg); background: var(--surface); border: 1px solid var(--line); display: grid; gap: 8px; }
.q-mark { font: 700 34px/0.5 Georgia, serif; color: var(--accent); height: 14px; }
.q-back p { margin: 0; font: 500 16px/1.45 var(--sys); color: var(--fg); text-wrap: pretty; }
.q-who { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.q-who b { font: 600 13px var(--sys); color: var(--red-hi); }
.q-who small { color: var(--muted); font-size: 12px; }

/* ---------- Suplimente și apă ---------- */
.checklist { display: grid; gap: 1px; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); background: var(--line); }
.check { display: grid; grid-template-columns: 48px 1fr 26px; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 11px 14px; background: var(--surface); }
.check time { font: 600 14px var(--sys); color: var(--muted); font-variant-numeric: tabular-nums; }
.check strong { display: block; font-weight: 500; font-size: 15px; }
.check em { font-style: normal; color: var(--muted); font-size: 12.5px; }
.tick { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; transition: background .2s, border-color .2s; }
.tick svg { width: 14px; height: 14px; opacity: 0; color: #fff; }
.check.taken .tick { background: var(--good); border-color: var(--good); }
.check.taken .tick svg { opacity: 1; }
.check.taken strong { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(255,255,255,.3); }
.water { display: grid; gap: 10px; padding: 14px; margin-bottom: 8px; border-radius: var(--r); background: linear-gradient(135deg, color-mix(in srgb, var(--water) 14%, var(--surface)), var(--surface)); border: 1px solid color-mix(in srgb, var(--water) 22%, transparent); }
.water-top { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: center; }
.water-top .drop { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; background: linear-gradient(160deg, #8fd0ff, var(--water)); color: #fff; }
.water-top .drop svg { width: 18px; height: 18px; }
.water-top strong { display: block; font-weight: 600; font-size: 15px; }
.water-top em { font-style: normal; color: var(--muted); font-size: 12.5px; }
.water-dots { display: grid; grid-template-columns: repeat(auto-fill, minmax(14px, 1fr)); gap: 4px; }
.water-dots i { height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); }
.water-dots i.on { background: var(--water); box-shadow: 0 0 8px -2px var(--water); }
.water-btns { display: grid; grid-template-columns: 44px 1fr; gap: 8px; }
.water-btns .btn { min-height: 40px; font-size: 14px; }
.water-btns .btn-main { background: linear-gradient(180deg, #5fb4ff, var(--water) 60%, #2384e8); box-shadow: 0 10px 22px -12px var(--water); }
.water-btns .btn-ghost { font-size: 20px; padding: 0; }
.supp { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 10px; }
.supp.off { opacity: .55; }
.supp-top { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
.supp-top strong { font-weight: 600; display: block; font-size: 15px; }
.supp-top small { color: var(--muted); font-size: 12.5px; }
.supp-tip { font-size: 12.5px; color: var(--muted); }
.supp-ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.supp-ctl input[type="time"] { min-height: 36px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); padding: 0 10px; font: 600 15px var(--sys); }
.ic-row { display: inline-flex !important; align-items: center; gap: 8px; } .ic-row svg { width: 16px; height: 16px; color: var(--water); }
.switch { position: relative; width: 46px; height: 28px; border-radius: 999px; background: var(--surface-3); flex: none; transition: background .2s; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.4); transition: transform .25s cubic-bezier(.3, 1.3, .4, 1); }
.switch[aria-checked="true"] { background: var(--good); }
.switch[aria-checked="true"]::after { transform: translateX(18px); }
.add-form { display: grid; gap: 8px; background: var(--surface); border: 1px solid var(--line); padding: 14px; border-radius: var(--r); }
.add-form .two { display: grid; grid-template-columns: 1fr 120px; gap: 8px; }
.notice { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; }
.notice p { margin: 0; color: var(--muted); font-size: 13.5px; }
.notice strong { font-weight: 600; }
.state-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); margin-right: 6px; vertical-align: 1px; }
.state-dot.on { background: var(--good); box-shadow: 0 0 8px var(--good); }
.field { width: 100%; min-height: 44px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); padding: 0 12px; font-size: 15px; }
.field:focus { border-color: color-mix(in srgb, var(--accent) 60%, transparent); outline: none; }
textarea.field { padding: 10px 12px; min-height: 90px; resize: vertical; font-size: 12px; }
.row-input { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.empty { color: var(--muted); font-size: 13.5px; padding: 18px 12px; text-align: center; border: 1px dashed var(--line-2); border-radius: var(--r); margin: 0; }
.badge-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.badge-prev { width: 48px; height: 48px; object-fit: contain; border-radius: 12px; background: var(--surface-2); padding: 6px; }

/* ---------- Program ---------- */
.day-block { display: grid; gap: 8px; }
.day-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.day-title h3 { margin: 0; font: 700 19px/1.15 var(--sys); letter-spacing: -.02em; }
.day-title h3 span { display: block; font: 600 12px var(--sys); letter-spacing: .06em; text-transform: uppercase; color: var(--red-hi); margin-bottom: 2px; }
.ex-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.ex-row { display: grid; grid-template-columns: 48px 1fr 18px; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 8px 12px 8px 8px; }
.ex-row .rig { width: 48px; height: 48px; background: var(--surface-2); border-radius: 10px; }
.ex-row strong { display: block; font-weight: 500; font-size: 15px; line-height: 1.25; }
.ex-row small { color: var(--muted); font-size: 12.5px; }
.chev { width: 18px; height: 18px; color: var(--faint); transition: transform .2s; }
.ex-item.open .chev { transform: rotate(180deg); }
.ex-detail { padding: 2px 14px 14px; display: grid; gap: 10px; animation: rise .3s ease-out; }
.ex-detail .rig.big { width: 100%; max-width: 220px; aspect-ratio: 1; justify-self: center; background: var(--surface-2); border-radius: 16px; }
.target { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.06); font-size: 12px; color: var(--fg); }
.pill.up { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); font-weight: 600; }
.cues { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; counter-reset: c; font-size: 14px; }
.cues li { display: block; position: relative; padding-left: 26px; counter-increment: c; }
.cues li::before { content: counter(c); position: absolute; left: 0; top: 1px; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font: 600 11px var(--sys); background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--red-hi); }
.mistake { background: color-mix(in srgb, var(--bad) 10%, transparent); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; }
.mistake b { color: var(--bad); font-weight: 600; }
.rest-info { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }

/* ---------- Grafice ---------- */
.chart-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; }
.chart-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.chart-head b { font: 700 24px/1 var(--sys); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.chart-head small { color: var(--muted); font-size: 12.5px; }
.delta-up { color: var(--good); font-weight: 600; font-size: 12.5px; }
.delta-down { color: var(--bad); font-weight: 600; font-size: 12.5px; }
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--faint); font: 11px var(--sys); }
.chart .lineA { fill: none; stroke: var(--accent); stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1s ease-out forwards; }
.chart .areaA { fill: var(--accent); opacity: .12; }
.chart .dot { fill: var(--accent); }
.chart .dot-ring { fill: var(--bg); stroke: var(--accent); stroke-width: 2.25; }
.chart .endlbl { fill: var(--fg); font: 600 12px var(--sys); }
@keyframes draw { to { stroke-dashoffset: 0; } }
.ex-pick { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; touch-action: pan-x pan-y; }
.ex-pick::-webkit-scrollbar { display: none; }
.ex-pick .chip { flex: none; }
.last { font-size: 12.5px; color: var(--muted); }
.last b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------- Istoric ---------- */
.hist { display: grid; gap: 1px; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); background: var(--line); }
.hist-row { display: grid; grid-template-columns: 34px 1fr 18px; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 10px 12px; background: var(--surface); }
.hist-row:active { background: var(--surface-2); }
.hist-row .badge { width: 34px; height: 34px; border-radius: 10px; background: color-mix(in srgb, var(--accent) 16%, transparent); display: grid; place-items: center; font: 700 12px var(--sys); color: var(--red-hi); text-transform: uppercase; }
.hist-row strong { font-weight: 500; }
.hist-row small { color: var(--muted); display: block; font-size: 12px; }
.sbars { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; align-items: end; height: 120px; }
.sbar { display: grid; grid-template-rows: 1fr auto auto; justify-items: center; height: 100%; gap: 2px; min-width: 0; }
.sbar i { align-self: end; width: 100%; max-width: 48px; height: var(--h); border-radius: 8px 8px 3px 3px; background: linear-gradient(180deg, var(--red-hi), var(--accent) 60%, var(--red-deep)); transform-origin: bottom; animation: growup .55s var(--d) cubic-bezier(.2, .8, .2, 1) both; }
@keyframes growup { from { transform: scaleY(0); } }
.sbar b { font: 700 15px/1 var(--sys); } .sbar b small { font-size: 10px; color: var(--muted); margin-left: 1px; font-weight: 500; }
.sbar span { font-size: 12px; color: var(--muted); }
.hx-chart { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 6px; }
.hx-h { font: 600 12px var(--sys); color: var(--muted); }
.hx-h small { font-weight: 400; margin-left: 4px; }
.hx .wex-top { grid-template-columns: 52px 1fr; }
.hx .wex-top .rig { width: 52px; height: 52px; }

/* ---------- Meniul plutitor ---------- */
.nav { position: fixed; z-index: 10; left: max(14px, env(safe-area-inset-left, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  border-radius: 24px; border: 1px solid rgba(255,255,255,.08); background: rgba(28,23,26,.72); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6);
  box-shadow: 0 16px 36px -14px rgba(0,0,0,.8); }
.nav-in { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); padding: 5px; max-width: 560px; margin: 0 auto; }
.nav-pill { position: absolute; top: 5px; bottom: 5px; left: 5px; width: calc((100% - 10px) / 4); border-radius: 19px; background: rgba(255,255,255,.09);
  transform: translateX(calc(var(--i, 0) * 100%)); transition: transform .4s cubic-bezier(.3, 1.25, .4, 1); }

.gen-ring { position: absolute; inset: 0; transform: rotate(-90deg); }
.g-bg { fill: none; stroke: var(--surface-3); stroke-width: 6; }
.g-fg { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; filter: drop-shadow(0 0 8px var(--accent)); }
.gen-ph { position: absolute; inset: 18px; border-radius: 50%; overflow: hidden; background: var(--surface-2); }
.gen-ph img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; filter: grayscale(.4) contrast(1.1); animation: genpulse 1.6s ease-in-out infinite; }
@keyframes genpulse { 50% { filter: grayscale(0) contrast(1.2) brightness(1.15); } }
.gen-scan { position: absolute; inset: 18px; border-radius: 50%; overflow: hidden; pointer-events: none; }
.gen-scan::after { content: ''; position: absolute; left: 0; right: 0; height: 30%; background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--accent) 55%, transparent), transparent); animation: scan 1.4s linear infinite; }
@keyframes scan { from { top: -30%; } to { top: 100%; } }
.gen-pct { font: 800 40px var(--sys); letter-spacing: -.03em; }
.gen-txt { color: var(--muted); font-size: 14px; min-height: 20px; }
.ob-badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--red-hi); font: 600 13px var(--sys); }
.ob-badge svg { width: 16px; height: 16px; }
.ob-goals { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ob-goal { display: grid; gap: 3px; text-align: left; padding: 14px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--line); }
.ob-goal b { font: 600 15px var(--sys); } .ob-goal small { font-size: 12px; color: var(--muted); }
.ob-goal.on, .ob-day.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.ob-days { width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.ob-day { display: grid; padding: 12px 0; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line); }
.ob-day b { font: 700 22px var(--sys); } .ob-day small { font-size: 11px; color: var(--muted); }
.ob-check { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; background: var(--good); color: #fff; box-shadow: 0 16px 40px -14px var(--good); animation: pop .6s cubic-bezier(.3, 1.6, .5, 1) both; }
.ob-check svg { width: 40px; height: 40px; }
.ob-in .btn-main { margin-top: 6px; max-width: 360px; }
/* card record: partea de sus are culoarea clipului */
.pr-card { background: linear-gradient(180deg, var(--bg) 0 210px, color-mix(in srgb, #ffc94d 10%, var(--surface)) 260px, var(--surface)); }
.buddy.ob-av .b-vid, .buddy.ob-av .b-poster, .buddy.pr-av .b-vid, .buddy.pr-av .b-poster {
  -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%); mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%); }

/* ---------- Mai luminos, fără umbră sus ---------- */
:root { --surface: #1c181b; --surface-2: #262125; --surface-3: #322b30; --line: rgba(255,255,255,.09); --line-2: rgba(255,255,255,.14); --muted: #b0a5a9; --faint: #85797d; }
.ambient { display: none; }
.top { background: var(--bg); backdrop-filter: none; -webkit-backdrop-filter: none; }
.buddy.full::after { background: linear-gradient(180deg, transparent 0%, transparent 74%, var(--bg) 100%); }
.next, .rest-day, .rings, .mmap { background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02)), var(--surface); }
.stat, .check, .supp, .ex-item, .hist-row, .chart-card, .notice, .wex, .add-form, .week { background-color: var(--surface); }

/* =====================================================================
   Tema luminoasă: fundal alb-cald, carduri albe, roșu ca accent
   ===================================================================== */
:root {
  --bg: #f3f1f0; --surface: #ffffff; --surface-2: #f4f1f0; --surface-3: #e7e2e0;
  --line: rgba(40, 20, 25, .08); --line-2: rgba(40, 20, 25, .14);
  --fg: #1b1517; --muted: #6e6367; --faint: #9c9195;
  --accent: #e01f2b; --red-hi: #d81e2a; --red-deep: #a10f1b;
  --good: #16a35e; --bad: #e0343c; --water: #1f8ae0;
  color-scheme: light;
}
body { background: var(--bg); color: var(--fg); }
.shadow-card, .next, .rest-day, .rings, .mmap, .stat, .check, .supp, .ex-item, .hist-row, .chart-card, .notice, .wex, .add-form, .week, .water, .q-back, .ach-i, .ob-goal, .ob-day {
  box-shadow: 0 1px 2px rgba(40, 20, 25, .04), 0 8px 24px -14px rgba(40, 20, 25, .18); }
.next, .rest-day, .rings, .mmap { background: var(--surface); border-color: var(--line); }
.next::before, .rest-day::before { background: linear-gradient(90deg, transparent, var(--accent), transparent); }
.stat, .check, .supp, .ex-item, .hist-row, .chart-card, .notice, .wex, .add-form, .week { background: var(--surface); }
.checklist, .hist { background: var(--line); box-shadow: 0 8px 24px -14px rgba(40, 20, 25, .18); }
.checklist .check, .hist .hist-row { box-shadow: none; }

/* antet */
.top { background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.top::after { background: repeating-linear-gradient(90deg, var(--accent) 0 18px, #ffffff 18px 36px); box-shadow: 0 1px 0 var(--line); }
.brand .b2 { color: var(--fg); }

/* banda video: clipurile au fundalul de aceeași culoare */
.buddy.full { background: var(--bg); }

/* butoane și elemente mici */
.btn-ghost, .chip, .pill, .rest-btns button { background: var(--surface-2); border: 1px solid var(--line); color: var(--fg); }
.chip[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 10%, #fff); border-color: color-mix(in srgb, var(--accent) 45%, transparent); color: var(--accent); }
.btn-main { color: #fff; background: linear-gradient(180deg, #f2343f, var(--accent) 60%, #c41824); box-shadow: 0 10px 22px -12px var(--accent); }
.link { color: var(--accent); }
.water-dots i { background: color-mix(in srgb, var(--water) 14%, var(--surface-2)); }
.water { background: linear-gradient(135deg, color-mix(in srgb, var(--water) 9%, #fff), #fff); }
.check.taken strong { text-decoration-color: rgba(40, 20, 25, .3); }
.tick { border-color: var(--line-2); }
.set input, .field, .supp-ctl input[type="time"] { background: var(--surface-2); border-color: var(--line); color: var(--fg); }
.set .ok { background: var(--surface-2); }
.wd span { color: var(--muted); }
.wd.is-today span { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--fg); }
.q-front { box-shadow: 0 14px 28px -16px var(--accent); }
.q-gift { background: rgba(255, 255, 255, .22); }
.progressbar, .ring .bgc { background: var(--surface-3); stroke: var(--surface-3); }
.ring .bgc { background: none; }
.mistake { background: color-mix(in srgb, var(--bad) 8%, #fff); }
.rest-info { background: var(--surface-2); }
.rg-bg { opacity: .14; }
.streak { background: linear-gradient(90deg, #fff4e6, #fff); border-color: #ffd9a8; }
.streak b { color: #e07b00; } .streak svg { color: #f08c00; }
.mm-row i { background: var(--surface-3); }
.hist-row .badge { background: color-mix(in srgb, var(--accent) 10%, #fff); color: var(--accent); }
.pr-b { background: #fff4d6 !important; color: #c98a00 !important; }
.ach-i.ok { background: linear-gradient(180deg, #fff8e6, #fff); border-color: #ffe2a3; }
.ach-ic { background: var(--surface-2); }
.sbar span, .sbar b small { color: var(--muted); }

/* meniu plutitor: sticlă albă */
.nav { background: rgba(255, 255, 255, .78); border-color: rgba(40, 20, 25, .08); box-shadow: 0 12px 30px -12px rgba(40, 20, 25, .28); }
.nav-pill { background: color-mix(in srgb, var(--accent) 10%, #fff); }
.nav button { color: var(--faint); }
.nav button[aria-current="page"] { color: var(--accent); }

/* antrenament și cronometru */
.workout { background: var(--bg); }
.w-head { background: color-mix(in srgb, var(--bg) 92%, transparent); }
.rest-in { background: rgba(255, 255, 255, .9); border-color: var(--line); box-shadow: 0 14px 34px -12px rgba(40, 20, 25, .35); color: var(--fg); }
.toast { background: #1b1517; color: #fff; }
.pr { background: rgba(243, 241, 240, .7); }
.pr-card { background: linear-gradient(180deg, var(--bg) 0 210px, #fff8e6 260px, #fff); border-color: #ffe2a3; box-shadow: 0 30px 60px -24px rgba(40, 20, 25, .35); }
.pr-v { color: #c98a00; }

/* ecran de pornire și prezentare */
.splash { background: radial-gradient(circle at 50% 40%, #fff 0%, var(--bg) 70%); }
.sp-fig { border-color: #fff; box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 18%, transparent), 0 24px 50px -18px rgba(224, 31, 43, .55); }
.sp-b { color: var(--fg); }
.onb { background: radial-gradient(120% 70% at 50% 0%, #fff 0%, var(--bg) 60%); }
.ob-drop { background: color-mix(in srgb, var(--accent) 5%, #fff); }
.ob-goal, .ob-day { background: #fff; }
.ob-goal.on, .ob-day.on { background: color-mix(in srgb, var(--accent) 7%, #fff); }
.gen-ph { background: var(--surface-2); }
.prof-av { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent), 0 16px 36px -14px rgba(224, 31, 43, .5); }

/* figurile animate pe fond deschis */
.rig .limb { stroke: #2a2226; } .rig .head, .rig .torso { fill: #2a2226; }
.rig .hub { fill: #fff; }
.rigs-row .rig, .ex-row .rig, .wex-top .rig, .ex-detail .rig.big { background: var(--surface-2); }

.done-b { background: var(--good) !important; color: #fff !important; }
.done-b svg { width: 14px; height: 14px; }
.done-card { background: linear-gradient(180deg, var(--bg) 0 210px, #eefaf3 260px, #fff) !important; border-color: #bfe8cf !important; }
.done-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; margin: 4px 0 8px; }
.done-stats div { display: grid; padding: 10px 4px; border-radius: 14px; background: var(--surface-2); }
.done-stats b { font: 700 22px var(--sys); letter-spacing: -.02em; }
.done-stats small { font-size: 11.5px; color: var(--muted); }
/* antet solid, fără estompare */
.top, .w-head { background: var(--bg) !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }

/* ---------- Derulare într-un panou interior: iOS 26 nu mai estompează partea de sus ---------- */
html, body { height: 100%; overflow: hidden; }
.app { position: fixed; inset: 0; max-width: none; margin: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;
  padding-bottom: calc(104px + env(safe-area-inset-bottom, 0px)); }
.app > .top, .app > main { max-width: 560px; margin-left: auto; margin-right: auto; }
.top { position: sticky; top: 0 !important; padding-top: calc(12px + env(safe-area-inset-top, 0px)); }

/* ---------- v3: identitate unitară, ierarhie mai clară ---------- */
.top::after { display: none !important; }
.top { box-shadow: 0 1px 0 var(--line); }
.brand .b1 { font-weight: 800; letter-spacing: .12em; }
.brand .b2 { color: var(--muted) !important; font-weight: 600; letter-spacing: .16em; }
.q-front { color: var(--fg); background: var(--surface) !important; border: 1px solid var(--line); box-shadow: 0 10px 24px -18px rgba(40, 20, 25, .35) !important; }
.q-front small { color: var(--muted); opacity: 1; }
.q-gift { background: color-mix(in srgb, var(--accent) 10%, transparent) !important; color: var(--accent); }

/* ================= v4: afiș de meci. Un singur moment mare (scena de azi), restul calm ================= */
:root { --display: 'Forta Display', 'Saira Condensed', 'Arial Narrow', sans-serif; --accent: #d8101c; --red-hi: #d8101c; --red-deep: #7c0911;
  --ink: #1a1416; --r-lg: 28px; --r-md: 20px; --r-sm: 14px;
  --lift: 0 1px 0 rgba(255,255,255,.9) inset, 0 1px 2px rgba(40,18,22,.05), 0 18px 36px -24px rgba(60,20,26,.28); }
.num { font-family: var(--display); font-weight: 800; letter-spacing: .005em; }

/* antet: mai jos, departe de marginea estompată de iOS */
.top { padding-top: calc(22px + env(safe-area-inset-top, 0px)) !important; padding-bottom: 12px !important; box-shadow: none !important; }
.brand { font-family: var(--display) !important; letter-spacing: 0 !important; text-transform: none !important; align-items: baseline; }
.brand .b1 { font-size: 1.55em; font-weight: 800; letter-spacing: .01em; color: var(--accent); }
.brand .b2 { font: 600 .7em var(--sys); letter-spacing: .01em; color: var(--muted) !important; }

/* meniul de jos: coborât spre marginea ecranului */
.nav { bottom: calc(4px + env(safe-area-inset-bottom, 0px) * .35) !important; border-radius: 26px; }
.app { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px) * .35) !important; }
.toast { bottom: calc(92px + env(safe-area-inset-bottom, 0px) * .35); }

/* titluri de secțiune */
.sec > h2, .sec-head h2 { margin: 0; font: 800 27px/1 var(--display); letter-spacing: .005em; color: var(--ink); text-transform: none; }
.sec-head .count { font: 800 20px/1 var(--display); color: var(--muted); }
.sec { gap: 12px; }
main { gap: 30px; }
.eyebrow, .next-up small { text-transform: none !important; letter-spacing: 0 !important; }

/* ---------- Scena de azi ---------- */
.stage { position: relative; width: 100vw; margin-left: calc(50% - 50vw); height: min(480px, 60vh); margin-top: 0; overflow: hidden; isolation: isolate; }
.stage .buddy.st-av { position: absolute; left: 0; right: 0; top: 0; bottom: 34px; }
.stage .buddy.st-av .b-vid, .stage .buddy.st-av .b-poster { height: 100%; left: 58%; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 14%, #000 86%, transparent 100%), linear-gradient(180deg, #000 70%, transparent 100%);
  mask-image: linear-gradient(90deg, transparent 0, #000 14%, #000 86%, transparent 100%), linear-gradient(180deg, #000 70%, transparent 100%); -webkit-mask-composite: source-in; mask-composite: intersect; }
.st-title { position: absolute; z-index: 2; left: max(14px, env(safe-area-inset-left, 0px)); right: 12px; bottom: 0; margin: 0; display: grid; justify-items: start;
  font: 800 clamp(96px, 29vw, 138px)/.78 var(--display); letter-spacing: -.012em; color: var(--accent); mix-blend-mode: multiply; pointer-events: none; }
.st-l2 { font-size: .5em; line-height: .9; color: var(--ink); margin-top: .12em; }
.stage.st-rest .st-title { font-size: clamp(110px, 34vw, 160px); }
.st-date { position: absolute; z-index: 2; top: 16px; left: max(16px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 8px; }
.st-date b { font-size: 46px; line-height: .8; color: var(--ink); }
.st-date > span { font: 600 12px/1.25 var(--sys); color: var(--muted); }
.st-date > span::first-letter { text-transform: uppercase; }
.st-live { position: absolute; z-index: 2; top: 14px; right: 16px; display: flex; align-items: center; gap: 7px; padding: 7px 11px; border-radius: 999px; background: var(--ink); color: #fff; font: 600 12px var(--sys); }
.st-live i { width: 7px; height: 7px; border-radius: 50%; background: #ff3b47; animation: livepulse 1.4s ease-in-out infinite; }
@keyframes livepulse { 50% { opacity: .25; } }
.st-card { position: relative; z-index: 3; display: grid; gap: 16px; margin-top: -14px; padding: 18px; border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--lift); }
.st-lead { margin: 0; font: 500 15.5px/1.45 var(--sys); color: var(--muted); text-wrap: pretty; }
.board { display: grid; grid-template-columns: repeat(3, 1fr); }
.board > div { display: grid; gap: 4px; padding: 2px 14px; border-left: 1px solid var(--line); }
.board > div:first-child { padding-left: 0; border-left: 0; }
.board b { font-size: 44px; line-height: .82; color: var(--ink); }
.board small { font: 600 12.5px var(--sys); color: var(--muted); }
.st-card .rigs-row .rig { height: 84px; border-radius: var(--r-sm); border: 0; background: var(--soft); }
.st-card .next-up { border: 0; background: var(--soft); border-radius: var(--r-sm); padding: 14px; }
.st-card .next-up small { font: 600 12.5px var(--sys); color: var(--muted); }
.st-card .next-up b { font: 800 24px/1 var(--display); color: var(--ink); margin-top: 3px; }
.st-card .next-up span { font: 700 13px var(--sys); color: var(--accent); }
.st-card .chips { margin-top: -4px; }
.st-card .link { justify-self: start; }

/* butonul principal: plin, fără gradient de șablon */
.btn-main { min-height: 54px; border-radius: 16px; background: var(--accent) !important; box-shadow: 0 12px 24px -14px rgba(216,16,28,.9), inset 0 -2px 0 rgba(0,0,0,.14) !important; font: 650 16.5px var(--sys); letter-spacing: -.01em; }
.btn-main:active { transform: translateY(1px); box-shadow: 0 6px 14px -10px rgba(216,16,28,.9), inset 0 -1px 0 rgba(0,0,0,.14) !important; }

/* inele, apă, listă: o singură familie de suprafețe, ierarhie prin rază și umbră */
.rings, .water, .week, .q-back, .q-front { border-radius: var(--r-md) !important; box-shadow: var(--lift) !important; border: 0 !important; }
.rings b, .rings .val { font-family: var(--display); font-weight: 800; }
.checklist { border-radius: var(--r-md); box-shadow: var(--lift); border: 0 !important; overflow: hidden; }
.check { padding: 13px 16px; grid-template-columns: 56px 1fr 28px; }
.check time { font: 800 22px/1 var(--display); color: var(--ink); letter-spacing: .01em; }
.check.taken time { color: var(--faint); }
.check.taken .tick { background: var(--ink); border-color: var(--ink); }
.check.taken strong { text-decoration: none; color: var(--faint); }
.tick { width: 26px; height: 26px; }
.wd span { font: 800 17px var(--display); }
.wd.done span { background: var(--accent); }
.wd small { text-transform: none; font-size: 11.5px; }
.water-btns .btn-main { background: var(--water) !important; box-shadow: 0 12px 24px -14px rgba(31,138,224,.9), inset 0 -2px 0 rgba(0,0,0,.14) !important; }
.wd small::first-letter { text-transform: uppercase; }
/* Program: fiecare zi e un singur bloc, nu un teanc de carduri identice */
.day-block { gap: 12px; }
.day-title { align-items: flex-end; }
.day-title h3 { font: 800 34px/.9 var(--display); letter-spacing: .005em; color: var(--ink); }
.day-title h3 span { font: 600 13px var(--sys); letter-spacing: 0; text-transform: none; color: var(--accent); margin-bottom: 6px; }
.day-title .btn-ghost { min-height: 38px; border-radius: 999px; padding: 0 16px; background: var(--ink); color: #fff; border: 0; font-weight: 600; }
.ex-list { border-radius: var(--r-md); background: var(--surface); box-shadow: var(--lift); overflow: hidden; }
.ex-list .ex-item { border-radius: 0 !important; box-shadow: none !important; border: 0 !important; background: transparent !important; }
.ex-list .ex-item + .ex-item { border-top: 1px solid var(--line) !important; }
.ex-list .ex-row .rig { border-radius: 12px; background: var(--soft); border: 0; }
.day-block + .day-block { margin-top: 8px; }
.streak { background: var(--soft) !important; border: 0 !important; }
.streak svg { color: var(--accent) !important; }
.streak b { font: 800 22px var(--display) !important; color: var(--accent) !important; }
.supp-top > span { display: grid; gap: 3px; min-width: 0; }
.ic-row { display: flex !important; }
/* Profil */
.prof h1 { font: 800 40px/.9 var(--display); letter-spacing: .005em; color: var(--ink); margin-top: 10px; }
.pstats { gap: 0; border-radius: var(--r-md); background: var(--surface); box-shadow: var(--lift); padding: 14px 4px; }
.pstats .stat { background: none !important; border: 0 !important; box-shadow: none !important; border-radius: 0; padding: 0 6px; }
.pstats .stat + .stat { border-left: 1px solid var(--line) !important; }
.stat b { font: 800 28px/.95 var(--display); letter-spacing: .005em; }
.pstats .stat b { font-size: 28px; }
.ach-i { border: 0 !important; box-shadow: var(--lift) !important; background: var(--surface) !important; opacity: 1; border-radius: var(--r-md); }
.ach-i:not(.ok) { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--line) !important; }
.ach-i:not(.ok) > * { opacity: .5; }
.ach-i.ok .ach-ic { background: var(--accent) !important; color: #fff !important; box-shadow: 0 8px 16px -8px rgba(216,16,28,.8) !important; }
.ach-i b { font: 800 17px/1 var(--display); letter-spacing: .005em; }
/* Antrenament */
.w-head { padding-top: calc(20px + env(safe-area-inset-top, 0px)) !important; border-bottom: 0 !important; }
.w-title { font: 800 30px/.92 var(--display); letter-spacing: .005em; color: var(--ink); }
.w-title span { font: 600 13px var(--sys); letter-spacing: 0; text-transform: none; color: var(--accent); margin-bottom: 4px; }
.wex { border: 0 !important; box-shadow: var(--lift) !important; border-radius: var(--r-md) !important; }
.wex h3 { font: 800 25px/.95 var(--display) !important; letter-spacing: .005em; color: var(--ink); }
.set input { height: 48px; border: 0 !important; background: var(--soft) !important; border-radius: 12px; font: 800 26px var(--display) !important; letter-spacing: .01em; }
.set .ok { height: 48px; border: 0 !important; border-radius: 12px; background: var(--soft) !important; }
