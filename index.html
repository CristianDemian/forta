<!doctype html><html lang="ro"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Forța">
<meta name="theme-color" content="#12151b"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:0;padding-bottom:0}.top{top:0!important;padding-top:calc(14px + env(safe-area-inset-top,0px))!important}[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Forța la Sală</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Saira+Condensed:wght@600;700;800&display=swap">
</head><body><style>/* Layout: o coloană de telefon, antet lipit sus, navigare jos; antrenamentul se deschide peste tot ecranul */
:root {
  --bg: #12151b;
  --surface: #1a1e26;
  --surface-2: #232935;
  --line: #2f3644;
  --fg: #ece8e0;
  --muted: #8d94a3;
  --accent: #f2c230;
  --accent-ink: #1d1700;
  --blue: #5b93ff;
  --good: #4fc38a;
  --bad: #ff6b57;
  --display: 'Saira Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --body: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; }

.app { max-width: 560px; margin: 0 auto; min-height: 100%; padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid transparent;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 10px;
  display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px; }
.brand { font: 800 26px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; }
.brand b { color: var(--accent); font-weight: 800; }
.brand span { font-weight: 700; font-size: 18px; letter-spacing: .06em; color: var(--muted); margin-left: 4px; }
.today { color: var(--muted); font-size: 13px; text-transform: capitalize; }
main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 4px 24px; display: grid; gap: 22px; }

h2 { font: 700 15px/1.2 var(--display); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0; }
.sec { display: grid; gap: 10px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sec-head .count { font: 700 15px var(--display); color: var(--fg); }

/* Card principal: următorul antrenament */
.next { position: relative; overflow: hidden; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); padding: 18px 18px 16px; display: grid; gap: 14px; }
.next::before { content: ''; position: absolute; inset: 0 0 auto auto; width: 210px; height: 210px; border-radius: 50%; border: 22px solid var(--surface-2); transform: translate(70px, -80px); }
.next > * { position: relative; }
.eyebrow { font: 700 12px var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.dayname { font: 800 clamp(32px, 9.5vw, 44px)/0.95 var(--display); text-transform: uppercase; margin: 2px 0 0; text-wrap: balance; }
.daymeta { color: var(--muted); font-size: 14px; }
.rigs-row { display: flex; gap: 6px; }
.rigs-row .rig { width: 33%; max-width: 110px; aspect-ratio: 1; background: var(--surface-2); border-radius: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 20px; border-radius: 14px; font: 700 18px var(--display); letter-spacing: .06em; text-transform: uppercase; }
.btn-main { background: var(--accent); color: var(--accent-ink); width: 100%; }
.btn-main:active { transform: translateY(1px); filter: brightness(.95); }
.btn-ghost { background: var(--surface-2); color: var(--fg); min-height: 42px; font-size: 15px; padding: 0 14px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 36px; padding: 0 14px; border-radius: 999px; background: var(--surface-2); color: var(--fg); font: 600 14px var(--body); border: 1px solid transparent; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

/* Săptămâna */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.wd { display: grid; justify-items: center; gap: 6px; padding: 8px 0 10px; border-radius: 12px; background: var(--surface); }
.wd small { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.wd span { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 15px var(--display); border: 1.5px dashed var(--line); color: var(--muted); }
.wd.done span { background: var(--accent); color: var(--accent-ink); border: 0; }
.wd.done span svg { width: 16px; height: 16px; }
.wd.plan span { border: 1.5px solid var(--accent); color: var(--fg); }
.wd em { font-style: normal; font-size: 10px; color: var(--muted); letter-spacing: .02em; }
.wd.plan em, .wd.done em { color: var(--accent); }
.wd.is-today { outline: 1.5px solid var(--line); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border-radius: var(--r); padding: 12px; display: grid; gap: 2px; min-width: 0; }
.stat b { font: 700 24px/1.05 var(--display); font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); font-size: 12px; line-height: 1.3; }

/* Suplimente azi */
.checklist { display: grid; gap: 8px; }
.check { display: grid; grid-template-columns: 54px 1fr 30px; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 12px 14px; border-radius: var(--r); background: var(--surface); }
.check time { font: 700 18px var(--display); color: var(--muted); font-variant-numeric: tabular-nums; }
.check strong { display: block; font-weight: 600; }
.check em { font-style: normal; color: var(--muted); font-size: 13px; }
.tick { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.tick svg { width: 16px; height: 16px; opacity: 0; }
.check.taken { background: color-mix(in srgb, var(--good) 12%, var(--surface)); }
.check.taken .tick { background: var(--good); border-color: var(--good); }
.check.taken .tick svg { opacity: 1; }
.check.taken strong { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--fg) 40%, transparent); }

/* Program */
.day-block { display: grid; gap: 8px; }
.day-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.day-title h3 { margin: 0; font: 800 26px/1 var(--display); text-transform: uppercase; }
.day-title h3 span { color: var(--accent); display: block; font-size: 14px; letter-spacing: .12em; margin-bottom: 2px; }
.ex-item { background: var(--surface); border-radius: var(--r); overflow: hidden; }
.ex-row { display: grid; grid-template-columns: 58px 1fr 20px; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 8px 12px 8px 8px; }
.ex-row .rig { width: 58px; height: 58px; background: var(--surface-2); border-radius: 10px; }
.ex-row strong { display: block; font-weight: 600; line-height: 1.25; }
.ex-row small { color: var(--muted); font-size: 13px; }
.chev { width: 18px; height: 18px; color: var(--muted); transition: transform .2s; }
.ex-item.open .chev { transform: rotate(180deg); }
.ex-detail { padding: 4px 14px 16px; display: grid; gap: 12px; }
.ex-detail .rig.big { width: 100%; max-width: 280px; aspect-ratio: 1; justify-self: center; background: var(--surface-2); border-radius: 16px; }
.cues { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; counter-reset: c; }
.cues li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; counter-increment: c; }
.cues li::before { content: counter(c); font: 700 15px/1.45 var(--display); color: var(--accent); }
.mistake { background: color-mix(in srgb, var(--bad) 12%, transparent); color: var(--fg); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.mistake b { color: var(--bad); font-weight: 600; }
.target { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); font-size: 13px; color: var(--fg); }
.pill.up { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); font-weight: 600; }

/* Grafice */
.chart-card { background: var(--surface); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; }
.chart-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.chart-head b { font: 700 28px/1 var(--display); font-variant-numeric: tabular-nums; }
.chart-head small { color: var(--muted); }
.delta-up { color: var(--good); font-weight: 600; font-size: 13px; }
.delta-down { color: var(--bad); font-weight: 600; font-size: 13px; }
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--muted); font: 11px var(--body); }
.chart .lineA { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.1s ease-out forwards; }
.chart .areaA { fill: var(--accent); opacity: .12; }
.chart .dot { fill: var(--accent); }
.chart .dot-ring { fill: var(--bg); stroke: var(--accent); stroke-width: 2.5; }
.chart .endlbl { fill: var(--fg); font: 700 13px var(--display); }
@keyframes draw { to { stroke-dashoffset: 0; } }
.empty { color: var(--muted); font-size: 14px; padding: 18px 4px; text-align: center; border: 1.5px dashed var(--line); border-radius: 12px; }
.ex-pick { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.ex-pick .chip { flex: none; }

.row-input { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.field { width: 100%; min-height: 46px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); padding: 0 12px; }
.field:focus { border-color: var(--accent); outline: none; }
textarea.field { padding: 10px 12px; min-height: 90px; resize: vertical; font-size: 12px; }

.hist { display: grid; gap: 6px; }
.hist-row { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; background: var(--surface); padding: 10px 12px; border-radius: 12px; }
.hist-row .badge { width: 34px; height: 34px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; font: 800 15px var(--display); color: var(--accent); text-transform: uppercase; }
.hist-row small { color: var(--muted); display: block; font-size: 12.5px; }
.del { color: var(--muted); font-size: 13px; padding: 8px; border-radius: 8px; }
.del.armed { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }

/* Suplimente: editare */
.supp { background: var(--surface); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 10px; }
.supp.off { opacity: .62; }
.supp-top { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start; }
.supp-top strong { font-weight: 600; display: block; }
.supp-top small { color: var(--muted); }
.supp-tip { font-size: 13px; color: var(--muted); }
.supp-ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.supp-ctl input[type="time"] { min-height: 40px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); padding: 0 10px; font: 700 17px var(--display); }
.switch { position: relative; width: 50px; height: 30px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); flex: none; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s; }
.switch[aria-checked="true"] { background: color-mix(in srgb, var(--accent) 30%, var(--surface-2)); border-color: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(20px); background: var(--accent); }
.add-form { display: grid; gap: 8px; background: var(--surface); padding: 14px; border-radius: var(--r); }
.add-form .two { display: grid; grid-template-columns: 1fr 136px; gap: 8px; }
.notice { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; }
.notice p { margin: 0; color: var(--muted); font-size: 14px; }
.notice strong { font-weight: 600; }
.state-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 1px; }
.state-dot.on { background: var(--good); }

/* Navigare jos */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.nav-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.nav button { display: grid; justify-items: center; gap: 3px; padding: 9px 0 8px; color: var(--muted); font-size: 11.5px; font-weight: 600; }
.nav svg { width: 24px; height: 24px; }
.nav button[aria-current="page"] { color: var(--accent); }

/* Ecran antrenament */
.workout { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-top: 0; padding-bottom: calc(120px + env(safe-area-inset-bottom, 0px)); }
.w-head { position: sticky; top: 0; z-index: 3; background: var(--bg);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: calc(12px + env(safe-area-inset-top, 0px)); padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.w-head-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
.w-title { font: 800 22px/1.05 var(--display); text-transform: uppercase; min-width: 0; }
.w-title span { color: var(--accent); display: block; font-size: 14px; letter-spacing: .12em; margin-bottom: 2px; }
.w-sub { color: var(--muted); font-size: 13px; grid-column: 1; }
.w-finish { grid-row: 1 / span 2; grid-column: 2; }
.w-finish.armed { background: var(--good); color: #062014; }
.progressbar { grid-column: 1 / -1; height: 4px; background: var(--surface-2); border-radius: 4px; overflow: hidden; margin-top: 6px; }
.progressbar i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.w-body { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 20px; display: grid; gap: 14px; }
.wex { background: var(--surface); border-radius: 18px; padding: 12px; display: grid; gap: 10px; }
.wex.complete { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--good) 60%, transparent); }
.wex-top { display: grid; grid-template-columns: 84px 1fr; gap: 12px; align-items: center; }
.wex-top .rig { width: 84px; height: 84px; background: var(--surface-2); border-radius: 12px; }
.wex-top h3 { margin: 0 0 4px; font: 700 20px/1.1 var(--display); text-transform: uppercase; letter-spacing: .01em; }
.wex-top small { color: var(--muted); font-size: 13px; display: block; }
.last { font-size: 13px; color: var(--muted); }
.last b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.sets { display: grid; gap: 6px; }
.set-h, .set { display: grid; grid-template-columns: 30px 1fr 1fr 52px; gap: 8px; align-items: center; }
.set-h span { text-align: center; }
.set-h { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; padding: 0 2px; }
.set .n { font: 700 18px var(--display); color: var(--muted); text-align: center; }
.set input { width: 100%; min-width: 0; min-height: 46px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); text-align: center; font: 700 20px var(--display); font-variant-numeric: tabular-nums; }
.set input:focus { border-color: var(--accent); outline: none; }
.set input::placeholder { color: color-mix(in srgb, var(--muted) 70%, transparent); }
.set .ok { height: 46px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); }
.set .ok svg { width: 22px; height: 22px; }
.set.done .ok { background: var(--good); border-color: var(--good); color: #062014; }
.set.done input { border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
.wex-actions { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.link { color: var(--accent); font-weight: 600; font-size: 14px; padding: 8px 4px; }
.link.muted { color: var(--muted); }
.w-foot { display: grid; gap: 10px; padding-top: 8px; }

/* Cronometru pauză */
.rest { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding-top: 0; pointer-events: none; }
.rest-in { pointer-events: auto; max-width: 540px; margin: 0 auto; background: var(--surface-2); border: 1px solid var(--line); border-radius: 20px; padding: 10px 12px; display: grid; grid-template-columns: 58px 1fr auto; gap: 12px; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
.ring { width: 58px; height: 58px; }
.ring circle { fill: none; stroke-width: 6; }
.ring .bgc { stroke: var(--line); }
.ring .fgc { stroke: var(--accent); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .25s linear; }
.rest-t { font: 800 32px/1 var(--display); font-variant-numeric: tabular-nums; }
.rest small { color: var(--muted); font-size: 12.5px; display: block; }
.rest-btns { display: flex; gap: 6px; }
.rest-btns button { min-width: 44px; height: 40px; border-radius: 10px; background: var(--surface); font: 700 15px var(--display); padding: 0 8px; }
.rest.ended .rest-in { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.rest.ended small { color: var(--accent-ink); }
.rest.ended .rest-btns button { background: color-mix(in srgb, var(--accent-ink) 14%, transparent); color: var(--accent-ink); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.4); }

/* Animații */
.rig .limb, .rig .ground, .rig .prop, .rig .eq, .rig .cable { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.rig .limb { stroke: var(--fg); }
.rig .w14 { stroke-width: 14; } .rig .w9 { stroke-width: 9; } .rig .w8 { stroke-width: 8; } .rig .w6 { stroke-width: 6; } .rig .w5 { stroke-width: 5; } .rig .w4 { stroke-width: 4; }
.rig .head, .rig .torso { fill: var(--fg); }
.rig .prop { stroke: var(--line); }
.rig .ground { stroke: var(--line); stroke-width: 2; }
.rig .eq { stroke: var(--accent); }
.rig .eq-fill { fill: var(--accent); }
.rig .hub { fill: var(--surface-2); }
.rig .cable { stroke: var(--muted); stroke-width: 1.5; }
.rig .pulley { fill: var(--muted); }

@media (prefers-reduced-motion: reduce) { .chart .lineA { animation: none; stroke-dashoffset: 0; } * { transition: none !important; } }

/* Zi de odihnă */
.rest-day { border-radius: 20px; background: var(--surface); border: 1px solid var(--line); padding: 26px 18px 18px; display: grid; justify-items: center; text-align: center; gap: 10px; }
.wink { width: 116px; height: 116px; }
.wink-face { transform-origin: 60px 60px; animation: tilt 4.5s ease-in-out infinite; }
.wink-eye { transform-origin: 79px 48px; animation: blink 4.5s ease-in-out infinite; }
@keyframes tilt { 0%, 60%, 100% { transform: rotate(0); } 70% { transform: rotate(-9deg); } 82% { transform: rotate(4deg); } }
@keyframes blink { 0%, 64%, 80%, 100% { transform: scaleY(1); } 70% { transform: scaleY(1.6); } }
.rest-title { margin: 4px 0 0; font: 800 clamp(64px, 21vw, 96px)/0.88 var(--display); text-transform: uppercase; letter-spacing: .03em; color: var(--fg); }
.rest-msg { margin: 0; color: var(--muted); max-width: 32ch; }
.next-up { width: 100%; background: var(--surface-2); border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; margin-top: 6px; }
.next-up small { font: 700 12px var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.next-up b { font: 700 22px/1.1 var(--display); text-transform: uppercase; }

/* ---------- Animații: un singur schelet, două poziții per exercițiu ---------- */
const Rig = (() => {
  const R = Math.PI / 180, L = { T: 48, UA: 28, FA: 26, TH: 34, SH: 32 };
  const d = (a, l) => [Math.sin(a * R) * l, Math.cos(a * R) * l];
  const add = (p, q) => [p[0] + q[0], p[1] + q[1]];
  const sub = (p, q) => [p[0] - q[0], p[1] - q[1]];
  const f = n => n.toFixed(1);
  const ln = (p, q, c) => `<line class="${c}" x1="${f(p[0])}" y1="${f(p[1])}" x2="${f(q[0])}" y2="${f(q[1])}"/>`;
  const poly = (pts, c) => `<polyline class="${c}" points="${pts.map(p => f(p[0]) + ',' + f(p[1])).join(' ')}"/>`;

  function lerp(A, B, k) {
    const o = {};
    for (const key in A) {
      const a = A[key], b = B[key];
      o[key] = Array.isArray(a) ? [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k] : a + (b - a) * k;
    }
    return o;
  }

  function side(P, eq) {
    const td = [Math.sin(P.t * R), -Math.cos(P.t * R)];
    const tv = [td[0] * L.T, td[1] * L.T];
    let hip, sh, el, hand, knee, foot;
    if (P.foot) {
      foot = P.foot; knee = sub(foot, d(P.sh, L.SH)); hip = sub(knee, d(P.th, L.TH));
      sh = add(hip, tv); el = add(sh, d(P.ua, L.UA)); hand = add(el, d(P.fa, L.FA));
    } else if (P.hand) {
      hand = P.hand; el = sub(hand, d(P.fa, L.FA)); sh = sub(el, d(P.ua, L.UA)); hip = sub(sh, tv);
      knee = add(hip, d(P.th, L.TH)); foot = add(knee, d(P.sh, L.SH));
    } else {
      hip = P.hip; sh = add(hip, tv); el = add(sh, d(P.ua, L.UA)); hand = add(el, d(P.fa, L.FA));
      knee = add(hip, d(P.th, L.TH)); foot = add(knee, d(P.sh, L.SH));
    }
    const head = add(sh, [td[0] * 15, td[1] * 15]);
    const toe = add(foot, d(P.fd == null ? 90 : P.fd, 10));
    const pts = { hand, foot, sh };
    let back = '', front = '';
    for (const e of eq) {
      if (e.k === 'bench') {
        back += ln(e.a, e.b, 'prop w8');
        back += ln([e.a[0] + 8, e.a[1]], [e.a[0] + 8, 180], 'prop w4') + ln([e.b[0] - 8, e.b[1]], [e.b[0] - 8, 180], 'prop w4');
      } else if (e.k === 'pad') {
        back += ln(e.a, e.b, 'prop w8');
      } else if (e.k === 'bars') {
        back += ln([76, e.y], [132, e.y], 'prop w5') + ln([128, e.y], [128, 180], 'prop w4');
      } else if (e.k === 'plate') {
        const p = pts[e.at];
        front += `<circle class="eq-fill" cx="${f(p[0])}" cy="${f(p[1])}" r="12"/><circle class="hub" cx="${f(p[0])}" cy="${f(p[1])}" r="3"/>`;
      } else if (e.k === 'db') {
        const p = pts[e.at];
        front += `<rect class="eq-fill" x="${f(p[0] - 9)}" y="${f(p[1] - 4)}" width="18" height="8" rx="2"/>`;
      } else if (e.k === 'handle') {
        const p = pts[e.at];
        front += `<circle class="eq-fill" cx="${f(p[0])}" cy="${f(p[1])}" r="4.5"/>`;
      } else if (e.k === 'cable') {
        const p = pts[e.at];
        const to = e.to === 'up' ? [p[0], 12] : e.to === 'right' ? [190, p[1]] : e.to;
        back += ln(p, to, 'cable') + `<circle class="pulley" cx="${f(to[0])}" cy="${f(to[1])}" r="5"/>`;
      } else if (e.k === 'platform') {
        const p = pts[e.at], a = e.ang * R, n = [Math.cos(a), -Math.sin(a)];
        front += ln([p[0] + n[0] * 18 + Math.sin(a) * 4, p[1] + n[1] * 18 + Math.cos(a) * 4], [p[0] - n[0] * 18 + Math.sin(a) * 4, p[1] - n[1] * 18 + Math.cos(a) * 4], 'eq w6');
      }
    }
    return back +
      poly([hip, knee, foot, toe], 'limb w9') +
      ln(hip, sh, 'limb w14') +
      `<circle class="head" cx="${f(head[0])}" cy="${f(head[1])}" r="9.5"/>` +
      poly([sh, el, hand], 'limb w8') + front;
  }

  function frontView(P, eq) {
    const S = { r: [117, 68], l: [83, 68] };
    let out = '';
    const arm = (s, sign) => {
      const ul = P.ul == null ? 1 : P.ul, e = [s[0] + sign * Math.sin(P.ua * R) * 27 * ul, s[1] + Math.cos(P.ua * R) * 27];
      const h = [e[0] + sign * Math.sin(P.fa * R) * 25, e[1] + Math.cos(P.fa * R) * 25];
      return { e, h };
    };
    const ar = arm(S.r, 1), al = arm(S.l, -1);
    for (const x of eq) {
      if (x.k === 'cableF') {
        const tr = [200 - x.to[0], x.to[1]];
        out += ln(ar.h, tr, 'cable') + ln(al.h, x.to, 'cable') +
          `<circle class="pulley" cx="${tr[0]}" cy="${tr[1]}" r="5"/><circle class="pulley" cx="${x.to[0]}" cy="${x.to[1]}" r="5"/>`;
      }
    }
    out += poly([[93, 112], [91, 146], [90, 178]], 'limb w9') + poly([[107, 112], [109, 146], [110, 178]], 'limb w9');
    out += `<path class="torso" d="M84 66 L116 66 L110 112 L90 112 Z"/>`;
    out += `<circle class="head" cx="100" cy="50" r="10"/>`;
    out += poly([S.r, ar.e, ar.h], 'limb w8') + poly([S.l, al.e, al.h], 'limb w8');
    for (const x of eq) {
      if (x.k === 'dbF') {
        for (const h of [ar.h, al.h]) out += `<rect class="eq-fill" x="${f(h[0] - 4)}" y="${f(h[1] - 9)}" width="8" height="18" rx="2"/>`;
      } else if (x.k === 'padsF') {
        for (const h of [ar.h, al.h]) out += `<rect class="eq-fill" x="${f(h[0] - 5)}" y="${f(h[1] - 4)}" width="10" height="26" rx="4"/>`;
      } else if (x.k === 'cableF') {
        for (const h of [ar.h, al.h]) out += `<circle class="eq-fill" cx="${f(h[0])}" cy="${f(h[1])}" r="4.5"/>`;
      }
    }
    return out;
  }

  function frame(rig, k) {
    const P = lerp(rig.A, rig.B, k);
    return `<line class="ground" x1="14" y1="181" x2="186" y2="181"/>` + (rig.front ? frontView(P, rig.eq) : side(P, rig.eq));
  }

  /* 0 → A, 1 → B, cu pauze la capete */
  function phase(t) {
    const c = (t % 3200) / 3200;
    const e = x => 0.5 - 0.5 * Math.cos(Math.PI * x);
    if (c < 0.14) return 0;
    if (c < 0.5) return e((c - 0.14) / 0.36);
    if (c < 0.64) return 1;
    return 1 - e((c - 0.64) / 0.36);
  }

  function svg(id, cls) {
    return `<svg class="rig ${cls || ''}" data-rig="${id}" viewBox="0 0 200 200" role="img" aria-label="Animație ${EX[id].name}"><g>${frame(EX[id].rig, 0.5)}</g></svg>`;
  }

  const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function loop(ts) {
    document.querySelectorAll('svg[data-rig]').forEach(el => {
      const r = el.getBoundingClientRect();
      if (r.bottom < 0 || r.top > innerHeight) return;
      el.firstChild.innerHTML = frame(EX[el.dataset.rig].rig, phase(ts + (el.dataset.off | 0)));
    });
    requestAnimationFrame(loop);
  }
  if (!still) requestAnimationFrame(loop);
  return { svg, frame };
})();

/* ---------- Efecte: confetti, val la atingere, numere care urcă ---------- */
const FX = (() => {
  const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let cv, ctx, parts = [], raf = 0;
  const COLORS = ['#f2c230', '#ece8e0', '#5b93ff', '#4fc38a', '#ff8a3d'];
  function canvas() {
    if (cv) return;
    cv = document.createElement('canvas'); cv.className = 'fx-canvas'; document.body.appendChild(cv);
    ctx = cv.getContext('2d');
    const fit = () => { const d = devicePixelRatio || 1; cv.width = innerWidth * d; cv.height = innerHeight * d; ctx.setTransform(d, 0, 0, d, 0, 0); };
    fit(); addEventListener('resize', fit);
  }
  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.life > 0);
    for (const p of parts) {
      p.vy += p.g; p.vx *= 0.985; p.vy *= 0.985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= 1;
      ctx.save(); ctx.globalAlpha = Math.min(1, p.life / 30); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.s / 2, 0, 7); ctx.fill(); } else ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      ctx.restore();
    }
    raf = parts.length ? requestAnimationFrame(tick) : 0;
  }
  function spawn(x, y, n, spread, power, g) {
    if (still) return; canvas();
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * spread, v = power * (0.5 + Math.random() * 0.7);
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, s: 5 + Math.random() * 6, c: COLORS[i % COLORS.length], life: 60 + Math.random() * 40, round: Math.random() < 0.3 });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function burst(el, n = 18) { if (!el) return; const r = el.getBoundingClientRect(); spawn(r.left + r.width / 2, r.top + r.height / 2, n, Math.PI * 2, 6, 0.18); }
  function celebrate() {
    spawn(innerWidth * 0.2, innerHeight * 0.9, 70, 1.1, 17, 0.32);
    setTimeout(() => spawn(innerWidth * 0.8, innerHeight * 0.9, 70, 1.1, 17, 0.32), 180);
    setTimeout(() => spawn(innerWidth * 0.5, innerHeight * 0.85, 60, 1.4, 19, 0.32), 380);
  }
  function countUp(root) {
    if (still) return;
    root.querySelectorAll('[data-count]').forEach(el => {
      const txt = el.textContent, m = txt.match(/[\d.]+(,\d+)?/); if (!m) return;
      const target = parseFloat(m[0].replace(/\./g, '').replace(',', '.')), dec = m[1] ? m[1].length - 1 : 0, t0 = performance.now();
      const step = t => {
        const k = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - k, 3);
        el.textContent = txt.replace(m[0], (target * e).toLocaleString('ro-RO', { minimumFractionDigits: dec, maximumFractionDigits: dec }));
        if (k < 1) requestAnimationFrame(step); else el.textContent = txt;
      };
      requestAnimationFrame(step);
    });
  }
  /* val la atingere */
  document.addEventListener('pointerdown', e => {
    if (still) return;
    const b = e.target.closest('.btn, .chip, .check, .set .ok, .ex-row, .nav button, .switch');
    if (!b) return;
    const r = b.getBoundingClientRect(), s = Math.max(r.width, r.height) * 2.2, w = document.createElement('span');
    w.className = 'ripple'; w.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - r.left - s / 2}px;top:${e.clientY - r.top - s / 2}px`;
    b.appendChild(w); setTimeout(() => w.remove(), 650);
  }, { passive: true });
  function pop(el) { if (!el || still) return; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
  return { burst, celebrate, countUp, pop };
})();

/* ---------- Ecran: Progres ---------- */
function chart(points, unit) {
  if (points.length < 2) return `<p class="empty">${points.length ? 'Încă un antrenament și apare graficul.' : 'Graficul apare după primele două înregistrări.'}</p>`;
  const W = 340, H = 170, L = 38, Rr = 40, T = 12, B = 24;
  const xs = points.map(p => p.t), ys = points.map(p => p.v);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  const span = Math.max(hi - lo, hi * 0.04, 1); lo = Math.floor((lo - span * 0.2)); hi = Math.ceil(hi + span * 0.2);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const X = t => L + (W - L - Rr) * (x1 === x0 ? 1 : (t - x0) / (x1 - x0));
  const Y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const ticks = [lo, (lo + hi) / 2, hi];
  const d = points.map((p, i) => `${i ? 'L' : 'M'}${X(p.t).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' ');
  const last = points[points.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafic progres">
    ${ticks.map(v => `<line class="grid" x1="${L}" x2="${W - Rr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${fmt(v, 0)}</text>`).join('')}
    <path class="areaA" d="${d} L${X(last.t)} ${H - B} L${X(x0)} ${H - B} Z"/>
    <path class="lineA" pathLength="1" d="${d}"/>
    ${points.slice(0, -1).map(p => `<circle class="dot" cx="${X(p.t)}" cy="${Y(p.v)}" r="2.5"/>`).join('')}
    <circle class="dot-ring" cx="${X(last.t)}" cy="${Y(last.v)}" r="5"/>
    <text class="endlbl" x="${X(last.t) + 9}" y="${Y(last.v) + 4}">${fmt(last.v)}</text>
    <text class="ax" x="${L}" y="${H - 6}">${fmtDate(x0)}</text><text class="ax" x="${W - Rr}" y="${H - 6}" text-anchor="end">${fmtDate(x1)}</text>
  </svg>`;
}
function deltaTxt(points, unit) {

}

let audioCtx = null;

      const s = audioCtx.currentTime + t; g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.35, s + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, s + 0.18);

  } catch (e) { }

}
function unlockAudio() { try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) { } }

    S.supps.push({ id: 's' + Date.now(), name, dose: $('#ns-dose').value.trim() || '1 doză', time: $('#ns-time').value || '09:00', on: true }); save(); render(); toast(`${name} a fost adăugat.`);
  }
});

render();
</script>
