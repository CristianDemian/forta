<!doctype html><html lang="ro"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Forța">
<meta name="theme-color" content="#120a0c"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="forta-cd-180.png">
<style>:root{padding-top:0;padding-bottom:0}.top{top:0!important;padding-top:calc(14px + env(safe-area-inset-top,0px))!important}[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Forța la Sală</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Saira+Condensed:wght@600;700;800&display=swap">
</head><body><style>/* Forța v2. Layout: o coloană de telefon cu antet subțire, o bandă video pe toată lățimea,
   carduri compacte și meniu plutitor; antrenamentul se deschide peste tot ecranul. */
:root {
  --bg: #0b0a0b;
  --surface: #151214;
  --surface-2: #1e191c;
  --surface-3: #282125;
  --line: rgba(255, 255, 255, .07);
  --line-2: rgba(255, 255, 255, .12);
  --fg: #f6f2f1;
  --muted: #9d9396;
  --faint: #6c6366;
  --accent: #e5232f;
  --red-hi: #ff5560;
  --red-deep: #a10f1b;
  --accent-ink: #ffffff;
  --blue: #ffffff;
  --good: #34c77b;
  --bad: #ff5a5f;
  --water: #3aa0ff;
  --sys: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, system-ui, sans-serif;
  --display: 'Saira Condensed', 'SF Pro Display', -apple-system, 'Arial Narrow', sans-serif;
  --body: var(--sys);
  --r: 16px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); min-height: 100%; overflow-x: clip; overscroll-behavior-x: none; -webkit-text-size-adjust: 100%; }
body { min-height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 400 15px/1.45 var(--sys); letter-spacing: -.01em;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; overflow-x: clip; touch-action: pan-y;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input, textarea { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
svg { flex: none; }

.app { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; min-height: 100%; padding-bottom: calc(104px + env(safe-area-inset-bottom, 0px)); }
.ambient { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.ambient i { position: absolute; border-radius: 50%; filter: blur(70px); }
.ambient i:nth-child(1) { width: 80vmax; height: 80vmax; top: -55vmax; right: -40vmax; background: var(--accent); opacity: .10; }
.ambient i:nth-child(2), .ambient i:nth-child(3) { display: none; }

/* ---------- Antet ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 11px;
  display: grid; grid-template-columns: minmax(0, 1fr); }
.top::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: repeating-linear-gradient(90deg, var(--accent) 0 18px, rgba(255,255,255,.85) 18px 36px); opacity: .9; }
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; white-space: nowrap; font: 700 19px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; }
.brand .b1 { color: var(--accent); }
.brand .b2 { margin-left: auto; color: var(--fg); }
.hbadge { height: 1.45em; width: auto; }
.today { display: none; }

main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 20px; display: grid; gap: 24px; }

/* ---------- Titluri de secțiune ---------- */
h2 { margin: 0; font: 600 13px/1.2 var(--sys); letter-spacing: .02em; color: var(--muted); text-transform: none; }
.sec { display: grid; gap: 10px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sec-head .count { font: 600 13px var(--sys); color: var(--fg); }
.eyebrow { font: 600 12px/1 var(--sys); letter-spacing: .06em; text-transform: uppercase; color: var(--red-hi); }
.daymeta { color: var(--muted); font-size: 13px; }

/* ---------- Banda video ---------- */
.buddy { display: block; position: relative; }
.buddy.full { width: 100vw; margin-left: calc(50% - 50vw); height: min(300px, 40vh); margin-bottom: -40px; overflow: hidden;
  background: radial-gradient(60% 80% at 50% 45%, #2a272b 0%, #161415 55%, var(--bg) 100%); }
.buddy.full::after { content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, var(--bg) 0%, transparent 14%, transparent 70%, var(--bg) 100%), linear-gradient(90deg, var(--bg) 0%, transparent 22%, transparent 78%, var(--bg) 100%); }
.buddy .b-vid, .buddy .b-poster { position: absolute; top: 0; left: 50%; transform: translateX(-50%); height: 100%; width: auto; aspect-ratio: 9 / 16; object-fit: cover; }
.buddy[data-vid] .b-vid { opacity: 0; transition: opacity .3s; }
.buddy[data-vid].playing .b-vid { opacity: 1; }
.buddy[data-vid].playing .b-poster { opacity: 0; transition: opacity .3s .1s; }
.b-vid::-webkit-media-controls, .b-vid::-webkit-media-controls-start-playback-button, .b-vid::-webkit-media-controls-overlay-play-button { display: none !important; -webkit-appearance: none; opacity: 0; }

/* ---------- Cardul zilei ---------- */
.next, .rest-day { position: relative; z-index: 1; overflow: hidden; border-radius: 22px; padding: 18px; display: grid; gap: 14px;
  background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.015)), var(--surface); border: 1px solid var(--line);
  box-shadow: 0 20px 40px -24px rgba(0,0,0,.8); }
.next::before, .rest-day::before { content: ''; position: absolute; left: 18px; right: 18px; top: 0; height: 2px; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); }
.next > *:not(.wm), .rest-day > *:not(.wm) { position: relative; z-index: 1; }
.dayname, .rest-title { margin: 6px 0 0; font: 700 26px/1.1 var(--sys); letter-spacing: -.02em; color: var(--fg); text-wrap: balance; }
.rest-day { justify-items: start; text-align: left; }
.rest-msg { margin: -6px 0 0; color: var(--muted); font-size: 14px; }
.next-up { width: 100%; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); }
.next-up small { grid-column: 1 / -1; font: 600 11px var(--sys); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.next-up b { font: 600 16px var(--sys); }
.next-up span { color: var(--red-hi); font-size: 13px; font-weight: 600; }
.wm { position: absolute; right: -24px; bottom: -24px; width: 150px; height: 150px; background: var(--badge, none) center / contain no-repeat; opacity: .06; pointer-events: none; z-index: 0; transform: rotate(-12deg); }
.rigs-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rigs-row .rig { width: 100%; height: 76px; background: var(--surface-2); border-radius: 12px; border: 1px solid var(--line); }

/* ---------- Butoane ---------- */
.btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 14px;
  font: 600 16px/1 var(--sys); letter-spacing: -.01em; text-transform: none; transition: transform .15s, filter .15s; }
.btn:active { transform: scale(.97); }
.btn-main { width: 100%; color: #fff; background: linear-gradient(180deg, var(--red-hi), var(--accent) 60%, #c81a26); box-shadow: 0 10px 24px -12px var(--accent), inset 0 1px 0 rgba(255,255,255,.25); }
.btn-ghost { min-height: 40px; font-size: 14px; padding: 0 14px; background: rgba(255,255,255,.06); border: 1px solid var(--line); color: var(--fg); }
.skip-btn { width: 100%; min-height: 44px; } .skip-btn svg { width: 18px; height: 18px; color: var(--muted); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 32px; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid var(--line); font: 500 13px var(--sys); color: var(--fg); }
.chip[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 18%, transparent); border-color: color-mix(in srgb, var(--accent) 60%, transparent); color: #fff; }
.link { color: var(--red-hi); font-weight: 600; font-size: 14px; padding: 6px 2px; }
.link.muted, .link.danger { color: var(--muted); }
.del { color: var(--muted); font-size: 13px; padding: 6px 8px; border-radius: 8px; }
.del.armed { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
.ripple { position: absolute; border-radius: 50%; background: currentColor; opacity: .16; transform: scale(0); animation: ripple .55s ease-out forwards; pointer-events: none; }
@keyframes ripple { to { transform: scale(1); opacity: 0; } }

/* ---------- Săptămâna ---------- */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 10px 6px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.wd { display: grid; justify-items: center; gap: 5px; padding: 2px 0; border-radius: 10px; }
.wd small { color: var(--faint); font-size: 11px; font-weight: 600; text-transform: uppercase; }
.wd span { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 600 13px var(--sys); color: var(--muted); border: 1.5px solid transparent; }
.wd.plan span { border-color: color-mix(in srgb, var(--accent) 70%, transparent); color: var(--fg); }
.wd.done span { background: var(--accent); color: #fff; }
.wd.done span svg { width: 14px; height: 14px; }
.wd.is-today small { color: var(--fg); }
.wd.is-today span { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--fg); }
.wd em { font-style: normal; font-size: 10px; color: var(--faint); }
.wd.plan em, .wd.done em { color: var(--red-hi); }

/* ---------- Statistici ---------- */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 2px; min-width: 0; }
.stat b { font: 700 22px/1.1 var(--sys); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); font-size: 12px; line-height: 1.3; }

/* ---------- Citatul zilei ---------- */
.quote { perspective: 1000px; }
.q-inner { position: relative; display: grid; width: 100%; text-align: left; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.3, 1.2, .4, 1); overflow: visible !important; }
.quote.open .q-inner { transform: rotateY(180deg); }
.q-face { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: var(--r); padding: 14px 16px; }
.q-front { display: grid; grid-template-columns: 40px 1fr; grid-template-rows: auto auto; gap: 1px 12px; align-items: center; color: #fff;
  background: linear-gradient(120deg, var(--accent), var(--red-deep)); box-shadow: 0 12px 26px -16px var(--accent); }
.q-front b { font: 600 16px var(--sys); align-self: end; }
.q-front small { grid-column: 2; font-size: 13px; opacity: .85; align-self: start; }
.q-gift { grid-row: 1 / span 2; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; background: rgba(255,255,255,.18); }
.q-gift svg { width: 22px; height: 22px; }
.q-back { transform: rotateY(180deg); background: var(--surface); border: 1px solid var(--line); display: grid; gap: 8px; }
.q-mark { font: 700 34px/0.5 Georgia, serif; color: var(--accent); height: 14px; }
.q-back p { margin: 0; font: 500 16px/1.45 var(--sys); color: var(--fg); text-wrap: pretty; }
.q-who { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.q-who b { font: 600 13px var(--sys); color: var(--red-hi); }
.q-who small { color: var(--muted); font-size: 12px; }

/* ---------- Suplimente și apă ---------- */
.checklist { display: grid; gap: 1px; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); background: var(--line); }
.check { display: grid; grid-template-columns: 48px 1fr 26px; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 11px 14px; background: var(--surface); }
.check time { font: 600 14px var(--sys); color: var(--muted); font-variant-numeric: tabular-nums; }
.check strong { display: block; font-weight: 500; font-size: 15px; }
.check em { font-style: normal; color: var(--muted); font-size: 12.5px; }
.tick { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; transition: background .2s, border-color .2s; }
.tick svg { width: 14px; height: 14px; opacity: 0; color: #fff; }
.check.taken .tick { background: var(--good); border-color: var(--good); }
.check.taken .tick svg { opacity: 1; }
.check.taken strong { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(255,255,255,.3); }
.water { display: grid; gap: 10px; padding: 14px; margin-bottom: 8px; border-radius: var(--r); background: linear-gradient(135deg, color-mix(in srgb, var(--water) 14%, var(--surface)), var(--surface)); border: 1px solid color-mix(in srgb, var(--water) 22%, transparent); }
.water-top { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: center; }
.water-top .drop { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; background: linear-gradient(160deg, #8fd0ff, var(--water)); color: #fff; }
.water-top .drop svg { width: 18px; height: 18px; }
.water-top strong { display: block; font-weight: 600; font-size: 15px; }
.water-top em { font-style: normal; color: var(--muted); font-size: 12.5px; }
.water-dots { display: grid; grid-template-columns: repeat(auto-fill, minmax(14px, 1fr)); gap: 4px; }
.water-dots i { height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); }
.water-dots i.on { background: var(--water); box-shadow: 0 0 8px -2px var(--water); }
.water-btns { display: grid; grid-template-columns: 44px 1fr; gap: 8px; }
.water-btns .btn { min-height: 40px; font-size: 14px; }
.water-btns .btn-main { background: linear-gradient(180deg, #5fb4ff, var(--water) 60%, #2384e8); box-shadow: 0 10px 22px -12px var(--water); }
.water-btns .btn-ghost { font-size: 20px; padding: 0; }
.supp { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 10px; }
.supp.off { opacity: .55; }
.supp-top { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
.supp-top strong { font-weight: 600; display: block; font-size: 15px; }
.supp-top small { color: var(--muted); font-size: 12.5px; }
.supp-tip { font-size: 12.5px; color: var(--muted); }
.supp-ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.supp-ctl input[type="time"] { min-height: 36px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); padding: 0 10px; font: 600 15px var(--sys); }
.ic-row { display: inline-flex !important; align-items: center; gap: 8px; } .ic-row svg { width: 16px; height: 16px; color: var(--water); }
.switch { position: relative; width: 46px; height: 28px; border-radius: 999px; background: var(--surface-3); flex: none; transition: background .2s; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.4); transition: transform .25s cubic-bezier(.3, 1.3, .4, 1); }
.switch[aria-checked="true"] { background: var(--good); }
.switch[aria-checked="true"]::after { transform: translateX(18px); }
.add-form { display: grid; gap: 8px; background: var(--surface); border: 1px solid var(--line); padding: 14px; border-radius: var(--r); }
.add-form .two { display: grid; grid-template-columns: 1fr 120px; gap: 8px; }
.notice { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; }
.notice p { margin: 0; color: var(--muted); font-size: 13.5px; }
.notice strong { font-weight: 600; }
.state-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); margin-right: 6px; vertical-align: 1px; }
.state-dot.on { background: var(--good); box-shadow: 0 0 8px var(--good); }
.field { width: 100%; min-height: 44px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); padding: 0 12px; font-size: 15px; }
.field:focus { border-color: color-mix(in srgb, var(--accent) 60%, transparent); outline: none; }
textarea.field { padding: 10px 12px; min-height: 90px; resize: vertical; font-size: 12px; }
.row-input { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.empty { color: var(--muted); font-size: 13.5px; padding: 18px 12px; text-align: center; border: 1px dashed var(--line-2); border-radius: var(--r); margin: 0; }
.badge-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.badge-prev { width: 48px; height: 48px; object-fit: contain; border-radius: 12px; background: var(--surface-2); padding: 6px; }

/* ---------- Program ---------- */
.day-block { display: grid; gap: 8px; }
.day-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.day-title h3 { margin: 0; font: 700 19px/1.15 var(--sys); letter-spacing: -.02em; }
.day-title h3 span { display: block; font: 600 12px var(--sys); letter-spacing: .06em; text-transform: uppercase; color: var(--red-hi); margin-bottom: 2px; }
.ex-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.ex-row { display: grid; grid-template-columns: 48px 1fr 18px; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 8px 12px 8px 8px; }
.ex-row .rig { width: 48px; height: 48px; background: var(--surface-2); border-radius: 10px; }
.ex-row strong { display: block; font-weight: 500; font-size: 15px; line-height: 1.25; }
.ex-row small { color: var(--muted); font-size: 12.5px; }
.chev { width: 18px; height: 18px; color: var(--faint); transition: transform .2s; }
.ex-item.open .chev { transform: rotate(180deg); }
.ex-detail { padding: 2px 14px 14px; display: grid; gap: 10px; animation: rise .3s ease-out; }
.ex-detail .rig.big { width: 100%; max-width: 220px; aspect-ratio: 1; justify-self: center; background: var(--surface-2); border-radius: 16px; }
.target { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.06); font-size: 12px; color: var(--fg); }
.pill.up { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); font-weight: 600; }
.cues { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; counter-reset: c; font-size: 14px; }
.cues li { display: block; position: relative; padding-left: 26px; counter-increment: c; }
.cues li::before { content: counter(c); position: absolute; left: 0; top: 1px; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font: 600 11px var(--sys); background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--red-hi); }
.mistake { background: color-mix(in srgb, var(--bad) 10%, transparent); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; }
.mistake b { color: var(--bad); font-weight: 600; }
.rest-info { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }

/* ---------- Grafice ---------- */
.chart-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; }
.chart-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.chart-head b { font: 700 24px/1 var(--sys); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.chart-head small { color: var(--muted); font-size: 12.5px; }
.delta-up { color: var(--good); font-weight: 600; font-size: 12.5px; }
.delta-down { color: var(--bad); font-weight: 600; font-size: 12.5px; }
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--faint); font: 11px var(--sys); }
.chart .lineA { fill: none; stroke: var(--accent); stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1s ease-out forwards; }
.chart .areaA { fill: var(--accent); opacity: .12; }
.chart .dot { fill: var(--accent); }
.chart .dot-ring { fill: var(--bg); stroke: var(--accent); stroke-width: 2.25; }
.chart .endlbl { fill: var(--fg); font: 600 12px var(--sys); }
@keyframes draw { to { stroke-dashoffset: 0; } }
.ex-pick { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; touch-action: pan-x pan-y; }
.ex-pick::-webkit-scrollbar { display: none; }
.ex-pick .chip { flex: none; }

/* ---------- Animații: un singur schelet, două poziții per exercițiu ---------- */
const Rig = (() => {
  const R = Math.PI / 180, L = { T: 48, UA: 28, FA: 26, TH: 34, SH: 32 };
  const d = (a, l) => [Math.sin(a * R) * l, Math.cos(a * R) * l];
  const add = (p, q) => [p[0] + q[0], p[1] + q[1]];
  const sub = (p, q) => [p[0] - q[0], p[1] - q[1]];
  const f = n => n.toFixed(1);
  const ln = (p, q, c) => `<line class="${c}" x1="${f(p[0])}" y1="${f(p[1])}" x2="${f(q[0])}" y2="${f(q[1])}"/>`;
  const poly = (pts, c) => `<polyline class="${c}" points="${pts.map(p => f(p[0]) + ',' + f(p[1])).join(' ')}"/>`;

  function lerp(A, B, k) {
    const o = {};
    for (const key in A) {
      const a = A[key], b = B[key];
      o[key] = Array.isArray(a) ? [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k] : a + (b - a) * k;
    }
    return o;
  }

  function side(P, eq) {
    const td = [Math.sin(P.t * R), -Math.cos(P.t * R)];
    const tv = [td[0] * L.T, td[1] * L.T];
    let hip, sh, el, hand, knee, foot;
    if (P.foot) {
      foot = P.foot; knee = sub(foot, d(P.sh, L.SH)); hip = sub(knee, d(P.th, L.TH));
      sh = add(hip, tv); el = add(sh, d(P.ua, L.UA)); hand = add(el, d(P.fa, L.FA));
    } else if (P.hand) {
      hand = P.hand; el = sub(hand, d(P.fa, L.FA)); sh = sub(el, d(P.ua, L.UA)); hip = sub(sh, tv);
      knee = add(hip, d(P.th, L.TH)); foot = add(knee, d(P.sh, L.SH));
    } else {
      hip = P.hip; sh = add(hip, tv); el = add(sh, d(P.ua, L.UA)); hand = add(el, d(P.fa, L.FA));
      knee = add(hip, d(P.th, L.TH)); foot = add(knee, d(P.sh, L.SH));
    }
    const head = add(sh, [td[0] * 15, td[1] * 15]);
    const toe = add(foot, d(P.fd == null ? 90 : P.fd, 10));
    const pts = { hand, foot, sh };
    let back = '', front = '';
    for (const e of eq) {
      if (e.k === 'bench') {
        back += ln(e.a, e.b, 'prop w8');
        back += ln([e.a[0] + 8, e.a[1]], [e.a[0] + 8, 180], 'prop w4') + ln([e.b[0] - 8, e.b[1]], [e.b[0] - 8, 180], 'prop w4');
      } else if (e.k === 'pad') {
        back += ln(e.a, e.b, 'prop w8');
      } else if (e.k === 'bars') {
        back += ln([76, e.y], [132, e.y], 'prop w5') + ln([128, e.y], [128, 180], 'prop w4');
      } else if (e.k === 'plate') {
        const p = pts[e.at];
        front += `<circle class="eq-fill" cx="${f(p[0])}" cy="${f(p[1])}" r="12"/><circle class="hub" cx="${f(p[0])}" cy="${f(p[1])}" r="3"/>`;
      } else if (e.k === 'db') {
        const p = pts[e.at];
        front += `<rect class="eq-fill" x="${f(p[0] - 9)}" y="${f(p[1] - 4)}" width="18" height="8" rx="2"/>`;
      } else if (e.k === 'handle') {
        const p = pts[e.at];
        front += `<circle class="eq-fill" cx="${f(p[0])}" cy="${f(p[1])}" r="4.5"/>`;
      } else if (e.k === 'cable') {
        const p = pts[e.at];
        const to = e.to === 'up' ? [p[0], 12] : e.to === 'right' ? [190, p[1]] : e.to;
        back += ln(p, to, 'cable') + `<circle class="pulley" cx="${f(to[0])}" cy="${f(to[1])}" r="5"/>`;
      } else if (e.k === 'platform') {
        const p = pts[e.at], a = e.ang * R, n = [Math.cos(a), -Math.sin(a)];
        front += ln([p[0] + n[0] * 18 + Math.sin(a) * 4, p[1] + n[1] * 18 + Math.cos(a) * 4], [p[0] - n[0] * 18 + Math.sin(a) * 4, p[1] - n[1] * 18 + Math.cos(a) * 4], 'eq w6');
      }
    }
    return back +
      poly([hip, knee, foot, toe], 'limb w9') +
      ln(hip, sh, 'limb w14') +
      `<circle class="head" cx="${f(head[0])}" cy="${f(head[1])}" r="9.5"/>` +
      poly([sh, el, hand], 'limb w8') + front;
  }

  function frontView(P, eq) {
    const S = { r: [117, 68], l: [83, 68] };
    let out = '';
    const arm = (s, sign) => {
      const ul = P.ul == null ? 1 : P.ul, e = [s[0] + sign * Math.sin(P.ua * R) * 27 * ul, s[1] + Math.cos(P.ua * R) * 27];
      const h = [e[0] + sign * Math.sin(P.fa * R) * 25, e[1] + Math.cos(P.fa * R) * 25];
      return { e, h };
    };
    const ar = arm(S.r, 1), al = arm(S.l, -1);
    for (const x of eq) {
      if (x.k === 'cableF') {
        const tr = [200 - x.to[0], x.to[1]];
        out += ln(ar.h, tr, 'cable') + ln(al.h, x.to, 'cable') +
          `<circle class="pulley" cx="${tr[0]}" cy="${tr[1]}" r="5"/><circle class="pulley" cx="${x.to[0]}" cy="${x.to[1]}" r="5"/>`;
      }
    }
    out += poly([[93, 112], [91, 146], [90, 178]], 'limb w9') + poly([[107, 112], [109, 146], [110, 178]], 'limb w9');
    out += `<path class="torso" d="M84 66 L116 66 L110 112 L90 112 Z"/>`;
    out += `<circle class="head" cx="100" cy="50" r="10"/>`;
    out += poly([S.r, ar.e, ar.h], 'limb w8') + poly([S.l, al.e, al.h], 'limb w8');
    for (const x of eq) {
      if (x.k === 'dbF') {
        for (const h of [ar.h, al.h]) out += `<rect class="eq-fill" x="${f(h[0] - 4)}" y="${f(h[1] - 9)}" width="8" height="18" rx="2"/>`;
      } else if (x.k === 'padsF') {
        for (const h of [ar.h, al.h]) out += `<rect class="eq-fill" x="${f(h[0] - 5)}" y="${f(h[1] - 4)}" width="10" height="26" rx="4"/>`;
      } else if (x.k === 'cableF') {
        for (const h of [ar.h, al.h]) out += `<circle class="eq-fill" cx="${f(h[0])}" cy="${f(h[1])}" r="4.5"/>`;
      }
    }
    return out;
  }

  function frame(rig, k) {
    const P = lerp(rig.A, rig.B, k);
    return `<line class="ground" x1="14" y1="181" x2="186" y2="181"/>` + (rig.front ? frontView(P, rig.eq) : side(P, rig.eq));
  }

  /* 0 → A, 1 → B, cu pauze la capete */
  function phase(t) {
    const c = (t % 3200) / 3200;
    const e = x => 0.5 - 0.5 * Math.cos(Math.PI * x);
    if (c < 0.14) return 0;
    if (c < 0.5) return e((c - 0.14) / 0.36);
    if (c < 0.64) return 1;
    return 1 - e((c - 0.64) / 0.36);
  }

  function svg(id, cls) {
    return `<svg class="rig ${cls || ''}" data-rig="${id}" viewBox="0 0 200 200" role="img" aria-label="Animație ${EX[id].name}"><g>${frame(EX[id].rig, 0.5)}</g></svg>`;
  }

  const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function loop(ts) {
    document.querySelectorAll('svg[data-rig]').forEach(el => {
      const r = el.getBoundingClientRect();
      if (r.bottom < 0 || r.top > innerHeight) return;
      el.firstChild.innerHTML = frame(EX[el.dataset.rig].rig, phase(ts + (el.dataset.off | 0)));
    });
    requestAnimationFrame(loop);
  }
  if (!still) requestAnimationFrame(loop);
  return { svg, frame };
})();

/* ---------- Efecte: confetti, val la atingere, numere care urcă ---------- */
const FX = (() => {
  const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let cv, ctx, parts = [], raf = 0;
  const COLORS = ['#e4202e', '#ffffff', '#ff4b57', '#9e0f1a', '#ffd9dc'];
  function canvas() {
    if (cv) return;
    cv = document.createElement('canvas'); cv.className = 'fx-canvas'; document.body.appendChild(cv);
    ctx = cv.getContext('2d');
    const fit = () => { const d = devicePixelRatio || 1; cv.width = innerWidth * d; cv.height = innerHeight * d; ctx.setTransform(d, 0, 0, d, 0, 0); };
    fit(); addEventListener('resize', fit);
  }
  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.life > 0);
    for (const p of parts) {
      p.vy += p.g; p.vx *= 0.985; p.vy *= 0.985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= 1;
      ctx.save(); ctx.globalAlpha = Math.min(1, p.life / 30); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.s / 2, 0, 7); ctx.fill(); } else ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      ctx.restore();
    }
    raf = parts.length ? requestAnimationFrame(tick) : 0;
  }
  function spawn(x, y, n, spread, power, g) {
    if (still) return; canvas();
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * spread, v = power * (0.5 + Math.random() * 0.7);
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, s: 5 + Math.random() * 6, c: COLORS[i % COLORS.length], life: 60 + Math.random() * 40, round: Math.random() < 0.3 });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function burst(el, n = 18) { if (!el) return; const r = el.getBoundingClientRect(); spawn(r.left + r.width / 2, r.top + r.height / 2, n, Math.PI * 2, 6, 0.18); }
  function celebrate() {
    spawn(innerWidth * 0.2, innerHeight * 0.9, 70, 1.1, 17, 0.32);
    setTimeout(() => spawn(innerWidth * 0.8, innerHeight * 0.9, 70, 1.1, 17, 0.32), 180);
    setTimeout(() => spawn(innerWidth * 0.5, innerHeight * 0.85, 60, 1.4, 19, 0.32), 380);
  }
  function countUp(root) {
    if (still) return;
    root.querySelectorAll('[data-count]').forEach(el => {
      const txt = el.textContent, m = txt.match(/[\d.]+(,\d+)?/); if (!m) return;
      const target = parseFloat(m[0].replace(/\./g, '').replace(',', '.')), dec = m[1] ? m[1].length - 1 : 0, t0 = performance.now();
      const step = t => {
        const k = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - k, 3);
        el.textContent = txt.replace(m[0], (target * e).toLocaleString('ro-RO', { minimumFractionDigits: dec, maximumFractionDigits: dec }));
        if (k < 1) requestAnimationFrame(step); else el.textContent = txt;
      };
      requestAnimationFrame(step);
    });
  }
  /* val la atingere */
  document.addEventListener('pointerdown', e => {
    if (still) return;
    const b = e.target.closest('.btn, .chip, .check, .set .ok, .ex-row, .nav button, .switch');
    if (!b) return;
    const r = b.getBoundingClientRect(), s = Math.max(r.width, r.height) * 2.2, w = document.createElement('span');
    w.className = 'ripple'; w.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - r.left - s / 2}px;top:${e.clientY - r.top - s / 2}px`;
    b.appendChild(w); setTimeout(() => w.remove(), 650);
  }, { passive: true });
  function pop(el) { if (!el || still) return; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
  return { burst, celebrate, countUp, pop };
})();

/* ---------- Mini-Cristian: clipurile video, care rulează mereu în buclă ---------- */
const Buddy = (() => {
  const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cache = {};
  /* un singur element video per clip, refolosit la fiecare redesenare, ca să nu se oprească niciodată */
  function el(name, label) {
    if (cache[name]) return cache[name];
    const v = document.createElement('video');
    v.className = 'b-vid'; v.src = name + '.mp4'; v.poster = name + '.jpg';
    v.muted = true; v.defaultMuted = true; v.loop = true; v.autoplay = true; v.playsInline = true; v.preload = 'auto';
    v.setAttribute('muted', ''); v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', ''); v.setAttribute('aria-label', label);
    v.disablePictureInPicture = true; v.controls = false;
    const kick = () => { if (!still && v.isConnected && v.paused) { const p = v.play(); if (p && p.catch) p.catch(() => { }); } };
    v.addEventListener('pause', () => setTimeout(kick, 50));
    v.addEventListener('ended', () => { v.currentTime = 0; kick(); });
    v.addEventListener('stalled', () => setTimeout(kick, 500));
    v.addEventListener('canplay', kick);
    const mark = on => { if (v.parentNode) v.parentNode.classList.toggle('playing', on); };
    v.addEventListener('playing', () => mark(true));
    v.addEventListener('pause', () => mark(false));
    cache[name] = v; return v;
  }
  const slot = (name, label, cls = '') => `<div class="buddy ${cls}" data-vid="${name}" data-label="${label}"><img class="b-poster" src="${name}.jpg" alt=""></div>`;
  const svg = slot('mini-cristian', 'Mini-Cristian dansează, face flotări și o tumbă');
  const flex = slot('mini-cristian-flex', 'Mini-Cristian își arată bicepșii și ridică degetul mare', 'flex');
  function playAll() {
    if (still) return;
    for (const k in cache) { const v = cache[k]; if (v.isConnected && v.paused) { const p = v.play(); if (p && p.catch) p.catch(() => { }); } }
  }
  function start() {
    document.querySelectorAll('.buddy[data-vid]').forEach(s => { const v = el(s.dataset.vid, s.dataset.label); if (v.parentNode !== s) s.appendChild(v); s.classList.toggle('playing', !v.paused); });
    playAll();
  }
  /* orice atingere repornește clipul (necesar când iPhone-ul e în modul Economisire baterie) */
  ['touchstart', 'pointerdown', 'scroll'].forEach(e => document.addEventListener(e, playAll, { passive: true, capture: true }));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') playAll(); });
  addEventListener('pageshow', playAll); addEventListener('focus', playAll);
  setInterval(playAll, 2000);
  return { svg, flex, start };
})();

function chart(points, unit) {

  const W = 340, H = 170, L = 38, Rr = 40, T = 12, B = 24;

  let lo = Math.min(...ys), hi = Math.max(...ys);

  const d = points.map((p, i) => `${i ? 'L' : 'M'}${X(p.t).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' ');
  const last = points[points.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafic progres">
    ${ticks.map(v => `<line class="grid" x1="${L}" x2="${W - Rr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${fmt(v, 0)}</text>`).join('')}

    <text class="ax" x="${L}" y="${H - 6}">${fmtDate(x0)}</text><text class="ax" x="${W - Rr}" y="${H - 6}" text-anchor="end">${fmtDate(x1)}</text>

}

  const g = $('#go'); if (g.hidden) return;
  clearTimeout(goT); g.hidden = true; g.classList.remove('show');
  const nx = g.dataset.next; if (nx) { const c = $('#wex-' + nx); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
}
document.addEventListener('pointerdown', e => { if (e.target.closest('#go')) closeGo(); });
function nextUndone(dayId, fromId) {
  const ex = byId(dayId).ex, i = ex.indexOf(fromId);
  for (let k = 1; k <= ex.length; k++) { const id = ex[(i + k) % ex.length]; if (S.active.sets[id].some(s => !s.done)) return id; }
  return null;
}

/* ---------- Detaliu antrenament din istoric ---------- */
let sheetId = null;
function openSession(id) { sheetId = id; renderSheet(); const sh = $('#sheet'); sh.scrollTop = 0; sh.classList.remove('slide-in'); void sh.offsetWidth; sh.classList.add('slide-in'); }
function closeSheet() { sheetId = null; const sh = $('#sheet'); sh.hidden = true; sh.innerHTML = ''; if (!S.active) document.body.style.overflow = ''; }
function exHistory(exId, upTo) {
  return sessionsSorted().filter(s => s.date <= upTo && s.ex[exId] && s.ex[exId].length)
    .map(s => ({ t: s.date, best: Math.max(...s.ex[exId].map(x => e1rm(x.kg, x.reps))), top: Math.max(...s.ex[exId].map(x => x.kg)), vol: s.ex[exId].reduce((v, x) => v + x.kg * x.reps, 0) }));
}
function bars(sets) {
  const max = Math.max(...sets.map(x => x.kg * x.reps), 1);
  return `<div class="sbars">${sets.map((x, i) => `<div class="sbar"><i style="--h:${Math.max(8, 100 * x.kg * x.reps / max)}%;--d:${i * 80}ms"></i><b class="num">${fmt(x.kg)}<small>kg</small></b><span class="num">× ${x.reps}</span></div>`).join('')}</div>`;
}
function renderSheet() {
  const s = S.sessions.find(x => x.id === sheetId), sh = $('#sheet');
  if (!s) { closeSheet(); return; }
  const d = byId(s.day), order = d.ex.filter(id => s.ex[id]).concat(Object.keys(s.ex).filter(id => !d.ex.includes(id)));
  const nsets = Object.values(s.ex).reduce((a, x) => a + x.length, 0);
  sh.hidden = false; document.body.style.overflow = 'hidden';
  sh.innerHTML = `<header class="w-head"><div class="w-head-in">
    <div class="w-title"><span>${new Date(s.date).toLocaleDateString('ro-RO', { weekday: 'long', day: 'numeric', month: 'long' })}</span> ${esc(d.name)}</div>
    <button class="btn btn-ghost w-finish" data-close-sheet>Închide</button></div></header>
  <div class="w-body">
    <section class="stats">
      <div class="stat"><b class="num">${Math.round((s.dur || 0) / 60000)}</b><small>minute</small></div>
      <div class="stat"><b class="num">${nsets}</b><small>serii făcute</small></div>
      <div class="stat"><b class="num">${fmt(volume(s) / 1000, 1)}t</b><small>volum total ridicat</small></div>
    </section>
    ${order.map(id => {
      const ex = EX[id], sets = s.ex[id], hist = exHistory(id, s.date), prev = hist.length > 1 ? hist[hist.length - 2] : null, cur = hist[hist.length - 1];
      const dl = prev ? cur.best - prev.best : null, vol = sets.reduce((v, x) => v + x.kg * x.reps, 0);
      return `<article class="wex hx">
        <div class="wex-top">${Rig.svg(id)}<div><h3>${esc(ex.name)}</h3><small>${sets.length} serii · ${fmt(vol, 0)} kg volum</small>
          ${dl != null ? `<span class="pill ${dl >= 0 ? 'up' : ''}" style="margin-top:6px">${dl >= 0 ? '▲ +' : '▼ −'}${fmt(Math.abs(dl))} kg forță față de data trecută</span>` : '<span class="pill" style="margin-top:6px">Prima înregistrare</span>'}</div></div>
        ${bars(sets)}
        <div class="hx-chart"><div class="hx-h">Progres la acest exercițiu <small>maxim estimat, kg</small></div>${chart(hist.map(h => ({ t: h.t, v: h.best })), 'kg')}</div>
      </article>`;
    }).join('')}
    <div class="w-foot"><button class="link muted" data-del-sess="${s.id}">Șterge acest antrenament</button></div>
  </div>`;
}

/* ---------- Mesaje scurte ---------- */
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }
function armButton(btn, label, cb) {
  if (btn.classList.contains('armed')) { cb(); return; }
  const orig = btn.textContent; btn.classList.add('armed'); btn.textContent = label;
  setTimeout(() => { if (btn.isConnected) { btn.classList.remove('armed'); btn.textContent = orig; } }, 3500);
}

/* ---------- Evenimente ---------- */
document.addEventListener('click', e => {
  unlockAudio();
  const t = e.target.closest('button'); if (!t) return;
  const ds = t.dataset;
  if (ds.tab) { tab = ds.tab; try { localStorage.setItem('forta-tab', tab); } catch (er) { } render(); window.scrollTo(0, 0); return; }
  if (ds.start) { showOthers = false; startWorkout(ds.start); return; }
  if ('others' in ds) { showOthers = true; render(); return; }
  if ('skip' in ds) { S.skips = S.skips || {}; S.skips[dayKey()] = 1; for (const k of Object.keys(S.skips)) if (k < dayKey(new Date(Date.now() - 60 * DAYMS))) delete S.skips[k]; save(); lastTab = null; render(); toast('Odihnă bifată. Ne vedem la următorul antrenament.'); return; }
  if ('unskip' in ds) { if (S.skips) delete S.skips[dayKey()]; save(); lastTab = null; render(); return; }
  if (ds.take) {
    const k = dayKey(), arr = S.suppLog[k] = S.suppLog[k] || [];
    const i = arr.indexOf(ds.take); i >= 0 ? arr.splice(i, 1) : arr.push(ds.take);
    for (const key of Object.keys(S.suppLog)) if (key < dayKey(new Date(Date.now() - 60 * DAYMS))) delete S.suppLog[key];
    save(); render();
    if (i < 0) { const el = document.querySelector(`[data-take="${ds.take}"] .tick`); FX.pop(el); FX.burst(el, 14); }
    return;
  }
  if (ds.open) { openEx.has(ds.open) ? openEx.delete(ds.open) : openEx.add(ds.open); render(); return; }
  if (ds.pick) { pickEx = ds.pick; render(); return; }
  if (ds.toggle) { const s = S.supps.find(x => x.id === ds.toggle); s.on = !s.on; save(); render(); return; }
  if (ds.delSupp) { armButton(t, 'Sigur?', () => { S.supps = S.supps.filter(x => x.id !== ds.delSupp); save(); render(); toast('Suplimentul a fost șters.'); }); return; }
  if (ds.delSess) { armButton(t, 'Apasă din nou ca să ștergi', () => { S.sessions = S.sessions.filter(x => x.id !== ds.delSess); save(); closeSheet(); render(); toast('Antrenamentul a fost șters.'); }); return; }
  if ('done' in ds) {
    const row = t.closest('.set'), id = row.dataset.ex, i = +row.dataset.i, x = S.active.sets[id][i];
    if (!x.done) {
      const kgI = row.querySelector('[data-f="kg"]'), rpI = row.querySelector('[data-f="reps"]');
      if (!x.kg && kgI.placeholder !== 'kg') x.kg = kgI.placeholder;
      if (!x.reps && /^\d+$/.test(rpI.placeholder)) x.reps = rpI.placeholder;
      if (!parseInt(x.reps)) { rpI.focus(); toast('Scrie câte repetări ai făcut.'); return; }
      x.done = true; kgI.value = x.kg; rpI.value = x.reps;
      const ex = EX[id], isLastOfAll = Object.values(S.active.sets).flat().every(s => s.done);
      const exDone = S.active.sets[id].every(s => s.done);
      if (isLastOfAll) { stopRest(); toast('Toate seriile sunt gata! Apasă Termină și salvează.'); }
      else if (exDone) { const nx = nextUndone(S.active.day, id); startRest(EX[nx].switchRest, ex.name, nx); toast(`Gata cu ${ex.name}. Treci la ${EX[nx].name}.`); }
      else startRest(ex.rest, ex.name);
      FX.pop(t); FX.burst(t, 16);
      if (S.active.sets[id].every(s => s.done)) setTimeout(() => FX.burst($('#wex-' + id + ' h3'), 30), 120);
    } else x.done = false;
    row.classList.toggle('done', x.done);
    const card = $('#wex-' + id); card.classList.toggle('complete', S.active.sets[id].every(s => s.done));
    save(); updateProgress(); return;
  }
  if (ds.addset) { const arr = S.active.sets[ds.addset]; arr.push({ kg: arr.length ? arr[arr.length - 1].kg : '', reps: '', done: false }); save(); const y = $('#workout').scrollTop; renderWorkout(); $('#workout').scrollTop = y; return; }
  if (ds.delset) {
    const arr = S.active.sets[ds.delset]; if (arr.length <= 1) return;
    let k = -1; for (let j = arr.length - 1; j >= 0; j--) if (!arr[j].done) { k = j; break; }
    arr.splice(k >= 0 ? k : arr.length - 1, 1); save(); const y = $('#workout').scrollTop; renderWorkout(); $('#workout').scrollTop = y; return;
  }
  if (ds.sess) { openSession(ds.sess); return; }
  if ('closeSheet' in ds) { closeSheet(); return; }
  if (ds.howto) { const k = 'w' + ds.howto; openEx.has(k) ? openEx.delete(k) : openEx.add(k); const y = $('#workout').scrollTop; renderWorkout(); $('#workout').scrollTop = y; return; }
  if ('finish' in ds) { armButton(t, 'Apasă din nou', finishWorkout); return; }
  if ('cancel' in ds) { armButton(t, 'Apasă din nou ca să anulezi, fără salvare', () => { S.active = null; save(); stopRest(); render(); }); return; }
  if (ds.rest) { if (!rest) return; if (ds.rest === 'x') stopRest(); else { rest.end += (+ds.rest) * 1000; rest.total = Math.max(rest.total, (rest.end - Date.now()) / 1000); drawRest(); } return; }
  if ('backup' in ds) {
    const txt = JSON.stringify({ ...S, active: null });
    navigator.clipboard.writeText(txt).then(() => toast('Datele au fost copiate. Lipește-le într-o notiță.')).catch(() => { $('#restore').hidden = false; const ta = $('#restore-txt'); ta.value = txt; ta.select(); toast('Textul e selectat. Copiază-l manual.'); });
    return;
  }
  if ('restoreOpen' in ds) { $('#restore').hidden = !$('#restore').hidden; return; }
  if ('restore' in ds) {
    try { const d = JSON.parse($('#restore-txt').value); if (!Array.isArray(d.sessions)) throw 0; S = Object.assign(fresh(), d); save(); render(); toast('Datele au fost restaurate.'); }
    catch (er) { toast('Textul nu pare o copie validă. Lipește tot textul copiat.'); }
    return;
  }
  if ('badgeDel' in ds) { BADGE = ''; try { localStorage.removeItem('forta-badge'); } catch (er) { } render(); return; }
  if (ds.water) {
    const k = dayKey(), w = S.water; w.log[k] = Math.max(0, (w.log[k] || 0) + (+ds.water));
    for (const key of Object.keys(w.log)) if (key < dayKey(new Date(Date.now() - 60 * DAYMS))) delete w.log[key];
    save(); render(); if (+ds.water > 0) { const el = document.querySelector('.water-dots i.on:last-of-type') || document.querySelector('.water .drop'); FX.burst(document.querySelector('.water .drop'), 14); }
    return;
  }
  if ('waterToggle' in ds) { S.water.on = !S.water.on; save(); render(); return; }
  if ('quote' in ds) {
    const q = t.closest('.quote'); if (q.classList.contains('open')) return;
    try { localStorage.setItem('forta-quote', dayKey()); } catch (er) { }
    q.classList.add('open'); setTimeout(() => FX.celebrate && FX.burst(q, 40), 350); return;
  }
  if (ds.push) { Push.action(ds.push); return; }
});
document.addEventListener('input', e => {
  const f = e.target.dataset.f;
  if (f) { const row = e.target.closest('.set'); S.active.sets[row.dataset.ex][+row.dataset.i][f] = e.target.value.trim(); save(); }
});
document.addEventListener('change', e => {
  if (e.target.dataset.wtime && e.target.value) { S.water[e.target.dataset.wtime] = e.target.value.slice(0, 2) + ':00'; save(); render(); toast('Intervalul pentru apă a fost actualizat.'); return; }
  if (e.target.id === 'badge-file' && e.target.files[0]) {
    const img = new Image(), url = URL.createObjectURL(e.target.files[0]);
    img.onload = () => {
      BADGE = cutBackground(img); try { localStorage.setItem('forta-badge', BADGE); localStorage.setItem('forta-badge-cut', '1'); } catch (er) { toast('Imaginea e prea mare. Încearcă alta.'); }
      URL.revokeObjectURL(url); render(); toast('Emblema a fost pusă.');
    };
    img.src = url; return;
  }
  const id = e.target.dataset.time;
  if (id && e.target.value) { S.supps.find(x => x.id === id).time = e.target.value; save(); toast('Ora a fost actualizată.'); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'bw-form') {
    const v = parseNum($('#bw').value); if (!v || v < 30 || v > 250) { toast('Scrie greutatea în kg, de exemplu 82,5.'); return; }
    const k = dayKey(); S.body = S.body.filter(b => dayKey(new Date(b.t)) !== k); S.body.push({ t: Date.now(), kg: v }); S.body.sort((a, b) => a.t - b.t); save(); render(); toast('Greutatea a fost salvată.');
  }
  if (e.target.id === 'add-supp') {
    const name = $('#ns-name').value.trim(); if (!name) return;
    S.supps.push({ id: 's' + Date.now(), name, dose: $('#ns-dose').value.trim() || '1 doză', time: $('#ns-time').value || '09:00', on: true }); save(); render(); toast(`${name} a fost adăugat.`);
  }
});

render();
(function () {
  const sp = document.getElementById('splash'); if (!sp) return;
  const v = sp.querySelector('video'); v.muted = true;
  const p = v.play(); if (p && p.catch) p.catch(() => { });
  v.addEventListener('playing', () => sp.classList.add('vid'));
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const hide = () => { if (sp.classList.contains('out')) return; sp.classList.add('out'); setTimeout(() => { sp.remove(); }, 650); };
  setTimeout(hide, still ? 700 : 2600);
  sp.addEventListener('pointerdown', hide);
})();
</script>
</body></html>
