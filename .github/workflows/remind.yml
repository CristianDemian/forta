name: Mementouri suplimente
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Trimite o notificare de test (1 = da)'
        required: false
        default: '0'
permissions:
  contents: write
concurrency:
  group: remind
  cancel-in-progress: false
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: date
          path: data
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node scripts/remind.mjs data
        env:
          FORTA_KEYS: ${{ secrets.FORTA_KEYS }}
          TEST: ${{ github.event.inputs.test }}
      - name: Salvează ce s-a trimis
        working-directory: data
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "forta-bot"
            git config user.email "forta-bot@users.noreply.github.com"
            git add -A && git commit -m "Mementouri trimise" && git push
          fi
