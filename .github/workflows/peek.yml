name: Peek
on: workflow_dispatch
permissions:
  contents: write
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: date
      - run: |
          mkdir -p debug
          curl -sL -A "Mozilla/5.0" "https://lpf.ro/cluburi/dinamo-bucuresti/14/calendar" -o debug/cal.html || true
          curl -sL -A "Mozilla/5.0" "https://lpf.ro/cluburi/dinamo-bucuresti/14/rezultate" -o debug/rez.html || true
          curl -sL -A "Mozilla/5.0" "https://lpf.ro/cluburi/dinamo-bucuresti/14" -o debug/club.html || true
          ls -la debug
          git config user.name forta-bot; git config user.email forta-bot@users.noreply.github.com
          git add debug && git commit -m "debug lpf" && git push || true
