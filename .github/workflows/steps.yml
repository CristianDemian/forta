name: Pași din Sănătate
# Scurtătura de pe iPhone trimite pașii și kilometrii zilei; aici se scriu în steps.json pe ramura date.
on:
  repository_dispatch:
    types: [pasi]
permissions:
  contents: write
concurrency:
  group: steps
  cancel-in-progress: false
jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: date
      - name: Salvează
        env:
          P: ${{ toJson(github.event.client_payload) }}
        run: |
          node -e '
          const fs=require("fs"),p=JSON.parse(process.env.P||"{}");
          const num=v=>{const n=parseFloat(String(v??"0").replace(/\s/g,"").replace(",","."));return isFinite(n)?n:0;};
          const now=new Date(new Date().toLocaleString("en-US",{timeZone:"Europe/Bucharest"}));
          const pad=n=>String(n).padStart(2,"0");
          let d=String(p.date||"").trim(); if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) d=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
          let j={}; try{j=JSON.parse(fs.readFileSync("steps.json","utf8"));}catch(e){}
          const st=Math.round(num(p.steps)),km=num(p.km)||st*0.00076;
          j[d]={steps:st,km:Math.round(km*100)/100,t:`${pad(now.getHours())}:${pad(now.getMinutes())}`};
          const keep=Object.keys(j).sort().slice(-60),o={}; for(const k of keep)o[k]=j[k];
          fs.writeFileSync("steps.json",JSON.stringify(o,null,1));
          console.log(d,JSON.stringify(j[d]));'
          git config user.name "forta-bot"; git config user.email "forta-bot@users.noreply.github.com"
          git add steps.json; git diff --cached --quiet && exit 0; git commit -qm "Pași din Sănătate" && (git push -q origin HEAD:date || (git pull -q --rebase origin date && git push -q origin HEAD:date))
